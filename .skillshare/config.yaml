# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/project-config.schema.json
targets:
  - name: universal
    skills:
      mode: copy
  - name: claude
    skills:
      mode: copy
skills:
  - name: skillshare
    source: https://github.com/runkids/skillshare/skills/skillshare
  - name: find-skills
    source: https://github.com/vercel-labs/skills/find-skills
  - name: grill-me
    source: https://github.com/mattpocock/skills/skills/productivity/grill-me
  - name: grill-with-docs
    source: https://github.com/mattpocock/skills/skills/engineering/grill-with-docs
  - name: ask-matt
    source: https://github.com/mattpocock/skills/skills/engineering/ask-matt
  - name: setup-matt-pocock-skills
    source: https://github.com/mattpocock/skills/skills/engineering/setup-matt-pocock-skills
extras:
  - name: commands
    targets:
      - path: .claude/commands
        mode: copy
ignore:
  - .DS_Store
  - .git/
  - __pycache__/
audit:
  block_threshold: CRITICAL
