[project]
name = "nats-tester"
version = "0.1.0"
description = "NATS testing tool for Solguficky microservices"
requires-python = ">=3.10"
dependencies = ["click>=8.1.0", "protobuf>=4.25.0", "nats-py>=2.8.0", "uuid6>=2024.1.12; python_version < '3.14'"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
nats-tester = "nats_tester.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nats_tester"]
