[package]
name = "achievements-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
prost = "0.14"
tonic = "0.14"
tonic-health = "0.14"
tokio = { version = "1", features = ["full"] }
async-nats = "0.46"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
futures = "0.3"
anyhow = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[profile.release]
strip = true
