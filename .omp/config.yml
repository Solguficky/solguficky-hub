# Проектный слой настроек OMP для solguficky-hub.
# Слой ищется строго в текущем каталоге запуска, без обхода предков,
# поэтому файл обязан лежать в корне репозитория.

# git worktree add через bash OMP по умолчанию делает copy-on-write клон
# чекаута. Клон — отдельный репозиторий, он не виден в `git worktree list`
# основного дерева, а docs/standards/git/branching.md строит на этом списке
# всю дисциплину чистки stale-деревьев.
worktree:
  clone: false

# ВНИМАНИЕ: bash.patterns объявлен массивом, а массив верхнего слоя
# заменяет нижний целиком, а не дополняет его (проверено прогоном
# 2026-09-15). Поэтому список обязан быть самодостаточным: запреты
# повторены здесь, иначе проектный allow-лист молча снимет глобальные.
# Первое совпавшее правило выигрывает, поэтому запреты идут первыми.
#
# Почему allow-лист, а не смена approvalMode на yolo: правило `allow`
# понижает ярус команды с exec до write, то есть команда проходит молча
# в текущем режиме `write`, и режим менять не нужно. При этом остаются
# включёнными и запреты ниже, и встроенная проверка критических форм
# bash (`curl | sh`, `mkfs`, `dd of=/dev/`, `shutdown`), которую yolo
# пропускает. Аргумент за сам режим `write` — в docs/development/omp.md.
#
# Список не универсальный: в него входит то, что читает состояние или
# собирает проект. Запись в историю (`git commit`, `git push`,
# `gh pr create`) в него сознательно не входит и остаётся вопросом —
# на этом различии agent-execution-loop.md строит границу
# «внутри контура / вне контура».
bash:
  patterns:
    - match: "rm -rf *"
      approval: deny
    - match: "git push --force*"
      approval: deny
    - match: "git reset --hard*"
      approval: deny
    # Гейт и рецепты репозитория. `just verify` OMP видит как одну
    # несоставную команду: составные `cd x && ...` живут внутри тел
    # рецептов и исполняются самим just, мимо слоя одобрения.
    - match: "just *"
      approval: allow
    # Чтение состояния репозитория, ничего не меняет.
    - match: "git status*"
      approval: allow
    - match: "git diff*"
      approval: allow
    - match: "git log*"
      approval: allow
    - match: "git branch*"
      approval: allow
    - match: "git worktree list*"
      approval: allow
    # Индекс правится, история нет: откатывается одним `git reset`.
    - match: "git add*"
      approval: allow
    # Чтение и навигация по дереву.
    - match: "ls *"
      approval: allow
    - match: "cat *"
      approval: allow
    - match: "sed -n*"
      approval: allow
    - match: "rg *"
      approval: allow
    # Стеки репозитория. Сборка и тесты идут через `just`, но прямой
    # вызов инструмента нужен для точечной диагностики.
    - match: "go *"
      approval: allow
    - match: "dotnet *"
      approval: allow
    - match: "npm *"
      approval: allow
    - match: "pnpm *"
      approval: allow
    - match: "node *"
      approval: allow
    - match: "python *"
      approval: allow
    # Скрипты проверок репозитория, tools/*/check-*.sh.
    - match: "sh tools/*"
      approval: allow
    # GitHub только на чтение: создание PR остаётся вопросом.
    - match: "gh pr view*"
      approval: allow
    - match: "gh pr list*"
      approval: allow
    - match: "gh pr checks*"
      approval: allow
