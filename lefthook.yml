# Git-хуки репозитория. Включаются один раз командой `lefthook install`.
#
# Хук — это быстрая обратная связь, а не гейт: он локальный и обходится
# через `--no-verify`.
#
# Формат сообщения коммита в CI не проверяется намеренно
# (причина — в docs/development/ci.md), поэтому здесь он единственная
# автоматическая проверка.
#
# Локальные переопределения — в lefthook-local.yml, он в .gitignore.

commit-msg:
  commands:
    conventional-commit:
      # {1} — путь к файлу с сообщением коммита, который git передаёт хуку.
      run: sh tools/git-hooks/check-commit-message.sh {1}
