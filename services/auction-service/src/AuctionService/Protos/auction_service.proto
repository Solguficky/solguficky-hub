syntax = "proto3";

package auction;

option csharp_namespace = "AuctionService.Grpc";

service AuctionService {
  rpc GetAuctionStatus(GetAuctionStatusRequest) returns (AuctionStatusResponse);
  rpc GetLotStatus(GetLotStatusRequest) returns (LotStatusResponse);
  rpc CreateLot(CreateLotRequest) returns (LotResponse);
  rpc UpdateLot(UpdateLotRequest) returns (LotResponse);
  rpc DeleteLot(DeleteLotRequest) returns (Empty);
  rpc GetLots(GetLotsRequest) returns (GetLotsResponse);
}

message GetAuctionStatusRequest {
  string event_id = 1;
}

message AuctionStatusResponse {
  string event_id = 1;
  string phase = 2;
  repeated int32 lot_ids = 3;
}

message GetLotStatusRequest {
  string event_id = 1;
  int32 lot_id = 2;
}

message LotStatusResponse {
  int32 lot_id = 1;
  double current_price = 2;
  optional int64 leader_id = 3;
  optional int64 end_time = 4;
}

message CreateLotRequest {
  string event_id = 1;
  string title = 2;
  string description = 3;
  double starting_price = 4;
  double min_bid_step = 5;
  string image_url = 6;
}

message UpdateLotRequest {
  int32 lot_id = 1;
  string title = 2;
  string description = 3;
  double starting_price = 4;
  double min_bid_step = 5;
  string image_url = 6;
}

message DeleteLotRequest {
  int32 lot_id = 1;
}

message GetLotsRequest {
  string event_id = 1;
}

message GetLotsResponse {
  repeated LotInfo lots = 1;
}

message LotInfo {
  int32 id = 1;
  string event_id = 2;
  string title = 3;
  string description = 4;
  double starting_price = 5;
  double min_bid_step = 6;
  string image_url = 7;
}

message LotResponse {
  int32 id = 1;
  string event_id = 2;
  string title = 3;
  string description = 4;
  double starting_price = 5;
  double min_bid_step = 6;
  string image_url = 7;
  string created_at = 8;
}

message Empty {}
