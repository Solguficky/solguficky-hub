syntax = "proto3";

package notifications.v1;

import "notifications/v1/notifications.proto";

// Manages a person's meetup subscriptions, their notification category
// settings, the two manual broadcasts and the release-notes summaries of a
// bot's surface. Most callers present the internal identity of the person the
// command belongs to; the release-notes operations belong to no person and are
// the one exception. Outgoing notifications are not described here: this
// service publishes them to the bus, and that dictionary is a separate
// contract.
service NotificationsService {
  // Following a meetup. Carries no category choice: "I follow this" and "what
  // to send me" are separate, and neither is derived from the other.
  rpc SubscribeToMeetup(SubscribeToMeetupRequest) returns (MeetupNotificationPreferences);
  rpc UnsubscribeFromMeetup(UnsubscribeFromMeetupRequest) returns (MeetupNotificationPreferences);

  // One category at a time, and one operation per scope: the two scopes answer
  // with snapshots of different shape, so they do not share a request.
  rpc SetGlobalCategoryPreference(SetGlobalCategoryPreferenceRequest) returns (GlobalNotificationPreferences);
  rpc SetMeetupCategoryPreference(SetMeetupCategoryPreferenceRequest) returns (MeetupNotificationPreferences);

  rpc GetGlobalNotificationPreferences(GetGlobalNotificationPreferencesRequest) returns (GlobalNotificationPreferences);
  rpc GetMeetupNotificationPreferences(GetMeetupNotificationPreferencesRequest) returns (MeetupNotificationPreferences);

  // The person's auction notification settings, whole: how often they hear
  // about outbids and proxy answers, and whether they hear about the final.
  // None of them is one of the categories below.
  rpc GetAuctionNotificationPreferences(GetAuctionNotificationPreferencesRequest) returns (AuctionNotificationPreferences);
  rpc SetAuctionNotificationPreferences(SetAuctionNotificationPreferencesRequest) returns (AuctionNotificationPreferences);

  // Favorite lots: "the person follows this lot".
  rpc FollowLot(FollowLotRequest) returns (LotFollowing);
  rpc UnfollowLot(UnfollowLotRequest) returns (LotFollowing);
  rpc ListFollowedLots(ListFollowedLotsRequest) returns (FollowedLots);

  // Whether the person has already seen the explanation of an automatic bid
  // limit.
  rpc GetProxyExplainer(GetProxyExplainerRequest) returns (ProxyExplainer);
  rpc MarkProxyExplainerSeen(MarkProxyExplainerSeenRequest) returns (ProxyExplainer);

  // Two separate operations rather than one with an optional meetup id. They
  // share the acceptance message because one mechanism executes both.
  rpc BroadcastToMeetupSubscribers(BroadcastToMeetupSubscribersRequest) returns (BroadcastAccepted);
  rpc BroadcastToCommunity(BroadcastToCommunityRequest) returns (BroadcastAccepted);

  // How many people would receive a fact if the broadcast were accepted now.
  // A read: no idempotency key, no body, no names. Not a delivery receipt.
  rpc PreviewMeetupBroadcast(PreviewMeetupBroadcastRequest) returns (BroadcastAudience);
  rpc PreviewCommunityBroadcast(PreviewCommunityBroadcastRequest) returns (BroadcastAudience);

  // Release notes: what the image of the caller's bot carries. These three
  // operations belong to no person, and none of them carries the surface: the
  // caller's token names it, and a surface reads and writes only its own
  // records and summaries.
  //
  // A report is the whole set, never a delta: a repeated set changes nothing.
  rpc ReportReleaseNotes(ReportReleaseNotesRequest) returns (ReleaseNotesAccepted);

  // The summaries of the caller's surface, newest first.
  rpc ListReleaseSummaries(ListReleaseSummariesRequest) returns (ReleaseSummaries);

  // One summary of the caller's surface together with the summaries adjacent to
  // it.
  rpc GetReleaseSummary(GetReleaseSummaryRequest) returns (ReleaseSummaryWithNeighbours);
}

message SubscribeToMeetupRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The person whose own
  // subscription changes. Platform roles are deliberately absent from every
  // request in this file, and so is any ready-made permission.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;
}

message UnsubscribeFromMeetupRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;
}

message SetGlobalCategoryPreferenceRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Any category of the dictionary below that the person can see.
  NotificationCategory category = 2;

  // Target state of this one category, never a toggle of the current value.
  // There is no presence here: an unsent field and an explicit false are the
  // same bytes, so false is the total value "off".
  bool enabled = 3;
}

message SetMeetupCategoryPreferenceRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;

  // A category that a meetup can carry. Which ones those are is a property of
  // the category itself, stated in the enum below.
  NotificationCategory category = 3;

  // Target state of this one category for this one meetup, with the same
  // absence of presence as in the global command. There is no third state on
  // the wire: "inherit the global value" is not spellable here.
  bool enabled = 4;
}

message GetGlobalNotificationPreferencesRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
}

message GetMeetupNotificationPreferencesRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;
}

// Server-produced state. The list is total over every category of the
// dictionary: a category the person never touched carries the product default,
// not an absent entry.
message GlobalNotificationPreferences {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Every category of the dictionary the person can see, in dictionary order.
  // A category reserved to a role the person does not hold is absent, not
  // reported as off.
  repeated CategoryPreference categories = 2;
}

// Server-produced state for one meetup. The two planes are reported side by
// side and neither is derived from the other: category values stand whether or
// not the person is currently subscribed.
message MeetupNotificationPreferences {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;

  // False both for a person who never subscribed and for one who unsubscribed:
  // this message does not distinguish the two.
  bool subscribed = 3;

  // Only the categories a meetup can carry. Each entry holds the value in
  // force: the override when one exists, the global value otherwise. Which of
  // the two produced it is deliberately not reported.
  repeated CategoryPreference categories = 4;
}

message CategoryPreference {
  NotificationCategory category = 1;
  bool enabled = 2;
}

message GetAuctionNotificationPreferencesRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
}

// Changes one or more settings. An absent field leaves its setting as it is.
message SetAuctionNotificationPreferencesRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Target value, never a step from the current one.
  optional OutbidFrequency outbid_frequency = 2;

  // Target state, never a toggle of the current value.
  optional bool final_announcements = 3;

  // Target state, never a toggle of the current value.
  optional bool live_final_outbids = 4;
}

// Server-produced state, total: a setting the person never touched carries the
// product default — EVERY, true and false — not UNSPECIFIED or an absent value.
message AuctionNotificationPreferences {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  OutbidFrequency outbid_frequency = 2;

  // Whether the announcements of an auction final — auction_final_lineup and
  // auction_final_started — reach the person.
  bool final_announcements = 3;

  // Whether outbids and the answers of the person's own proxy limit on a lot in
  // the live final reach the person, each one on its own. The outbid frequency
  // does not apply there: false withholds them, true sends every one.
  bool live_final_outbids = 4;
}

// A fixed list rather than a number of minutes: only these intervals exist.
// It governs outbids and the answers of the person's own proxy limit alike,
// except on a lot in the live final, where live_final_outbids decides instead;
// purchases are not affected. The interval is counted per person, across lots.
enum OutbidFrequency {
  // No value: the field is unset or the value is unknown to the consumer.
  OUTBID_FREQUENCY_UNSPECIFIED = 0;

  // Every outbid and every proxy answer on its own.
  OUTBID_FREQUENCY_EVERY = 1;

  // At most one message in the interval: the first outbid or proxy answer on
  // any lot opens a window, and when it ends one lot_activity_digest lists
  // every lot touched in it, with the price at that moment. A sale of a lot in
  // the window closes it early.
  OUTBID_FREQUENCY_AT_MOST_EVERY_5_MINUTES = 2;
  OUTBID_FREQUENCY_AT_MOST_EVERY_15_MINUTES = 3;
  OUTBID_FREQUENCY_AT_MOST_EVERY_60_MINUTES = 4;

  // No outbid and no proxy answer messages. Purchase and access messages are
  // not affected.
  OUTBID_FREQUENCY_OFF = 5;
}

message FollowLotRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The person whose own mark
  // changes.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string lot_id = 2;
}

message UnfollowLotRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string lot_id = 2;
}

// Server-produced state of one mark after the command.
message LotFollowing {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string lot_id = 2;

  bool following = 3;
}

message ListFollowedLotsRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
}

// The person's own list, earliest mark first. Price, deadline and outcome of
// the lots are not here.
message FollowedLots {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 strings with hyphens.
  repeated string lot_ids = 2;
}

message GetProxyExplainerRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
}

// Carries no moment and no lot: only whether the explanation was seen.
message MarkProxyExplainerSeenRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
}

// Server-produced state. A person who was never marked gets seen = false.
message ProxyExplainer {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  bool seen = 2;
}

message BroadcastToMeetupSubscribersRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The author of the message.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;

  // Caller-generated canonical lowercase UUIDv7 string with hyphens. This is
  // both the broadcast id and the idempotency key. There is no separate
  // idempotency field.
  string id = 3;

  // Author-written content. Not a rendered message: wording of the envelope,
  // keyboard and links belong to the delivering channel. Unlike the meetup
  // attributes, the empty string is not a total value here.
  string body = 4;
}

message BroadcastToCommunityRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The author of the
  // announcement.
  string identity_id = 1;

  // Caller-generated canonical lowercase UUIDv7 string with hyphens. Both the
  // broadcast id and the idempotency key, as above.
  string id = 2;

  // Author-written content, as in BroadcastToMeetupSubscribers.
  string body = 3;

  // The audience is deliberately absent. A community announcement is expanded
  // to one fixed circle by this service, and the sender does not choose it:
  // there is no "everyone" broadcast, and no recipient list travels here.
}

// Server-produced acknowledgement that the broadcast was accepted. Acceptance
// is not delivery: this service publishes addressed facts and learns nothing
// about their outcome, so no recipient count and no delivery mark appear here.
message BroadcastAccepted {
  // Echo of the caller-generated id.
  string id = 1;

  // RFC 3339 UTC instant at which the broadcast was first accepted.
  string accepted_at = 2;

  // False when this call matched an already-accepted id.
  bool created = 3;
}

message PreviewMeetupBroadcastRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The author asking.
  string identity_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string meetup_id = 2;
}

message PreviewCommunityBroadcastRequest {
  // Canonical lowercase UUIDv7 string with hyphens. The author asking.
  string identity_id = 1;

  // The audience is deliberately absent, as in BroadcastToCommunity.
}

// People who would receive a fact now. Names are absent. Zero is a count,
// not an error: the broadcast can still be accepted and will create no facts.
message BroadcastAudience {
  int32 recipient_count = 1;
}

message ReportReleaseNotesRequest {
  // Ids of the records the image of the caller's bot carries: the whole set,
  // never a delta. The order is the image's own order of the records. A
  // repeated set changes nothing. An empty set is a value, not an absent field.
  repeated string record_ids = 1;
}

// Server-produced acknowledgement. Acceptance is not delivery: the service
// publishes addressed facts and learns nothing about their outcome. A set that
// was already seen changes nothing and is not an error.
message ReleaseNotesAccepted {
  // RFC 3339 UTC instant at which this report was accepted.
  string accepted_at = 1;
}

message ListReleaseSummariesRequest {
  // Opaque token returned as next_page_token. Empty starts an enumeration from
  // the newest summary.
  string page_token = 1;

  // 0 selects the server default.
  uint32 page_size = 2;
}

// One page of the summaries of the caller's surface, newest first.
message ReleaseSummaries {
  repeated ReleaseSummary summaries = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

message GetReleaseSummaryRequest {
  // Canonical lowercase UUIDv7 string with hyphens.
  string summary_id = 1;
}

// One summary of the caller's surface and the summaries adjacent to it.
message ReleaseSummaryWithNeighbours {
  ReleaseSummary summary = 1;

  // Canonical lowercase UUIDv7 string with hyphens. The summary just older than
  // this one. Unset when this is the oldest one. An empty string is not a
  // value.
  optional string older_summary_id = 2;

  // Canonical lowercase UUIDv7 string with hyphens. The summary just newer than
  // this one. Unset when this is the newest one.
  optional string newer_summary_id = 3;
}

enum NotificationCategory {
  // No value: the field is unset or the category is unknown to the consumer.
  NOTIFICATION_CATEGORY_UNSPECIFIED = 0;

  // Global scope only: it has no per-meetup form.
  NOTIFICATION_CATEGORY_MEETUP_PUBLISHED = 1;

  NOTIFICATION_CATEGORY_MEETUP_CHANGED = 2;

  NOTIFICATION_CATEGORY_MEETUP_MATERIAL = 3;

  NOTIFICATION_CATEGORY_MEETUP_REMINDER = 4;

  NOTIFICATION_CATEGORY_ORGANIZER_MESSAGE = 5;

  // Global scope only: it is bound to no meetup.
  NOTIFICATION_CATEGORY_COMMUNITY_ANNOUNCEMENT = 6;

  // Global scope only, and visible to administrators only: new applications
  // for access. Nobody else sees it or may set it.
  NOTIFICATION_CATEGORY_ACCESS_REQUEST = 7;

  // The daily summary of what is new in the bot. Global scope only: a summary
  // belongs to a surface, not to a meetup, and is not per-meetup overridable.
  NOTIFICATION_CATEGORY_RELEASE_NOTES = 8;
}
