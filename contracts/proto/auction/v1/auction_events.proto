syntax = "proto3";

package auction.v1;

import "auction/v1/auction.proto";

// Outgoing facts of the lot journal and of the session journal. They live apart
// from auction_service.proto for the same reason the value types do: a consumer of
// the events must not drag AuctionService and its requests into its codegen.
//
// This is not the journal row. The row also carries the aggregate type, the
// operation id, the transaction id, the actor and the schema version; none of them
// leaves the service. The aggregate type in particular is told by the subject and
// by the message: a lot fact is a LotEvent, a session fact is a SessionEvent.
// Subjects, delivery semantics and what is deliberately absent are documented in
// docs/architecture/integration.md, section "Auction NATS".
//
// Only public facts are published. Proxy limits are private to their owner, and
// the selection of a lot for the final stays a working choice of the organizer
// until the lineup is frozen, so ProxyLimitSet, ProxyLimitWithdrawn and
// LotMarkedForFinal have no occasion here, and the lot state carries neither
// limits nor the final mark. The session records that choice too - a finalist
// confirmed or dropped - so FinalistConfirmed and FinalistDropped have no
// occasion here either, and the session state names no finalist before the
// lineup is frozen.

// A recorded public fact about one lot: why it changed and what is true about it now.
message LotEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv7 with hyphens. The lot this fact belongs to. It
  // repeats state.id so that the envelope alone identifies the subject of the fact.
  string lot_id = 2;

  // Position of the event in the journal of the lot, starting at 1, so 0 is not a
  // valid value. Monotonic within one lot but not contiguous on the bus: private
  // facts take positions too and are not published, so a gap is not a lost event.
  // Delivery order is not promised: a redelivered event may arrive after a newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the command was decided at. Several
  // facts of one command share it. It is neither the moment of publication nor
  // the moment of delivery, and it does not order events - version does.
  string occurred_at = 4;

  // The public state of the lot after the event was applied. Always set: the body
  // of every event is a whole snapshot, never a delta.
  LotState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    LotDrafted lot_drafted = 15;
    LotScheduled lot_scheduled = 16;
    LotOpened lot_opened = 6;
    BidPlaced bid_placed = 7;
    AskAdvanced ask_advanced = 8;
    DeadlineExtended deadline_extended = 9;
    LotSold lot_sold = 10;
    LotUnsold lot_unsold = 11;
    LotWithdrawn lot_withdrawn = 12;
    LotHeldForFinal lot_held_for_final = 13;
    LotResumed lot_resumed = 14;
  }
}

// The public state of a lot after an event.
//
// It is defined here and does not reuse the state of the service contract. The
// fields coincide today, but separate definitions keep a change of the read API
// from silently becoming a change of this contract. Field numbers match
// auction.v1.LotSnapshot so that the two stay readable side by side.
message LotState {
  // The version is a value of the envelope and is not repeated here: two copies
  // of one number can disagree. The other two numbers carry values LotSnapshot
  // computes for one viewer or by a rule, which a fact on the bus does not carry.
  reserved 4, 5, 6;

  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Canonical lowercase UUIDv7 with hyphens: the trading session the lot belongs
  // to. Always set: the link belongs to the fact, not to a guess of the reader.
  string session_id = 2;

  // The trading conditions. Set by lot_scheduled and replaced by every repeated
  // lot_scheduled until the lot is opened; from lot_opened on it never changes.
  // Unset on a draft, and on a lot withdrawn while it was a draft.
  LotConfig config = 3;

  // Where the lot is. Exactly one is set.
  oneof status {
    LotDraft draft = 8;
    LotSchedule scheduled = 9;
    LotTrading trading = 10;
    LotHeld held = 11;
    LotSale sold = 12;
    UnsoldReason unsold = 13;
    WithdrawnReason withdrawn = 14;
  }
}

// The lot came into existence: its session recorded it in the registry and the lot
// confirmed it. Nothing else is known about it yet, so the state is a draft with
// no config. The session is in the state, as on every lot fact.
message LotDrafted {}

// The trading conditions were set or replaced. They are in the state: the config
// next to the status and the starting price in state.scheduled. The fact repeats
// on every change until the lot is opened, and each body is a whole snapshot.
message LotScheduled {}

// The lot entered trading. The configuration and the starting price are in the
// state: the starting price is state.trading.current_price.
message LotOpened {}

// A bid was accepted. The bidder is now the leader and the amount is the current
// price, both in the state; the bid id is state.trading.leading_bid_id.
//
// A chain of proxy bids is folded into one fact with the final price: the
// intermediate amounts are steps of a computation, not facts of the trading.
message BidPlaced {
  // Canonical lowercase UUIDv7 with hyphens: the participant who led before this
  // bid. Absent on the first bid of the lot - absent, not an empty string.
  //
  // Present does not mean outbid: when the leader's own proxy answers a rival
  // limit and raises the price without losing the lead, this equals the new
  // state.trading.leader_id. Someone was outbid only when the two differ.
  optional string previous_leader_id = 1;

  // How the bid was placed. Exactly one is set.
  oneof origin {
    ManualBid manual = 2;
    ProxyBid proxy = 3;
  }
}

// A bid a participant placed by hand.
message ManualBid {
  BidSource source = 1;
}

// A bid the system placed within the bidder's proxy limit. It has no source: no
// channel placed it. The limit itself is not carried.
message ProxyBid {}

// The auctioneer announced the next price; it is state.trading.ask. Who announced
// it is not carried.
message AskAdvanced {}

// Anti-sniping extended the deadline. The new deadline and the count of used
// extensions are in the state.
message DeadlineExtended {}

// The lot was sold. The sale is state.sold.
message LotSold {}

// The lot closed without a sale. The reason is state.unsold.
message LotUnsold {}

// The lot was withdrawn from trading. The reason is state.withdrawn; who withdrew
// it is not carried.
message LotWithdrawn {}

// The lot was selected for the live final and survived the common deadline: it is
// held with the price and leader it had. The moment is occurred_at.
message LotHeldForFinal {}

// A held lot returned to trading in the live final. The state has the phase set to
// live, and neither a deadline nor an ask.
message LotResumed {}

// A recorded public fact about one trading session: why it changed and what is
// true about it now. The envelope is the one of LotEvent, field for field, so that
// a consumer of both reads them the same way; which of the two arrived is told by
// the subject, not by the body.
message SessionEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv7 with hyphens. The session this fact belongs to. It
  // repeats state.id so that the envelope alone identifies the subject of the fact.
  string session_id = 2;

  // Position of the event in the journal of the session, starting at 1, so 0 is
  // not a valid value. Monotonic within one session but not contiguous on the bus:
  // private facts take positions too and are not published, so a gap is not a lost
  // event. Delivery order is not promised: a redelivered event may arrive after a
  // newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the command was decided at. It is
  // neither the moment of publication nor the moment of delivery, and it does not
  // order events - version does.
  string occurred_at = 4;

  // The public state of the session after the event was applied. Always set: the
  // body of every event is a whole snapshot, never a delta.
  SessionState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    SessionScheduled session_scheduled = 6;
    LotAdded lot_added = 7;
    LotRemoved lot_removed = 8;
    PrebiddingStarted prebidding_started = 9;
    PrebiddingDeadlineReached prebidding_deadline_reached = 10;
    PrebiddingEnded prebidding_ended = 11;
    FinalLineupFrozen final_lineup_frozen = 12;
    FinalStarted final_started = 13;
    FinalLotActivated final_lot_activated = 14;
    FinalLotCompleted final_lot_completed = 15;
    SessionFinished session_finished = 16;
  }
}

// The public state of a session after an event. The service reads no session yet,
// so no second definition exists to line up with; the statuses start at 10 as in
// LotState so that a read snapshot, when it comes, has the same room for its own
// values below them.
message SessionState {
  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Set by session_scheduled and replaced by every repeated session_scheduled
  // until prebidding starts; from prebidding_started on it never changes. Unset on
  // a draft.
  SessionConfig config = 2;

  // Canonical lowercase UUIDv7 with hyphens: the registry of the session, the
  // source of truth about which lot belongs to it. Open until prebidding starts and
  // unchanged after. A lot withdrawn later stays in it: withdrawal is a fact of the
  // lot, not of the registry. The order carries no meaning.
  repeated string lot_ids = 3;

  // Where the session is. Exactly one is set.
  //
  // Nothing before the lineup is frozen names a finalist: the selection stays a
  // working choice of the organizer, so the statuses of the prebidding, the settling
  // and the break carry no lots. Which lots the session still waits for is not
  // carried either: the session restores it by asking the lots, not from a journal.
  //
  // Two fields are not named after their status: break and final are keywords in
  // the languages of the consumers.
  oneof status {
    Draft draft = 10;
    Scheduled scheduled = 11;
    Prebidding prebidding = 12;
    Settling settling = 13;
    Break on_break = 14;
    LineupFrozen lineup_frozen = 15;
    Final in_final = 16;
    Finished finished = 17;
  }

  // The initial state: no configuration yet; lots may be added.
  message Draft {}

  // The configuration is checked and in place; lots may still be added and removed.
  message Scheduled {}

  // The online phase is running; the registry and the configuration are frozen.
  message Prebidding {}

  // The common deadline passed; the session waits for every lot to close or to be
  // held.
  message Settling {}

  // Every lot is closed or held; the lineup of the final is not frozen yet.
  message Break {}

  // The lineup of the final is frozen and announced.
  message LineupFrozen {
    // Canonical lowercase UUIDv7 with hyphens: the held lots in the order they go
    // in the final. Never empty.
    repeated string order = 1;
  }

  // The live final is running.
  message Final {
    // The frozen lineup, as in LineupFrozen. Which of its lots are done is read
    // from the lots, not from here.
    repeated string order = 1;

    // Canonical lowercase UUIDv7 with hyphens: the lot the auctioneer is trading
    // now. Unset between lots - absent, not an empty string.
    optional string active_lot_id = 2;
  }

  // Terminal.
  message Finished {}
}

// The configuration was set or replaced; it is state.config. The fact repeats on
// every change until prebidding starts, and each body is a whole snapshot.
message SessionScheduled {}

// A lot was added to the registry; it is in state.lot_ids. The id names which
// element is the new one, so a consumer without a replica need not guess. The
// lot's own journal begins after this fact, with lot_drafted.
message LotAdded {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// A lot was removed from the registry. The id is carried because the removed lot
// is no longer in the state. The lot itself is withdrawn by its own fact.
message LotRemoved {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// The online phase started; the registry and the configuration are frozen from
// now on. The lots open by their own facts.
message PrebiddingStarted {}

// The common deadline passed; the moment is state.config.online_phase.closes_at.
// The lots are still closing, and the session waits for them.
message PrebiddingDeadlineReached {}

// Every lot of the catalog is closed or held. When no lot was held, this same fact
// finishes the session: the state says which of the two happened.
message PrebiddingEnded {}

// The lineup of the final is frozen and announced; it is state.lineup_frozen.order.
message FinalLineupFrozen {}

// The live final started. No lot is active yet.
message FinalStarted {}

// A held lot returned to trading in the final; it is state.in_final.active_lot_id.
message FinalLotActivated {}

// The active lot closed, or a lot of the lineup turned out to be gone before its
// turn. The id is carried because the state has no active lot any more. The outcome
// of the sale is in the lot's own journal, not here.
message FinalLotCompleted {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// Every lot of the lineup is completed. Terminal.
message SessionFinished {}
