syntax = "proto3";

package auction.v1;

import "auction/v1/auction.proto";

// Outgoing facts of the lot journal, of the auction journal, of the invoice
// journal and of the raffle journal. They live apart from auction_service.proto
// for the same reason the value types do: a consumer of the events must not drag
// AuctionService and its requests into its codegen.
//
// This is not the journal row. The row also carries the aggregate type, the
// operation id, the transaction id, the actor and the schema version; none of them
// leaves the service. The aggregate type in particular is told by the subject and
// by the message: a lot fact is a LotEvent, an auction fact is an AuctionEvent,
// an invoice fact is an InvoiceEvent, a raffle fact is a RaffleEvent.
// Subjects, delivery semantics and what is deliberately absent are documented in
// docs/architecture/integration.md, section "Auction NATS".
//
// Only public facts are published. Proxy limits are private to their owner, and
// the selection of a lot for the final stays a working choice of the organizer
// until the lineup is frozen, so ProxyLimitSet, ProxyLimitWithdrawn,
// LotMarkedForFinal and LotUnmarkedForFinal have no occasion here, and the lot
// state carries neither limits nor the final mark. FinalistConfirmed and
// FinalistDropped, the side of the auction in that choice, have no occasion here
// either, and the auction state names no finalist before the lineup is frozen.
// The fulfillment method the winner chooses for an invoice has no subscriber on
// the bus, so FulfillmentChosen has no occasion here and
// the invoice state does not carry the method: the reads of the service do.
// The raffle publishes only its draw: registrations, their cancellation and the
// closing of the pool have no occasion here, and the names of ticket holders are
// never carried. The identities of ticket holders are, so that each of them can
// be told the result; the numbers, the count and the result are public on the
// result screen anyway.

// A recorded public fact about one lot: why it changed and what is true about it now.
message LotEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv7 with hyphens. The lot this fact belongs to. It
  // repeats state.id so that the envelope alone identifies the subject of the fact.
  string lot_id = 2;

  // Position of the event in the journal of the lot, starting at 1, so 0 is not a
  // valid value. Monotonic within one lot but not contiguous on the bus: private
  // facts take positions too and are not published, so a gap is not a lost event.
  // Delivery order is not promised: a redelivered event may arrive after a newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the command was decided at. Several
  // facts of one command share it. It is neither the moment of publication nor
  // the moment of delivery, and it does not order events - version does.
  string occurred_at = 4;

  // The public state of the lot after the event was applied. Always set: the body
  // of every event is a whole snapshot, never a delta.
  LotState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    LotDrafted lot_drafted = 15;
    LotScheduled lot_scheduled = 16;
    LotOpened lot_opened = 6;
    BidPlaced bid_placed = 7;
    AskAdvanced ask_advanced = 8;
    DeadlineExtended deadline_extended = 9;
    LotSold lot_sold = 10;
    LotUnsold lot_unsold = 11;
    LotWithdrawn lot_withdrawn = 12;
    LotHeldForFinal lot_held_for_final = 13;
    LotResumed lot_resumed = 14;
    StepWindowAdded step_window_added = 17;
    ParticipantRemoved participant_removed = 18;
    StepWindowChanged step_window_changed = 19;
  }
}

// The public state of a lot after an event.
//
// It is defined here and does not reuse the state of the service contract. The
// fields otherwise coincide, but separate definitions keep a change of the read
// API from silently becoming a change of this contract. Field numbers match
// auction.v1.LotSnapshot so that the two stay readable side by side, except the
// windows of reduced step, which only this state carries (number 19).
message LotState {
  // The version is a value of the envelope and is not repeated here: two copies
  // of one number can disagree. Numbers 5 and 6 carry values LotSnapshot computes
  // for one viewer or by a rule, which a fact on the bus does not carry. Number 7
  // is the catalog card, which is state outside the journal, not a fact. Number
  // 15 is the bid count of the read model: a consumer of the bus counts the
  // bid_placed facts it receives. Numbers 16 to 18 are the regular step and the
  // windows of reduced step at the instant LotSnapshot answers: they depend on
  // the clock of the reader, and a fact holds one instant, so the windows of the
  // lot come as data in number 19 instead. Number 20 is the collectible set of
  // the lot, which the journal of the auction holds, not the journal of the lot.
  reserved 4, 5, 6, 7, 15, 16, 17, 18, 20;

  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Canonical lowercase UUID with hyphens: the auction the lot belongs to.
  // Version 5 names an auction born at a meetup, as AuctionState.id; version 7
  // names an auction that has no journal of its own and belongs to no meetup.
  // Always set: the link belongs to the fact, not to a guess of the reader.
  string auction_id = 2;

  // The trading conditions. Set by lot_scheduled and replaced by every repeated
  // lot_scheduled until the lot is opened; from lot_opened on it never changes.
  // Unset on a draft, and on a lot withdrawn while it was a draft.
  LotConfig config = 3;

  // Where the lot is. Exactly one is set.
  oneof status {
    LotDraft draft = 8;
    LotSchedule scheduled = 9;
    LotTrading trading = 10;
    LotHeld held = 11;
    LotSale sold = 12;
    UnsoldReason unsold = 13;
    WithdrawnReason withdrawn = 14;
  }

  // The windows of reduced bid step the lot recorded, by ascending start, as in
  // its state. Set only while the lot is trading; empty on a lot with no windows
  // and on a lot in the live final, which does not carry them. These are data of
  // the fact, unlike numbers 16 to 18: they do not depend on the clock of the
  // reader. Every window is in the currency of the lot: a window in another
  // currency is not recorded by the lot and does not appear here.
  repeated StepWindow step_windows = 19;
}

// A window of reduced bid step of one lot as the lot recorded it: the half-open
// interval [from, until) with the step and the starting price in force in it. It
// is not the window of LotSnapshot: that one answers at an instant, while this
// one is the recorded window itself. A window sets a step, a starting price or
// both.
message StepWindow {
  // RFC 3339 instant in UTC: the first instant of the window.
  string from = 1;

  // RFC 3339 instant in UTC: the first instant after the window.
  string until = 2;

  // The bid step inside the window. Unset when the window does not change it.
  Money step = 3;

  // The price of the first bid inside the window while the lot has no bid. Unset
  // when the window does not change it.
  Money start = 4;

  // Canonical lowercase UUIDv5 with hyphens: the happy hour period whose terms
  // for this lot the window is (auction.v1.HappyHourPeriod.period_id). Empty on
  // a window announced in the configuration or launched during the online
  // phase. A window of a period may be replaced or removed until the period
  // starts; then step_window_changed comes.
  string happy_hour_period_id = 5;
}

// The lot came into existence: its auction recorded it in the registry and the lot
// confirmed it. Nothing else is known about it yet, so the state is a draft with
// no config. The auction is in the state, as on every lot fact.
message LotDrafted {}

// The trading conditions were set or replaced. They are in the state: the config
// next to the status and the starting price in state.scheduled. The fact repeats
// on every change until the lot is opened, and each body is a whole snapshot.
message LotScheduled {}

// The lot entered trading. The configuration and the starting price are in the
// state: the starting price is state.trading.current_price.
message LotOpened {}

// A bid was accepted. The bidder is now the leader and the amount is the current
// price, both in the state; the bid id is state.trading.leading_bid_id.
//
// A chain of proxy bids is folded into one fact with the final price: the
// intermediate amounts are steps of a computation, not facts of the trading.
message BidPlaced {
  // Canonical lowercase UUIDv7 with hyphens: the participant who led before this
  // bid. Absent on the first bid of the lot - absent, not an empty string.
  //
  // Present does not mean outbid: when the leader's own proxy answers a rival
  // limit and raises the price without losing the lead, this equals the new
  // state.trading.leader_id. Someone was outbid only when the two differ.
  optional string previous_leader_id = 1;

  // How the bid was placed. Exactly one is set.
  oneof origin {
    ManualBid manual = 2;
    ProxyBid proxy = 3;
  }

  // True on a manual bid that the same command answered with a proxy bid of
  // another participant: the next fact of the lot carries that proxy bid, and
  // the lead this bid took did not survive the command. Always false on a proxy
  // bid.
  bool overtaken_by_proxy = 4;

  // True on a proxy bid placed by a command of another participant - their bid
  // or their limit - rather than by the bidder's own limit. Always false on a
  // manual bid.
  bool answers_other_bidder = 5;
}

// A bid a participant placed by hand.
message ManualBid {
  BidSource source = 1;
}

// A bid the system placed within the bidder's proxy limit. It has no source: no
// channel placed it. The limit itself is not carried.
message ProxyBid {}

// The auctioneer announced the next price; it is state.trading.ask. Who announced
// it is not carried.
message AskAdvanced {}

// Anti-sniping extended the deadline. The new deadline and the count of used
// extensions are in the state.
message DeadlineExtended {}

// The lot was sold. The sale is state.sold.
message LotSold {}

// The lot closed without a sale. The reason is state.unsold.
message LotUnsold {}

// The lot was withdrawn from trading. The reason is state.withdrawn; who withdrew
// it is not carried.
message LotWithdrawn {}

// The lot was selected for the live final and survived the common deadline: it is
// held with the price and leader it had. The moment is occurred_at.
message LotHeldForFinal {}

// A held lot returned to trading in the live final. The state has the phase set to
// live, and neither a deadline nor an ask.
message LotResumed {}

// A window of reduced step launched during the online phase was added to the lot.
// The windows are state.step_windows, the new one among them; which of them is new
// is not carried. A window announced in the configuration comes with lot_opened
// instead and never with this occasion.
message StepWindowAdded {}

// The terms of the lot in a happy hour period were set, replaced or removed
// before the period started. The windows are state.step_windows as they are now:
// the window of the period is among them with happy_hour_period_id, or is gone
// when the terms were removed. Which window changed and what it was before is
// not carried.
message StepWindowChanged {}

// A participant was removed from the lot by the administrator of the meetup. The
// state is the lot after the removal: the leader and the price it goes on with,
// which may be lower than before. Who was removed, who removed them and why is
// deliberately not carried.
message ParticipantRemoved {
  // Canonical lowercase UUIDv7 with hyphens: the participant who led before the
  // removal. Absent when the lot had no leader - absent, not an empty string.
  //
  // It equals state leader_id when the removal kept the leader; the lead changed
  // only when the two differ.
  optional string previous_leader_id = 1;
}

// A recorded public fact about one auction: why it changed and what is
// true about it now. The envelope is the one of LotEvent, field for field, so that
// a consumer of both reads them the same way; which of the two arrived is told by
// the subject, not by the body.
message AuctionEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv5 with hyphens, as state.id. The auction this fact
  // belongs to. It repeats state.id so that the envelope alone
  // identifies the subject of the fact.
  string auction_id = 2;

  // Position of the event in the journal of the auction, starting at 1, so 0 is
  // not a valid value. Monotonic within one auction but not contiguous on the bus:
  // private facts take positions too and are not published, so a gap is not a lost
  // event. Delivery order is not promised: a redelivered event may arrive after a
  // newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the command was decided at. It is
  // neither the moment of publication nor the moment of delivery, and it does not
  // order events - version does.
  string occurred_at = 4;

  // The public state of the auction after the event was applied. Always set: the
  // body of every event is a whole snapshot, never a delta.
  AuctionState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    AuctionDrafted auction_drafted = 17;
    AuctionScheduled auction_scheduled = 6;
    LotAdded lot_added = 7;
    LotRemoved lot_removed = 8;
    PrebiddingStarted prebidding_started = 9;
    PrebiddingDeadlineReached prebidding_deadline_reached = 10;
    PrebiddingEnded prebidding_ended = 11;
    FinalLineupFrozen final_lineup_frozen = 12;
    FinalStarted final_started = 13;
    FinalLotActivated final_lot_activated = 14;
    FinalLotCompleted final_lot_completed = 15;
    AuctionFinished auction_finished = 16;
    AuctionDiscarded auction_discarded = 18;
    AuctionCancelled auction_cancelled = 19;
    LotSetCollected lot_set_collected = 20;
    AuctionPublished auction_published = 21;
    AuctionHidden auction_hidden = 22;
  }
}

// The public state of an auction after an event.
//
// It is defined here and does not reuse the read snapshot of the service
// contract, for the reason LotState gives. Field numbers match
// auction.v1.AuctionSnapshot so that the two stay readable side by side.
message AuctionState {
  // Canonical lowercase UUIDv5 with hyphens: the server derives it from
  // meetup_id, so it carries no time and does not order auctions.
  string id = 1;

  // Set by auction_scheduled and replaced by every repeated auction_scheduled
  // until prebidding starts; from prebidding_started on it never changes. Unset on
  // a draft.
  AuctionConfig config = 2;

  // Canonical lowercase UUIDv7 with hyphens: the registry of the auction, the
  // source of truth about which lot belongs to it. Open until prebidding starts and
  // unchanged after. A lot withdrawn later stays in it: withdrawal is a fact of the
  // lot, not of the registry. The order carries no meaning.
  repeated string lot_ids = 3;

  // Canonical lowercase UUIDv7 with hyphens: the meetup the auction was born at.
  // Set by auction_drafted and never changed after. Always set.
  string meetup_id = 4;

  // Whether the auction is hidden from participants. It mirrors
  // AuctionSnapshot.hidden of the service contract field for field and keeps its
  // number. Visibility is a fact of its own - auction_published and
  // auction_hidden - so the snapshot would show a stale visibility until the next
  // fact of the auction if the flag were absent here. A fact written before the
  // flag existed carries no value and describes a visible auction. A hidden
  // auction is unset in every read of a viewer without the auction right, so a
  // consumer must not treat a fact of a hidden auction as public.
  bool hidden = 5;

  // Where the auction is. Exactly one is set.
  //
  // Nothing before the lineup is frozen names a finalist: the selection stays a
  // working choice of the organizer, so the statuses of the prebidding, the settling
  // and the break carry no lots. Which lots the auction still waits for is not
  // carried either: the auction restores it by asking the lots, not from a journal.
  //
  // Two fields are not named after their status: break and final are keywords in
  // the languages of the consumers.
  oneof status {
    Draft draft = 10;
    Scheduled scheduled = 11;
    Prebidding prebidding = 12;
    Settling settling = 13;
    Break on_break = 14;
    LineupFrozen lineup_frozen = 15;
    Final in_final = 16;
    Finished finished = 17;
    Cancelled cancelled = 18;
    Discarded discarded = 19;
  }

  // The auction was born at its meetup: no configuration yet; lots may be added
  // and removed.
  message Draft {}

  // The configuration is checked and in place; lots may still be added and removed.
  message Scheduled {}

  // The online phase is running; the registry and the configuration are frozen.
  message Prebidding {}

  // The common deadline passed; the auction waits for every lot to close or to be
  // held.
  message Settling {}

  // Every lot is closed or held; the lineup of the final is not frozen yet.
  message Break {}

  // The lineup of the final is frozen and announced.
  message LineupFrozen {
    // Canonical lowercase UUIDv7 with hyphens: the held lots in the order they go
    // in the final. Never empty.
    repeated string order = 1;
  }

  // The live final is running.
  message Final {
    // The frozen lineup, as in LineupFrozen. Which of its lots are done is read
    // from the lots, not from here.
    repeated string order = 1;

    // Canonical lowercase UUIDv7 with hyphens: the lot the auctioneer is trading
    // now. Unset between lots - absent, not an empty string.
    optional string active_lot_id = 2;
  }

  // Terminal.
  message Finished {}

  // Terminal: the auction was cancelled after prebidding started. Sold lots stay
  // sold; every other lot is withdrawn by its own fact.
  message Cancelled {}

  // The auction was discarded before prebidding started. Only auction_discarded
  // carries it: a read never returns a discarded auction, and the meetup may get
  // an auction again under the same id, starting with auction_drafted.
  message Discarded {}
}

// The auction came into existence at a meetup: the meetup is state.meetup_id and
// the status is draft. Who enabled it is not carried. It is the first fact of the
// journal of the auction.
message AuctionDrafted {}

// The configuration was set or replaced; it is state.config. The fact repeats on
// every change until prebidding starts, and each body is a whole snapshot.
message AuctionScheduled {}

// A lot was added to the registry; it is in state.lot_ids. The id names which
// element is the new one, so a consumer without a replica need not guess. The
// lot's own journal begins after this fact, with lot_drafted.
message LotAdded {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// A lot was removed from the registry. The id is carried because the removed lot
// is no longer in the state. The lot itself is withdrawn by its own fact.
message LotRemoved {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// Every lot of a collectible set was sold to one participant. The sets are not
// carried in state.
message LotSetCollected {
  // Canonical lowercase UUIDv7 with hyphens: the id the organizer gave the set.
  string lot_set_id = 1;

  // The name of the set as the organizer typed it.
  string name = 2;

  // Canonical lowercase UUIDv7 with hyphens each: the lots of the set in the
  // order of the organizer.
  repeated string lot_ids = 3;

  // Canonical lowercase UUIDv7 with hyphens: the platform identity of the
  // collector, the winner of every lot of the set. Names are not carried.
  string collector_id = 4;
}

// The online phase started; the registry and the configuration are frozen from
// now on. The lots open by their own facts.
message PrebiddingStarted {}

// The common deadline passed; the moment is state.config.online_phase.closes_at.
// The lots are still closing, and the auction waits for them.
message PrebiddingDeadlineReached {}

// Every lot of the catalog is closed or held. When no lot was held, this same fact
// finishes the auction: the state says which of the two happened.
message PrebiddingEnded {}

// The lineup of the final is frozen and announced; it is state.lineup_frozen.order.
message FinalLineupFrozen {}

// The live final started. No lot is active yet.
message FinalStarted {}

// A held lot returned to trading in the final; it is state.in_final.active_lot_id.
message FinalLotActivated {}

// The active lot closed, or a lot of the lineup turned out to be gone before its
// turn. The id is carried because the state has no active lot any more. The outcome
// of the sale is in the lot's own journal, not here.
message FinalLotCompleted {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;
}

// Every lot of the lineup is completed. Terminal.
message AuctionFinished {}

// The auction was discarded before prebidding started; the status is discarded.
// The configuration and the registry are those it had before.
message AuctionDiscarded {}

// The auction was cancelled after prebidding started; the status is cancelled.
// Who cancelled it is not carried. Lots are withdrawn by their own facts, which
// may come before or after this one.
message AuctionCancelled {}

// The auction became visible to participants: the organizer published it, or its
// trading started while it was still hidden. The branch carries nothing: the state
// has hidden = false and the configuration is there when the online phase is
// scheduled. A repeated publication writes the fact again, so a consumer
// deduplicates by event_id and not by visibility.
message AuctionPublished {}

// The auction was hidden from participants again before its trading started. The
// state has hidden = true. Nothing else changes: the registry and the
// configuration stay as they were, and a consumer of this fact drops what it was
// going to say about a publication that no longer holds.
message AuctionHidden {}

// A recorded public fact about one invoice: why it changed and what is true about
// it now. The envelope is the one of LotEvent, field for field; which of the
// three messages arrived is told by the subject, not by the body.
//
// An invoice is the request for payment for one sold lot. Money does not pass
// through the platform: the organizer confirms the payment by hand. How to pay
// is not carried here: neither the means nor the payee details.
message InvoiceEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv5 with hyphens, as state.id. The invoice this fact
  // belongs to. It repeats state.id so that the envelope alone identifies the
  // subject of the fact.
  string invoice_id = 2;

  // Position of the event in the journal of the invoice, starting at 1, so 0 is
  // not a valid value. Monotonic within one invoice but not contiguous on the bus:
  // private facts take positions too and are not published, so a gap is not a
  // lost event. Delivery order is not promised: a redelivered event may arrive
  // after a newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the fact was decided at. For
  // invoice_issued it is the moment the invoice was raised. It is neither the
  // moment of publication nor the moment of delivery, and it does not order
  // events - version does.
  string occurred_at = 4;

  // The public state of the invoice after the event was applied. Always set: the
  // body of every event is a whole snapshot, never a delta.
  InvoiceState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    InvoiceIssued invoice_issued = 6;
    InvoicePaid invoice_paid = 7;
    InvoiceHandedOver invoice_handed_over = 8;
    InvoicePaymentDueChanged invoice_payment_due_changed = 9;
  }
}

// The public state of an invoice after an event. Field numbers match
// auction.v1.InvoiceSnapshot so that the two stay readable side by side.
message InvoiceState {
  // Number 7 is the fulfillment method, which InvoiceSnapshot carries and a fact
  // on the bus does not: see the note at the top of this file.
  reserved 7;
  reserved "fulfillment";

  // Canonical lowercase UUIDv5 with hyphens: the server derives it from the
  // winning bid of the sale, LotSale.bid_id, so one sale has exactly one invoice
  // and a sale to another bid has another. A consumer does not compute it.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: the auction of the
  // sold lot, as LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: the sold lot.
  string lot_id = 3;

  // Canonical lowercase UUIDv7 with hyphens: the platform identity of the winner,
  // LotSale.winner_id. The invoice is addressed to them.
  string winner_id = 4;

  // The amount to pay: the price of the sale, LotSale.price. It never changes.
  Money amount = 5;

  // RFC 3339 UTC deadline, or empty while the auction is still running.
  // Payment starts after the entire auction, including its final, has ended.
  string payment_due_at = 6;

  // Where the invoice is. Exactly one is set. The path is one-way:
  // awaiting_payment, then paid, then handed_over.
  oneof status {
    AwaitingPayment awaiting_payment = 10;
    Paid paid = 11;
    HandedOver handed_over = 12;
  }

  // The invoice is raised and not paid yet.
  message AwaitingPayment {}

  // The organizer confirmed the payment. The moment is occurred_at of
  // invoice_paid.
  message Paid {}

  // The lot was handed over to the winner after the payment. Terminal. The
  // moment is occurred_at of invoice_handed_over.
  message HandedOver {}
}

// The invoice was raised for a sold lot: the status is awaiting_payment, and the
// amount and the due moment are in the state. It is the first fact of the journal
// of the invoice.
message InvoiceIssued {}

// The organizer confirmed the payment. Who confirmed it is not carried.
message InvoicePaid {}

// The organizer recorded that the lot was handed over. Who recorded it is not
// carried.
message InvoiceHandedOver {}

// The shared payment deadline was started or deferred. Read payment_due_at from state.
message InvoicePaymentDueChanged {}

// A recorded public fact about the raffle among participants of one auction: why
// it changed and what is true about it now. The envelope is the one of LotEvent,
// field for field; which of the messages arrived is told by the subject, not by
// the body.
message RaffleEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal and
  // is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7. An auction has at most
  // one raffle, and the raffle is identified by its auction: the value is the
  // auction_id of the auction the raffle belongs to, as LotState.auction_id.
  string raffle_id = 2;

  // Position of the event in the journal of the raffle, starting at 1, so 0 is
  // not a valid value. It is not a position in the journal of the auction.
  // Monotonic within one raffle but not contiguous on the bus: private facts take
  // positions too and are not published, so a gap is not a lost event. Delivery
  // order is not promised: a redelivered event may arrive after a newer one.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the fact was decided at. For
  // raffle_drawn it is the moment the draw was made. It is neither the moment of
  // publication nor the moment of delivery, and it does not order events -
  // version does.
  string occurred_at = 4;

  // The public state of the raffle after the event was applied. Always set: the
  // body of every event is a whole snapshot, never a delta.
  RaffleState state = 5;

  // Why the state changed - the occasion. Exactly one is set, and an empty oneof is
  // not a value.
  oneof occasion {
    RaffleDrawn raffle_drawn = 6;
  }
}

// The public state of a raffle after an event.
message RaffleState {
  // Canonical lowercase UUIDv7 with hyphens each: the platform identities of the
  // ticket holders in ticket order, so ticket k belongs to tickets[k - 1]. One
  // identity holds at most one ticket. The count of tickets is the length of the
  // list. Names are not carried.
  repeated string tickets = 1;

  // The number of the winning ticket, from 1 to the count of tickets. 0 means
  // there is no draw yet; it is never 0 on raffle_drawn.
  uint32 winning_ticket = 2;

  // The prize of the raffle as the organizer declared it, one line. Unset when
  // the raffle has no prize; it is then absent, not empty.
  optional string raffle_prize = 3;
}

// The draw was made: the winning ticket is in the state and never changes. The
// state of this fact always holds at least one ticket.
message RaffleDrawn {}

// A recorded public fact about the prediction results of one auction: the ten
// nominations of ADR-067 and who guessed them. It is not a fact of the auction
// journal: the results are counted from the prediction rows of the two closed
// rounds and from the outcomes of the lots, and they live in a journal of their
// own - the settlement entity. The envelope is the one of LotEvent; which
// message arrived is told by the subject, as it is with the three above.
message PredictionResultsEvent {
  // Canonical lowercase UUIDv7 with hyphens. Identifies the row of the journal
  // and is the same value again when that row is published more than once.
  string event_id = 1;

  // Canonical lowercase UUIDv5 with hyphens: the auction the results belong to.
  // The aggregate here is the results of an auction, so the envelope names the
  // auction instead of repeating state.auction_id.
  string prediction_results_id = 2;

  // Position of the event in the journal of the results, starting at 1.
  int64 version = 3;

  // RFC 3339 instant in UTC: the server time the results were counted at.
  string occurred_at = 4;

  // The public results after the event was applied.
  PredictionResultsState state = 5;

  // Why the state changed - the occasion. Exactly one is set.
  oneof occasion {
    PredictionResultsSettled prediction_results_settled = 6;
  }
}

// The public results of the prediction game of one auction.
message PredictionResultsState {
  // Canonical lowercase UUIDv5 with hyphens: the auction of the results.
  string auction_id = 1;

  // Every nomination that was played, in the order of ADR-067. A nomination
  // with no sales is absent: it has neither a value nor winners.
  repeated NominationOutcome nominations = 2;

  // Every participant who predicted, with their own result. Empty on a
  // settlement recorded by hand: it carries no counted results.
  repeated ParticipantResult participants = 3;

  // True when the results were recorded by hand rather than counted. The
  // nominations are empty then.
  bool manual = 4;
}

// The outcome of one nomination.
message NominationOutcome {
  // UNSPECIFIED is not a value.
  PredictionNomination nomination = 1;

  // The итоговое значение: the winning lots or a number. Unset on a nomination
  // that was not played.
  oneof value {
    NominationLots lots = 2;
    int64 number = 3;
  }

  // How many guessed. It stays after a name is erased: only the name goes.
  uint32 winners = 4;

  // Who guessed, by display name as the history of bids reads it.
  repeated WinnerName winner_names = 5;
}

// The winning lots of a lot answer: every lot that shared the first place.
message NominationLots {
  // Canonical lowercase UUIDv7 with hyphens.
  repeated string lot_ids = 1;
}

message WinnerName {
  // Canonical lowercase UUIDv7 with hyphens.
  string participant_id = 1;

  // The display name of the participant in the auction.
  string name = 2;
}

// The result of one participant: the nomination they answered and how it went.
message ParticipantResult {
  // Canonical lowercase UUIDv7 with hyphens.
  string participant_id = 1;

  repeated Participation participation = 2;
}

message Participation {
  // UNSPECIFIED is not a value.
  PredictionNomination nomination = 1;

  // Exactly one is set.
  oneof result {
    Guessed guessed = 2;
    Missed missed = 3;
  }
}

// The participant named a lot that shared the first place, or a number with the
// smallest deviation.
message Guessed {}

message Missed {
  // The distance from the итог for a number answer. Unset for a lot answer:
  // a wrong lot has no distance. Absent, not zero.
  optional int64 deviation = 1;
}

// The results of both rounds were counted and recorded. Terminal.
message PredictionResultsSettled {}
