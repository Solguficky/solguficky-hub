// What the lot would be after the removal, not recorded. Meant for
// RemoveParticipantRequest.expected_version through version.
message ParticipantRemovalPreview {
  // The price after the removal. Never higher than the current price.
  Money price = 1;

  // Canonical lowercase UUIDv7 with hyphens: the leader after the removal. Absent
  // when nobody else is left to lead - absent, not an empty string.
  optional string leader_id = 2;

  // RFC 3339 instant in UTC: the deadline the removal extends the trading to.
  // Absent when the removal does not extend it.
  optional string extended_deadline = 3;

