// Appends a photo to the end of the photos of a lot. The image of the card
// follows the cover, so a lot without photos gets this one as its image.
message AddLotPhotoRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Canonical lowercase UUIDv7 with hyphens, generated by the caller. A replay
  // with the same id and the same bytes is accepted without a second photo.
  string photo_id = 3;

  LotImageUpload photo = 4;
}

message AddLotPhotoResponse {
  // Exactly one is set. accepted is the card after the command.
  oneof outcome {
    LotCard accepted = 1;
    LotPhotoRefusal refused = 2;
  }
}

// Removes one photo of a lot; the next one becomes the cover. A photo that is
// already gone is accepted: removal is idempotent.
