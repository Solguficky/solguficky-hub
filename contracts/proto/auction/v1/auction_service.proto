syntax = "proto3";

package auction.v1;

import "auction/v1/auction.proto";
import "auction/v1/auction_events.proto";
import "identity/v1/roles.proto";

// Commands of a participant, commands of the lot catalog, the birth of an auction
// at a meetup and the registry of its lots, reads of a lot, of its image, of the
// display names of participants and of auctions, and the invoices of sold lots:
// the commands of the organizer and of the winner and their reads.
//
// A named refusal is a value of the response, not a gRPC status: a command
// response carries exactly one of accepted or refused, and a refusal carries the
// values a caller needs to show it. When refusals are final, how op_id is
// replayed and which conditions still answer with a status are documented in
// docs/architecture/integration.md, section "Auction gRPC".
//
// Trading commands of the auctioneer and the commands that schedule and run an
// auction are deliberately absent.
service AuctionService {
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);
  rpc SetProxyLimit(SetProxyLimitRequest) returns (SetProxyLimitResponse);
  rpc WithdrawProxyLimit(WithdrawProxyLimitRequest) returns (WithdrawProxyLimitResponse);
  rpc CreateLotCard(CreateLotCardRequest) returns (CreateLotCardResponse);
  rpc EditLotCard(EditLotCardRequest) returns (EditLotCardResponse);
  rpc GetLot(GetLotRequest) returns (LotSnapshot);
  rpc ListAuctionLots(ListAuctionLotsRequest) returns (ListAuctionLotsResponse);
  rpc ChooseDisplayName(ChooseDisplayNameRequest) returns (ChooseDisplayNameResponse);
  rpc GetDisplayNames(GetDisplayNamesRequest) returns (GetDisplayNamesResponse);
  rpc GetFaqAcknowledgement(GetFaqAcknowledgementRequest) returns (FaqAcknowledgement);
  rpc AcknowledgeFaq(AcknowledgeFaqRequest) returns (FaqAcknowledgement);
  rpc GetLotImage(GetLotImageRequest) returns (LotImage);
  rpc DraftAuction(DraftAuctionRequest) returns (DraftAuctionResponse);
  rpc AddLot(AddLotRequest) returns (AddLotResponse);
  rpc RemoveLot(RemoveLotRequest) returns (RemoveLotResponse);
  rpc GetMeetupAuction(GetMeetupAuctionRequest) returns (GetMeetupAuctionResponse);
  rpc ListAuctions(ListAuctionsRequest) returns (ListAuctionsResponse);
  rpc MarkInvoicePaid(MarkInvoicePaidRequest) returns (MarkInvoicePaidResponse);
  rpc MarkInvoiceHandedOver(MarkInvoiceHandedOverRequest) returns (MarkInvoiceHandedOverResponse);
  rpc ChooseFulfillment(ChooseFulfillmentRequest) returns (ChooseFulfillmentResponse);
  rpc ListMyInvoices(ListMyInvoicesRequest) returns (ListMyInvoicesResponse);
  rpc ListAuctionInvoices(ListAuctionInvoicesRequest) returns (ListAuctionInvoicesResponse);
}

message Viewer {
  // Canonical lowercase UUIDv7 with hyphens: the platform identity from Identity.
  // It is the participant of a command; there is no separate participant field,
  // so a request cannot act for someone else.
  string identity_id = 1;

  // Platform-wide roles from Identity. Domain permissions are not precomputed
  // here; Auction applies them as the owner of the resource. An empty set means
  // an ordinary user. The block mark is deliberately absent, as in meetups.v1.Viewer.
  repeated identity.v1.GlobalRole global_roles = 2;
}

message PlaceBidRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // In the live final this is the expected next price: any other amount, higher
  // or lower, is refused with the actual next price.
  Money amount = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens: the idempotency key,
  // checked by the domain.
  string op_id = 4;
}

message PlaceBidResponse {
  // Exactly one is set.
  oneof outcome {
    BidAccepted accepted = 1;
    PlaceBidRefusal refused = 2;
  }
}

message BidAccepted {
  // Canonical lowercase UUIDv7 with hyphens.
  string bid_id = 1;
}

message PlaceBidRefusal {
  // Exactly one is set.
  oneof reason {
    LotNotOpen lot_not_open = 1;
    LotOnHold lot_on_hold = 2;
    BidBelowMinimum bid_below_minimum = 3;
    BidNotAtNextPrice bid_not_at_next_price = 4;
    BidderIsLeader bidder_is_leader = 5;
    CurrencyMismatch currency_mismatch = 6;
    DisplayNameNotChosen display_name_not_chosen = 7;
  }
}

message SetProxyLimitRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // The new limit. It replaces the viewer's current limit on the lot, if any.
  Money max = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message SetProxyLimitResponse {
  // Exactly one is set. Whether the limit also produced a bid is not carried here;
  // it is visible in the state of the lot.
  oneof outcome {
    ProxyLimitAccepted accepted = 1;
    SetProxyLimitRefusal refused = 2;
  }
}

message ProxyLimitAccepted {}

message SetProxyLimitRefusal {
  // Exactly one is set.
  oneof reason {
    LotNotOpen lot_not_open = 1;
    ProxyBelowCurrentPrice proxy_below_current_price = 2;
    ProxyDisabledForLot proxy_disabled_for_lot = 3;
    CurrencyMismatch currency_mismatch = 4;
    DisplayNameNotChosen display_name_not_chosen = 5;
  }
}

message WithdrawProxyLimitRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message WithdrawProxyLimitResponse {
  // Exactly one is set.
  oneof outcome {
    ProxyLimitWithdrawalAccepted accepted = 1;
    WithdrawProxyLimitRefusal refused = 2;
  }
}

message ProxyLimitWithdrawalAccepted {}

message WithdrawProxyLimitRefusal {
  // Exactly one is set.
  oneof reason {
    NoActiveProxyLimit no_active_proxy_limit = 1;
  }
}

// The lot is not trading: not opened yet, or already closed.
message LotNotOpen {}

// The lot is held for the live final and accepts no bids until it is resumed.
message LotOnHold {}

message BidBelowMinimum {
  // The lowest amount the lot accepts now.
  Money min_required = 1;
}

// Live final only: a bid is accepted exactly at the next price.
message BidNotAtNextPrice {
  // The next price at the moment the bid was decided.
  Money expected = 1;
}

// The bidder already leads the lot.
message BidderIsLeader {}

// The currency of the amount differs from the currency of the lot.
message CurrencyMismatch {}

// The limit is below the current price of the lot, or below the announced ask
// when it is higher. A limit equal to that price is accepted: the leader may
// lower its own limit down to it.
message ProxyBelowCurrentPrice {}

message ProxyDisabledForLot {}

message NoActiveProxyLimit {}

// The viewer has not chosen how to be shown in the auction of the lot.
message DisplayNameNotChosen {}

// The catalog card of a lot: what a lot is, not how it trades. It is not part of
// the trading domain and never appears on the bus.
message LotCard {
  // Stored and returned as entered, without trimming.
  string title = 1;

  // Empty means that the lot has no description.
  string description = 2;

  // Unset when the lot has no image. The bytes are not here: they are read with
  // GetLotImage, so a caller that already shows this version does not load them.
  LotImageRef image = 3;
}

// Names one image of a lot without carrying it.
message LotImageRef {
  // Opaque, compared only for equality: it changes whenever the image changes.
  string version = 1;
}

message CreateLotCardRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens, generated by the caller: the card is
  // created before the lot and the lot takes the same id.
  string lot_id = 2;

  string title = 3;

  string description = 4;

  // Unset creates the card without an image.
  LotImageUpload image = 5;
}

// An image file sent to the catalog. There is no media type: Auction detects it
// from the bytes.
message LotImageUpload {
  // The encoded image file as downloaded from Telegram.
  bytes content = 1;
}

message CreateLotCardResponse {
  // Exactly one is set.
  oneof outcome {
    LotCard accepted = 1;
    CreateLotCardRefusal refused = 2;
  }
}

message CreateLotCardRefusal {
  // Exactly one is set.
  oneof reason {
    NotAdmin not_admin = 1;
    EmptyTitle empty_title = 2;
    CardConflict card_conflict = 3;
    ImageTooLarge image_too_large = 4;
    UnsupportedImage unsupported_image = 5;
  }
}

message EditLotCardRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Both text fields replace the stored ones.
  string title = 3;

  string description = 4;

  // Unset keeps the stored image, or its absence, as it is: an edit of the text
  // does not resend the file.
  oneof image_change {
    LotImageUpload replace_image = 5;
    LotImageRemoval remove_image = 6;
  }
}

// Removes the image of the card.
message LotImageRemoval {}

message EditLotCardResponse {
  // Exactly one is set.
  oneof outcome {
    LotCard accepted = 1;
    EditLotCardRefusal refused = 2;
  }
}

message EditLotCardRefusal {
  // Exactly one is set.
  oneof reason {
    NotAdmin not_admin = 1;
    EmptyTitle empty_title = 2;
    CardNotFound card_not_found = 3;
    ImageTooLarge image_too_large = 4;
    UnsupportedImage unsupported_image = 5;
  }
}

message NotAdmin {}

message EmptyTitle {}

message CardNotFound {}

// Carries no card: the stored one is not shown to the caller.
message CardConflict {}

message ImageTooLarge {
  // The largest accepted size of LotImageUpload.content, in bytes.
  int64 max_bytes = 1;
}

message UnsupportedImage {}

message GetLotRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

message ListAuctionLotsRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

message ListAuctionLotsResponse {
  repeated LotSnapshot lots = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// The trading state of a lot as one viewer sees it, with its catalog card next to
// it. The trading core does not know the card: it comes from the catalog, not
// from the journal of the lot.
message LotSnapshot {
  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // The trading conditions. Set by the first LotScheduled and replaceable until the
  // lot is opened; frozen from that moment on. Unset on a draft, and on a lot
  // withdrawn while it was a draft.
  LotConfig config = 3;

  // Position of the last event in the journal of the lot, starting at 1: a lot
  // that exists has at least its LotDrafted, so 0 is not a valid value.
  int64 version = 4;

  // The lowest amount a bid is accepted at now; in the live final the only amount.
  // Set only while the lot is trading, so a caller does not repeat the step rule.
  Money next_price = 5;

  // The viewer's own proxy limit on the lot. Unset when the viewer has none.
  // Limits of other participants are never shown.
  Money viewer_proxy_limit = 6;

  // Title and description of the lot. Unset when the lot has no catalog card.
  LotCard card = 7;

  // Where the lot is. Exactly one is set. The numbers match auction.v1.LotState so
  // that the two stay readable side by side.
  oneof status {
    LotDraft draft = 8;
    LotSchedule scheduled = 9;
    LotTrading trading = 10;
    LotHeld held = 11;
    LotSale sold = 12;
    UnsoldReason unsold = 13;
    WithdrawnReason withdrawn = 14;
  }
}

message ChooseDisplayNameRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Exactly one is set.
  oneof choice {
    // The Telegram username of the viewer as the update carried it, without "@".
    // An empty string is a set choice that says the viewer has no username.
    string telegram_username = 3;

    // A pseudonym as the viewer typed it.
    string alias = 4;
  }
}

message ChooseDisplayNameResponse {
  // Exactly one is set.
  oneof outcome {
    DisplayName accepted = 1;
    ChooseDisplayNameRefusal refused = 2;
  }
}

message ChooseDisplayNameRefusal {
  // Exactly one is set.
  oneof reason {
    UsernameMissing username_missing = 1;
    AliasInvalid alias_invalid = 2;
    AliasTaken alias_taken = 3;
    NameFrozen name_frozen = 4;
  }
}

message UsernameMissing {}

message AliasInvalid {}

// Carries no owner: who holds the pseudonym is not shown to the caller.
message AliasTaken {}

message NameFrozen {}

// How a participant is shown in one auction.
message DisplayName {
  // Ready to show as is: marks are already applied, the caller adds none.
  string text = 1;

  DisplayNameKind kind = 2;
}

enum DisplayNameKind {
  DISPLAY_NAME_KIND_UNSPECIFIED = 0;
  DISPLAY_NAME_KIND_TELEGRAM_USERNAME = 1;
  DISPLAY_NAME_KIND_ALIAS = 2;
  // Nothing is chosen, or the choice was erased with the participant.
  DISPLAY_NAME_KIND_PLACEHOLDER = 3;
}

message GetDisplayNamesRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: identity ids of participants, the
  // same ids leader_id and winner_id carry.
  repeated string participant_ids = 3;
}

message GetDisplayNamesResponse {
  // Keyed by participant id. Every requested id is present.
  map<string, DisplayName> names = 1;
}

message GetFaqAcknowledgementRequest {
  Viewer viewer = 1;
}

message AcknowledgeFaqRequest {
  Viewer viewer = 1;
}

// Shared across auctions, for the viewer only. No auction id or reading history.
message FaqAcknowledgement {
  // True after the viewer explicitly chose to leave the introductory FAQ.
  // False means the acknowledgement has not been recorded, not lack of access.
  bool acknowledged = 1;
}

message GetLotImageRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

// The image of a lot as it is stored now.
message LotImage {
  // The encoded image file as Telegram returned it on upload.
  bytes content = 1;

  // IANA media type of content, such as image/jpeg.
  string media_type = 2;

  // The version of these bytes. It may be newer than the version a preceding read
  // returned, when the image changed in between.
  string version = 3;
}

message DraftAuctionRequest {
  // The administrator who enables the auction. Global roles grant no right here:
  // the right is checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens: the meetup to enable the auction at.
  // There is no auction id in the request: the server derives it.
  string meetup_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message DraftAuctionResponse {
  // Exactly one is set. An auction that already exists is accepted, not refused.
  oneof outcome {
    DraftAuctionAccepted accepted = 1;
    DraftAuctionRefusal refused = 2;
  }
}

message DraftAuctionAccepted {
  // Canonical lowercase UUID with hyphens, version 5: derived by the server from
  // meetup_id, the same value on every call for one meetup. It carries no time.
  // A caller does not compute it.
  string auction_id = 1;

  // true when the meetup already had an auction: nothing was recorded, and
  // auction_id names the existing one. false is a real value: this call created it.
  bool already_existed = 2;
}

message DraftAuctionRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

message AddLotRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: the id of the lot card, which the lot
  // takes.
  string lot_id = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message AddLotResponse {
  // Exactly one is set.
  oneof outcome {
    LotAdditionAccepted accepted = 1;
    AddLotRefusal refused = 2;
  }
}

message LotAdditionAccepted {}

message AddLotRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotsFrozen lots_frozen = 3;
  }
}

message RemoveLotRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message RemoveLotResponse {
  // Exactly one is set.
  oneof outcome {
    LotRemovalAccepted accepted = 1;
    RemoveLotRefusal refused = 2;
  }
}

message LotRemovalAccepted {}

message RemoveLotRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotsFrozen lots_frozen = 3;
    LotNotInAuction lot_not_in_auction = 4;
  }
}

// The meetup did not confirm the viewer as its administrator.
message NotMeetupAdministrator {}

// The meetup does not exist for the viewer. Only an administrator learns it.
message MeetupNotFound {}

// The registry of the auction is frozen: prebidding has started.
message LotsFrozen {}

// The lot is not in the registry of the auction.
message LotNotInAuction {}

message GetMeetupAuctionRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string meetup_id = 2;
}

message GetMeetupAuctionResponse {
  // Unset when the meetup has no auction: absent, not an error. A draft is
  // returned here, unlike in ListAuctions.
  AuctionSnapshot auction = 1;
}

message ListAuctionsRequest {
  Viewer viewer = 1;

  // Which auctions to list. UNSPECIFIED is not a value.
  AuctionListing listing = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

// A selection of auctions by status. A draft is in none of them.
enum AuctionListing {
  AUCTION_LISTING_UNSPECIFIED = 0;

  // Scheduled and not finished: from scheduled to in_final.
  AUCTION_LISTING_ACTIVE = 1;

  // Finished.
  AUCTION_LISTING_FINISHED = 2;
}

message ListAuctionsResponse {
  repeated AuctionSnapshot auctions = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// The state of an auction as a read returns it. Field numbers and status types
// match auction.v1.AuctionState so that the two stay readable side by side.
message AuctionSnapshot {
  // The meetup is not here: a list must not lead from an auction to its meetup,
  // and a read by meetup already names it.
  reserved 4;
  reserved "meetup_id";

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string id = 1;

  // Unset on a draft. Replaceable until prebidding starts, frozen after.
  AuctionConfig config = 2;

  // Canonical lowercase UUIDv7 with hyphens: the registry of the auction. The
  // order carries no meaning.
  repeated string lot_ids = 3;

  // Where the auction is. Exactly one is set.
  oneof status {
    AuctionState.Draft draft = 10;
    AuctionState.Scheduled scheduled = 11;
    AuctionState.Prebidding prebidding = 12;
    AuctionState.Settling settling = 13;
    AuctionState.Break on_break = 14;
    AuctionState.LineupFrozen lineup_frozen = 15;
    AuctionState.Final in_final = 16;
    AuctionState.Finished finished = 17;
  }
}

message MarkInvoicePaidRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoicePaidResponse {
  // Exactly one is set. An invoice that is already paid or handed over is
  // accepted, not refused, and no second transition is recorded.
  oneof outcome {
    InvoicePaymentAccepted accepted = 1;
    MarkInvoicePaidRefusal refused = 2;
  }
}

message InvoicePaymentAccepted {}

message MarkInvoicePaidRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

message MarkInvoiceHandedOverRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoiceHandedOverResponse {
  // Exactly one is set. An invoice that is already handed over is accepted, not
  // refused, and no second transition is recorded.
  oneof outcome {
    InvoiceHandoverAccepted accepted = 1;
    MarkInvoiceHandedOverRefusal refused = 2;
  }
}

message InvoiceHandoverAccepted {}

message MarkInvoiceHandedOverRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    InvoiceNotPaid invoice_not_paid = 3;
  }
}

// The invoice still awaits payment: a lot is handed over only after it is paid.
message InvoiceNotPaid {}

message ChooseFulfillmentRequest {
  // The winner the invoice is addressed to. An invoice of someone else is not
  // found for the viewer.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // UNSPECIFIED is not a value: a choice cannot be taken back to none.
  FulfillmentMethod method = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message ChooseFulfillmentResponse {
  // Exactly one is set. The method replaces the previous choice, if any.
  oneof outcome {
    FulfillmentAccepted accepted = 1;
    ChooseFulfillmentRefusal refused = 2;
  }
}

message FulfillmentAccepted {}

message ChooseFulfillmentRefusal {
  // Exactly one is set.
  oneof reason {
    FulfillmentFrozen fulfillment_frozen = 1;
  }
}

// The lot is already handed over: the method no longer changes.
message FulfillmentFrozen {}

message ListMyInvoicesRequest {
  // The winner. Only the invoices addressed to the viewer are returned.
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;
}

message ListMyInvoicesResponse {
  // Every invoice of the viewer in the auction, in no meaningful order. There are
  // no pages: the list is bounded by the sales of one auction - one invoice per
  // sale, and a lot is sold to at most one bid at a time - and a total is summed
  // from the whole of it. Empty when the viewer won nothing.
  repeated InvoiceSnapshot invoices = 1;
}

message ListAuctionInvoicesRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message ListAuctionInvoicesResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionInvoices invoices = 1;
    ListAuctionInvoicesRefusal refused = 2;
  }
}

message AuctionInvoices {
  // Every invoice of the auction, in no meaningful order. There are no pages, for
  // the reason ListMyInvoicesResponse gives. Empty when no lot is sold.
  repeated InvoiceSnapshot invoices = 1;
}

message ListAuctionInvoicesRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

// The state of an invoice as a read returns it. Field numbers and status types
// match auction.v1.InvoiceState so that the two stay readable side by side.
message InvoiceSnapshot {
  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 3;

  // Canonical lowercase UUIDv7 with hyphens: the winner the invoice is addressed
  // to.
  string winner_id = 4;

  // The amount to pay: the price of the sale.
  Money amount = 5;

  // RFC 3339 instant in UTC: the payment is due by this moment. An invoice is
  // overdue when it still awaits payment after it.
  string payment_due_at = 6;

  // How the winner receives the lot. UNSPECIFIED is a real value: the winner has
  // not chosen yet. Not on the bus: see InvoiceState.
  FulfillmentMethod fulfillment = 7;

  // Where the invoice is. Exactly one is set.
  oneof status {
    InvoiceState.AwaitingPayment awaiting_payment = 10;
    InvoiceState.Paid paid = 11;
    InvoiceState.HandedOver handed_over = 12;
  }
}
