    LotCard accepted = 1;
    LotPhotoRefusal refused = 2;
  }
}

message LotPhotoRefusal {
  // Exactly one is set. RemoveLotPhoto refuses only with not_admin,
  // card_not_found and card_closed.
  oneof reason {
    NotAdmin not_admin = 1;
    CardNotFound card_not_found = 2;
    CardClosed card_closed = 3;
    ImageTooLarge image_too_large = 4;
    UnsupportedImage unsupported_image = 5;
    PhotoLimitReached photo_limit_reached = 6;
    PhotoConflict photo_conflict = 7;
  }
}

// The lot already has the largest accepted number of photos.
message PhotoLimitReached {
  int32 max_photos = 1;
}

// A photo with this photo_id is already stored with other bytes.
