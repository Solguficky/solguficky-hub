  // The encoded image file as Telegram returned it on upload.
  bytes content = 1;

  // IANA media type of content, such as image/jpeg.
  string media_type = 2;

  // The version of these bytes. It may be newer than the version a preceding read
  // returned, when the image changed in between.
  string version = 3;
}

