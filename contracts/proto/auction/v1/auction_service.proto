message GetRaffleResponse {
  // Unset when the auction has no raffle: absent, not an error.
  Raffle raffle = 1;
}

// The raffle among the participants of an auction as the viewer sees it.
// Hashes are SHA-256 of a UTF-8 string written as lowercase hex.
message Raffle {
  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 1;

  // Where the raffle is. UNSPECIFIED is not a value.
  RaffleStatus status = 2;

  // RFC 3339 instant in UTC: when registration closes.
  string closes_at = 3;

  // The hash of the seed, published when registration opened. Empty only when
  // the raffle is not held.
  string commitment = 4;

  // The round of the drand quicknet chain whose randomness enters the draw. 0
  // only when the raffle is not held.
  uint64 beacon_round = 5;

  // Whether the viewer holds a registration. Once the pool is fixed it is true
  // exactly when the viewer holds a ticket: a registration excluded at closing
  // is not kept.
  bool registered = 6;

  // The tickets 1..N of the fixed pool in registration order. Empty until the
  // pool is fixed, and empty when it is fixed with no ticket.
  repeated RaffleTicket tickets = 7;

  // The number of the viewer's ticket. Unset until the pool is fixed and when
  // the viewer has no ticket in it.
  optional uint32 my_ticket = 8;

  // Unset until the draw is revealed: set with DRAWN and NO_TICKETS.
  RaffleReveal reveal = 9;
}

enum RaffleStatus {
  RAFFLE_STATUS_UNSPECIFIED = 0;

  // Registration is open.
  RAFFLE_STATUS_OPEN = 1;

  // closes_at has passed and the pool is being fixed; registration is closed.
  RAFFLE_STATUS_CLOSING = 2;

  // The pool is fixed and the draw waits for the randomness of beacon_round.
  RAFFLE_STATUS_AWAITING_BEACON = 3;

  // The winning ticket is drawn.
  RAFFLE_STATUS_DRAWN = 4;

  // The pool was fixed with no ticket: the raffle did not take place, and the
  // seed is revealed without a draw.
  RAFFLE_STATUS_NO_TICKETS = 5;

  // Prebidding started no earlier than closes_at: registration never opened.
  RAFFLE_STATUS_NOT_HELD = 6;

  // The auction was cancelled before the draw: registration is closed, no draw
  // will take place, and the seed is not revealed.
  RAFFLE_STATUS_CANCELLED = 7;
}

message RaffleTicket {
  // 1..N without gaps.
  uint32 number = 1;

  // The display name of the holder as the bid history shows it, marks applied,
  // as it was when the pool was fixed. Unset once names are erased after the
  // retention period: the number stays.
  optional string display_name = 2;
}

// What a participant needs to recompute the draw without access to the service.
message RaffleReveal {
  // The seed: 64 lowercase hex characters. Its hash is commitment.
  string seed = 1;

  // The randomness of beacon_round as drand publishes it, lowercase hex. Empty
  // with NO_TICKETS.
  string randomness = 2;

  // The hash of "<seed>:<N>:<randomness>", N in decimal without leading zeros.
  // Empty with NO_TICKETS.
  string value = 3;

  // value read as an unsigned big-endian number, modulo N, plus one. Unset with
  // NO_TICKETS.
  optional uint32 winning_ticket = 4;
}

message SubmitPredictionRequest {
  // The participant who predicts: there is no separate participant field. The
  // viewer must hold place_bids.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: the auction of a meetup.
  string auction_id = 2;

  // UNSPECIFIED is not a value.
  PredictionRound round = 3;

  // The whole prediction of the round: it replaces the previous one. Each
  // nomination at most once and only nominations of the round. An empty list
  // clears the prediction.
  repeated PredictionAnswer answers = 4;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 5;
}

message SubmitPredictionResponse {
  // Exactly one is set. A repeat of the same op_id is accepted and returns the
  // prediction that op_id sent, even if a later one replaced it.
  oneof outcome {
    Prediction accepted = 1;
    PredictionRefusal refused = 2;
  }
}

message PredictionRefusal {
  // Exactly one is set.
  oneof reason {
    PredictionRoundNotOpen round_not_open = 1;
    PredictionRoundClosed round_closed = 2;
    PredictionsCancelled predictions_cancelled = 3;
    DisplayNameNotChosen display_name_not_chosen = 4;
    PredictionLotNotInRound lot_not_in_round = 5;
  }
}

message PredictionRoundNotOpen {}

message PredictionRoundClosed {}

message PredictionsCancelled {}

// The first answer, in request order, whose lot is not a lot of the round.
message PredictionLotNotInRound {
  PredictionNomination nomination = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

message GetMyPredictionsRequest {
  // The viewer must hold place_bids. The response is about them only: there is
  // no way to read the prediction of another participant.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetMyPredictionsResponse {
  // Both rounds, catalog first. Carries no other participant and no count of
  // predictions.
  repeated PredictionRoundView rounds = 1;
}

message PredictionRoundView {
  PredictionRound round = 1;

  // UNSPECIFIED is not a value.
  PredictionRoundStatus status = 2;

  // The viewer's prediction of the round. Empty when there is none.
  repeated PredictionAnswer answers = 3;
}

// The viewer's own prediction of one round.
message Prediction {
  PredictionRound round = 1;

  // In nomination order. Empty when the prediction is cleared.
  repeated PredictionAnswer answers = 2;
}

message PredictionAnswer {
  // UNSPECIFIED is not a value.
  PredictionNomination nomination = 1;

  // Exactly one is set, the one the nomination asks for.
  oneof answer {
    // Canonical lowercase UUIDv7 with hyphens.
    string lot_id = 2;

    // Not negative. A sum is in minor units of the auction currency; a count is
    // a number of bids.
    int64 number = 3;
  }
}

enum PredictionRound {
  PREDICTION_ROUND_UNSPECIFIED = 0;

  PREDICTION_ROUND_CATALOG = 1;

  PREDICTION_ROUND_FINAL = 2;
}

enum PredictionRoundStatus {
  PREDICTION_ROUND_STATUS_UNSPECIFIED = 0;

  // The round has not opened yet.
  PREDICTION_ROUND_STATUS_NOT_OPEN = 1;

  PREDICTION_ROUND_STATUS_OPEN = 2;

  // The round is closed and the prediction is fixed.
  PREDICTION_ROUND_STATUS_CLOSED = 3;

  // The auction was cancelled: the game has no results.
  PREDICTION_ROUND_STATUS_CANCELLED = 4;
}

// The ten nominations. Each belongs to one round and asks for either a lot or
// a number; an answer of the other round or the other kind is malformed.
enum PredictionNomination {
  PREDICTION_NOMINATION_UNSPECIFIED = 0;

  // Catalog round, a lot.
  PREDICTION_NOMINATION_MOST_EXPENSIVE_LOT = 1;

  // Catalog round, a number.
  PREDICTION_NOMINATION_TOTAL_SALES = 2;

  // Catalog round, a lot.
  PREDICTION_NOMINATION_MOST_BIDS_LOT = 3;

  // Catalog round, a lot.
  PREDICTION_NOMINATION_BIGGEST_GROWTH_LOT = 4;

  // Catalog round, a lot.
  PREDICTION_NOMINATION_MOST_BIDDERS_LOT = 5;

  // Catalog round, a number.
  PREDICTION_NOMINATION_TOTAL_BIDS = 6;

  // Final round, a lot.
  PREDICTION_NOMINATION_FINAL_MOST_EXPENSIVE_LOT = 7;

  // Final round, a number.
  PREDICTION_NOMINATION_FINAL_TOTAL_SALES = 8;

  // Final round, a lot.
  PREDICTION_NOMINATION_FINAL_BIGGEST_GROWTH_LOT = 9;

  // Final round, a number.
  PREDICTION_NOMINATION_FINAL_TOTAL_BIDS = 10;
}

message MarkInvoicePaidRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoicePaidResponse {
  // Exactly one is set. An invoice that is already paid or handed over is
  // accepted, not refused, and no second transition is recorded.
  oneof outcome {
    InvoicePaymentAccepted accepted = 1;
    MarkInvoicePaidRefusal refused = 2;
  }
}

message InvoicePaymentAccepted {}

message MarkInvoicePaidRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

message MarkInvoiceHandedOverRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoiceHandedOverResponse {
  // Exactly one is set. An invoice that is already handed over is accepted, not
  // refused, and no second transition is recorded.
  oneof outcome {
    InvoiceHandoverAccepted accepted = 1;
    MarkInvoiceHandedOverRefusal refused = 2;
  }
}

message InvoiceHandoverAccepted {}

message MarkInvoiceHandedOverRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    InvoiceNotPaid invoice_not_paid = 3;
  }
}

// The invoice still awaits payment: a lot is handed over only after it is paid.
message InvoiceNotPaid {}

message ChooseFulfillmentRequest {
  // The winner the invoice is addressed to. An invoice of someone else is not
  // found for the viewer.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // UNSPECIFIED is not a value: a choice cannot be taken back to none.
  FulfillmentMethod method = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message ChooseFulfillmentResponse {
  // Exactly one is set. The method replaces the previous choice, if any.
  oneof outcome {
    FulfillmentAccepted accepted = 1;
    ChooseFulfillmentRefusal refused = 2;
  }
}

message FulfillmentAccepted {}

message ChooseFulfillmentRefusal {
  // Exactly one is set.
  oneof reason {
    FulfillmentFrozen fulfillment_frozen = 1;
  }
}

// The lot is already handed over: the method no longer changes.
message FulfillmentFrozen {}

message ListMyInvoicesRequest {
  // The winner. Only the invoices addressed to the viewer are returned.
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;
}

message ListMyInvoicesResponse {
  // Every invoice of the viewer in the auction, in no meaningful order. There are
  // no pages: the list is bounded by the sales of one auction - one invoice per
  // sale, and a lot is sold to at most one bid at a time - and a total is summed
  // from the whole of it. Empty when the viewer won nothing.
  repeated InvoiceSnapshot invoices = 1;
}

message ListAuctionInvoicesRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message ListAuctionInvoicesResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionInvoices invoices = 1;
    ListAuctionInvoicesRefusal refused = 2;
  }
}

message AuctionInvoices {
  // Every invoice of the auction, in no meaningful order. There are no pages, for
  // the reason ListMyInvoicesResponse gives. Empty when no lot is sold.
  repeated InvoiceSnapshot invoices = 1;
}

message ListAuctionInvoicesRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

// The state of an invoice as a read returns it. Field numbers and status types
// match auction.v1.InvoiceState so that the two stay readable side by side.
message InvoiceSnapshot {
  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 3;

  // Canonical lowercase UUIDv7 with hyphens: the winner the invoice is addressed
  // to.
  string winner_id = 4;

  // The amount to pay: the price of the sale.
  Money amount = 5;

  // RFC 3339 instant in UTC: the payment is due by this moment. An invoice is
  // overdue when it still awaits payment after it.
  string payment_due_at = 6;

  // How the winner receives the lot. UNSPECIFIED is a real value: the winner has
  // not chosen yet. Not on the bus: see InvoiceState.
  FulfillmentMethod fulfillment = 7;

  // Where the invoice is. Exactly one is set.
  oneof status {
    InvoiceState.AwaitingPayment awaiting_payment = 10;
    InvoiceState.Paid paid = 11;
    InvoiceState.HandedOver handed_over = 12;
  }
}
