    LineupFrozen lineup_frozen = 6;
    LotNotOpen lot_not_open = 7;
    NotInOnlinePhase not_in_online_phase = 8;
    DeadlinePassed deadline_passed = 9;
    NotALotParticipant not_a_lot_participant = 10;
    ParticipantAlreadyRemoved participant_already_removed = 11;
    LotChanged lot_changed = 12;
  }
}

// The lineup of the final is frozen: a lot held for it keeps its price and leader.
message LineupFrozen {}

// The participant has neither an accepted bid nor a proxy limit on the lot, not
// even a limit they withdrew themselves.
message NotALotParticipant {}

message ParticipantAlreadyRemoved {}

