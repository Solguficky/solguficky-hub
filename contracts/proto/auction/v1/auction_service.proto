  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: a lot in the registry of the auction.
  string lot_id = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;

  // The next price the auctioneer announces.
  Money new_ask = 5;
}

message AdvanceAskResponse {
  // Exactly one is set.
  oneof outcome {
    AskAdvanceAccepted accepted = 1;
    AdvanceAskRefusal refused = 2;
  }
}

// Carries nothing: the ask is visible in the state of the lot.
message AskAdvanceAccepted {}

message AdvanceAskRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotNotInAuction lot_not_in_auction = 3;
    LotNotOpen lot_not_open = 4;
    AskBelowCurrentPrice ask_below_current_price = 5;
    CurrencyMismatch currency_mismatch = 6;
    MeetupCancelled meetup_cancelled = 7;
  }
