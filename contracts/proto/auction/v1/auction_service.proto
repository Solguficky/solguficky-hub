    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    NotInBreak not_in_break = 3;
    LineupEmpty lineup_empty = 4;
    LineupMismatch lineup_mismatch = 5;
    MeetupCancelled meetup_cancelled = 6;
  }
}

// The auction is not in the break between prebidding and the final.
message NotInBreak {}

// No lot is held for the final, so there is no lineup to freeze.
