  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotsFrozen lots_frozen = 3;
    LotNotInAuction lot_not_in_auction = 4;
    SchedulingClosed scheduling_closed = 5;
    StepPolicyInvalid step_policy_invalid = 6;
    CurrencyMismatch currency_mismatch = 7;
  }
}

// The lot has been opened: its trading conditions no longer change.
message SchedulingClosed {}

// The step policy contradicts itself: a step that is not positive, tiers that are
// empty, unsorted or do not start at zero, or amounts in different currencies.
message StepPolicyInvalid {}

message ScheduleAuctionRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;

  // The configuration as a whole: it replaces the stored one. Required, and so is
  // its closing_policy. lot_defaults is optional: unset, the auction fills in the
  // defaults of the platform; set, its step_policy and anti_snipe are required.
  AuctionConfig config = 4;
}

message ScheduleAuctionResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionSchedulingAccepted accepted = 1;
    ScheduleAuctionRefusal refused = 2;
  }
}

// Carries nothing: the stored configuration is visible in the auction snapshot.
message AuctionSchedulingAccepted {}

message ScheduleAuctionRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    ConfigInvalid config_invalid = 3;
    AuctionAlreadyStarted auction_already_started = 4;
  }
}

// The configuration contradicts itself. It is derived from the configuration
// alone, without the clock and without the lots.
message ConfigInvalid {
  // Exactly one is set.
  oneof reason {
    // The lots need a deadline, and closes_at is unset - also when there is no
    // online phase at all.
    ClosesAtMissing closes_at_missing = 1;

    // closes_at is not after opens_at.
    ClosesAtNotAfterOpensAt closes_at_not_after_opens_at = 2;

    // final_blocks is neither 0 nor 1.
    FinalBlocksOutOfRange final_blocks_out_of_range = 3;

    // The step policy of lot_defaults contradicts itself or is in another
    // currency than lot_defaults.
    StepPolicyInvalid lot_defaults_step_policy_invalid = 4;

    // A step window is set while closes_at is unset, also when there is no
    // online phase at all.
    StepWindowWithoutClosesAt step_window_without_closes_at = 5;

    // A step window does not lie within opens_at <= from < until <= closes_at.
    StepWindowOutsideOnlinePhase step_window_outside_online_phase = 6;

    // Two step windows name a common lot and their intervals intersect.
    StepWindowsOverlap step_windows_overlap = 7;

    // The step of a step window is not positive or is in another currency than
    // the lots: lot_defaults, or the platform defaults when they are unset.
    StepWindowStepInvalid step_window_step_invalid = 8;

    // A step window names no lot.
    StepWindowLotsEmpty step_window_lots_empty = 9;

    // online_phase.raffle_closes_at is not after opens_at.
    RaffleClosesAtNotAfterOpensAt raffle_closes_at_not_after_opens_at = 10;

    // online_phase.raffle_closes_at is not before closes_at.
    RaffleClosesAtNotBeforeClosesAt raffle_closes_at_not_before_closes_at = 11;
  }
}

message RaffleClosesAtNotAfterOpensAt {}

message RaffleClosesAtNotBeforeClosesAt {}

message ClosesAtMissing {}

message ClosesAtNotAfterOpensAt {}

message FinalBlocksOutOfRange {}

// The windows below are named by their position in AuctionConfig.step_windows,
// starting at 0. 0 is a real value: the first window.

message StepWindowWithoutClosesAt {
  int32 window_index = 1;
}

message StepWindowOutsideOnlinePhase {
  int32 window_index = 1;
}

message StepWindowsOverlap {
  // The earlier of the two windows in step_windows.
  int32 first_index = 1;

  int32 second_index = 2;
}

message StepWindowStepInvalid {
  int32 window_index = 1;
}

message StepWindowLotsEmpty {
  int32 window_index = 1;
}

