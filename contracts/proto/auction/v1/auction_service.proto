  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

// The image of a lot as it is stored now: the cover for GetLotImage, the named
// photo for GetLotPhoto. GetRafflePrizePhoto returns the photo of a raffle prize
// in the same form.
