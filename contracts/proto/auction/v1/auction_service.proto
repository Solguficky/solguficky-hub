message CloseLotRequest {
  // The auctioneer: the administrator of the meetup of the auction, checked with
  // the meetup. The closing reason is deliberately absent: a caller closes a lot
  // only by the decision of the auctioneer, and the auction closes lots at their
  // deadline by itself.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: a lot in the registry of the auction.
  string lot_id = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

