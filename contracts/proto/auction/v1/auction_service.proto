  // Exactly one is set.
  oneof outcome {
    LotClosure accepted = 1;
    CloseLotRefusal refused = 2;
  }
}

// How the lot ended. Exactly one is set.
message LotClosure {
  oneof result {
    LotSale sold = 1;
    UnsoldReason unsold = 2;
  }
}

message CloseLotRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotNotInAuction lot_not_in_auction = 3;
    LotNotOpen lot_not_open = 4;
    DeadlineNotReached deadline_not_reached = 5;
  }
}

// The lot trades online until its deadline and is not closed before it.
message DeadlineNotReached {}

message WatchAuctionRequest {
  // Who watches. The stream is the same for every viewer: nothing in it depends
  // on who asks.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

// The state of an auction and of its final after a change. Every message is the
// whole state, not a difference: the first one is the state at the moment of
// subscribing, and each next one follows a change. A client that reconnects
// loses no state, only the intermediate steps between two messages; the bids in
// between are read with ListLotHistory.
message AuctionWatch {
  AuctionSnapshot auction = 1;

  // The active lot of the live final. Unset when no lot is active - before the
  // final, between lots and after it.
  LotSnapshot active_lot = 2;

  // The lots of the frozen lineup in its order, the active one included. Empty
  // until the lineup is frozen. In this stream LotSnapshot.viewer_proxy_limit is
  // never set: the proxy limit of a viewer is read with GetLot.
  repeated LotSnapshot lineup = 3;
}

message GetAuctionConsoleRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message GetAuctionConsoleResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionConsole console = 1;
    GetAuctionConsoleRefusal refused = 2;
  }
}

message GetAuctionConsoleRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

// The auction as its meetup administrator runs it. The console is the only read
// that names a lot marked for the final before the lineup is frozen.
message AuctionConsole {
  AuctionSnapshot auction = 1;

  // Every lot of the registry, in no particular order. The registry is not paged:
  // the administrator enters its lots one by one.
  repeated ConsoleLot lots = 2;
}

message ConsoleLot {
  // The lot as the administrator sees it as a viewer.
  LotSnapshot lot = 1;

  // The lot is marked for the final: trading online with the mark, or already
  // held for the final. false is a real value.
  bool marked_for_final = 2;

  // The lot is trading past its deadline by more than the grace of the service:
  // it should have closed and has not. false is a real value.
  bool overdue = 3;
}

message GetAuctionLotStatisticsRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message GetAuctionLotStatisticsResponse {
  // Exactly one is set. The refusal is shared with the administrator's console.
  oneof outcome {
    AuctionLotStatistics statistics = 1;
    GetAuctionConsoleRefusal refused = 2;
  }
}

message AuctionLotStatistics {
  // Every lot of the registry, without pagination or a meaningful order.
  // The caller ranks the complete list.
  repeated LotStatistics lots = 1;
}

// Aggregates only: no participant ids, display names or proxy limit amounts.
message LotStatistics {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;

  // Accepted BidPlaced facts, manual and proxy alike, as LotSnapshot.bid_count.
  // A folded proxy chain counts once; 0 means no accepted bid yet.
  int64 bid_count = 2;

  // Distinct people across BidPlaced and accepted ProxyLimitSet facts of the lot.
  // A person counts once even if their limit never produced a bid in their name
  // or was later withdrawn. Refused commands do not count; 0 is a real value.
  int64 unique_participant_count = 3;

  // Absolute difference between current and starting price, in the lot's currency,
  // not a percentage. Unset when no starting price exists; set to zero before the
  // first bid. A zero starting price does not make the difference undefined.
  Money price_growth = 4;

  // RFC 3339 instant in UTC of the last BidPlaced in journal sequence order,
  // whether manual or proxy. Unset when no bid exists, not an empty string.
  optional string last_bid_at = 5;
}

message GetMeetupAuctionRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string meetup_id = 2;
}

message GetMeetupAuctionResponse {
  // Unset when the meetup has no auction: absent, not an error. A draft is
  // returned here, unlike in ListAuctions.
  AuctionSnapshot auction = 1;
}

message GetAuctionRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetAuctionResponse {
  // Unset when there is no such auction for this caller: absent, not an error.
  // Whether a draft is returned depends on the caller, see
  // docs/architecture/integration.md, section "Auction gRPC".
  AuctionSnapshot auction = 1;
}

message ListAuctionsRequest {
  Viewer viewer = 1;

  // Which auctions to list. UNSPECIFIED is not a value.
  AuctionListing listing = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

// A selection of auctions by status. A draft is in none of them.
enum AuctionListing {
  AUCTION_LISTING_UNSPECIFIED = 0;

  // Scheduled and not finished: from scheduled to in_final.
  AUCTION_LISTING_ACTIVE = 1;

  // Past: finished or cancelled. The status of each auction tells which.
  AUCTION_LISTING_FINISHED = 2;
}

message ListAuctionsResponse {
  repeated AuctionSnapshot auctions = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// The state of an auction as a read returns it. Field numbers and status types
// match auction.v1.AuctionState so that the two stay readable side by side.
message AuctionSnapshot {
  // The meetup is not here: a list must not lead from an auction to its meetup,
  // and a read by meetup already names it.
  reserved 4;
  reserved "meetup_id";

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string id = 1;

  // Unset on a draft. Replaceable until prebidding starts, frozen after.
  AuctionConfig config = 2;

  // Canonical lowercase UUIDv7 with hyphens: the registry of the auction. The
  // order carries no meaning.
  repeated string lot_ids = 3;

  // Where the auction is. Exactly one is set.
  oneof status {
    AuctionState.Draft draft = 10;
    AuctionState.Scheduled scheduled = 11;
    AuctionState.Prebidding prebidding = 12;
    AuctionState.Settling settling = 13;
    AuctionState.Break on_break = 14;
    AuctionState.LineupFrozen lineup_frozen = 15;
    AuctionState.Final in_final = 16;
    AuctionState.Finished finished = 17;
    AuctionState.Cancelled cancelled = 18;
  }
}

message RegisterForRaffleRequest {
