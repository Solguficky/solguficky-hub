  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;

  // Canonical lowercase UUIDv7 with hyphens: the held lots in the order they go
  // in the final. Every held finalist appears exactly once.
  repeated string lot_ids = 4;
}

message FreezeFinalLineupResponse {
  // Exactly one is set.
  oneof outcome {
    FinalLineupFreezeAccepted accepted = 1;
    FreezeFinalLineupRefusal refused = 2;
  }
