syntax = "proto3";

package auction.v1;

import "auction/v1/auction.proto";
import "auction/v1/auction_events.proto";
import "identity/v1/access.proto";

// Commands of a participant, commands of the lot catalog, the birth of an auction
// at a meetup, the registry of its lots, the trading conditions of a lot, the
// scheduling of an auction and the start of its prebidding, the selection of lots
// for the final, the commands of the live final and its stream, reads of a lot,
// of its history, of its image, of the display names of participants and of
// auctions, the console and lot statistics of the meetup administrator, the
// raffle among participants, the predictions game, and the invoices of sold
// lots: the commands of the organizer and of the winner and their reads.
//
// A named refusal is a value of the response, not a gRPC status: a command
// response carries exactly one of accepted or refused, and a refusal carries the
// values a caller needs to show it. When refusals are final, how op_id is
// replayed and which conditions still answer with a status are documented in
// docs/architecture/integration.md, section "Auction gRPC".
//
// The steps the auction takes by itself - the end of prebidding and the closing
// of a lot at its deadline - are deliberately absent, and so is the withdrawal of
// a lot.
service AuctionService {
  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse);
  rpc SetProxyLimit(SetProxyLimitRequest) returns (SetProxyLimitResponse);
  rpc WithdrawProxyLimit(WithdrawProxyLimitRequest) returns (WithdrawProxyLimitResponse);
  rpc CreateLotCard(CreateLotCardRequest) returns (CreateLotCardResponse);
  rpc EditLotCard(EditLotCardRequest) returns (EditLotCardResponse);
  rpc GetLot(GetLotRequest) returns (LotSnapshot);
  rpc ListAuctionLots(ListAuctionLotsRequest) returns (ListAuctionLotsResponse);
  rpc ListLotHistory(ListLotHistoryRequest) returns (ListLotHistoryResponse);
  rpc ChooseDisplayName(ChooseDisplayNameRequest) returns (ChooseDisplayNameResponse);
  rpc GetDisplayNames(GetDisplayNamesRequest) returns (GetDisplayNamesResponse);
  rpc ListAuctionNames(ListAuctionNamesRequest) returns (ListAuctionNamesResponse);
  rpc GetFaqAcknowledgement(GetFaqAcknowledgementRequest) returns (FaqAcknowledgement);
  rpc AcknowledgeFaq(AcknowledgeFaqRequest) returns (FaqAcknowledgement);
  rpc GetLotImage(GetLotImageRequest) returns (LotImage);
  rpc AddLotPhoto(AddLotPhotoRequest) returns (AddLotPhotoResponse);
  rpc RemoveLotPhoto(RemoveLotPhotoRequest) returns (RemoveLotPhotoResponse);
  rpc GetLotPhoto(GetLotPhotoRequest) returns (LotImage);
  rpc DraftAuction(DraftAuctionRequest) returns (DraftAuctionResponse);
  rpc AddLot(AddLotRequest) returns (AddLotResponse);
  rpc RemoveLot(RemoveLotRequest) returns (RemoveLotResponse);
  rpc SaveLotSet(SaveLotSetRequest) returns (SaveLotSetResponse);
  rpc DeleteLotSet(DeleteLotSetRequest) returns (DeleteLotSetResponse);
  rpc ScheduleLot(ScheduleLotRequest) returns (ScheduleLotResponse);
  rpc ScheduleAuction(ScheduleAuctionRequest) returns (ScheduleAuctionResponse);
  rpc StartPrebidding(StartPrebiddingRequest) returns (StartPrebiddingResponse);
  rpc DiscardAuction(DiscardAuctionRequest) returns (DiscardAuctionResponse);
  rpc PublishAuction(PublishAuctionRequest) returns (PublishAuctionResponse);
  rpc HideAuction(HideAuctionRequest) returns (HideAuctionResponse);
  rpc CancelAuction(CancelAuctionRequest) returns (CancelAuctionResponse);
  rpc SetFinalTime(SetFinalTimeRequest) returns (SetFinalTimeResponse);
  rpc SelectForFinal(SelectForFinalRequest) returns (SelectForFinalResponse);
  rpc DeselectForFinal(DeselectForFinalRequest) returns (DeselectForFinalResponse);
  rpc PreviewParticipantRemoval(PreviewParticipantRemovalRequest) returns (PreviewParticipantRemovalResponse);
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
  rpc LaunchStepWindow(LaunchStepWindowRequest) returns (LaunchStepWindowResponse);
  rpc FreezeFinalLineup(FreezeFinalLineupRequest) returns (FreezeFinalLineupResponse);
  rpc StartFinal(StartFinalRequest) returns (StartFinalResponse);
  rpc StartNextLot(StartNextLotRequest) returns (StartNextLotResponse);
  rpc AdvanceAsk(AdvanceAskRequest) returns (AdvanceAskResponse);
  rpc CloseLot(CloseLotRequest) returns (CloseLotResponse);
  rpc WatchAuction(WatchAuctionRequest) returns (stream AuctionWatch);
  rpc GetAuctionConsole(GetAuctionConsoleRequest) returns (GetAuctionConsoleResponse);
  rpc GetAuctionLotStatistics(GetAuctionLotStatisticsRequest) returns (GetAuctionLotStatisticsResponse);
  rpc GetAuctionDaySummary(GetAuctionDaySummaryRequest) returns (GetAuctionDaySummaryResponse);
  rpc GetMeetupAuction(GetMeetupAuctionRequest) returns (GetMeetupAuctionResponse);
  rpc GetAuction(GetAuctionRequest) returns (GetAuctionResponse);
  rpc ListAuctions(ListAuctionsRequest) returns (ListAuctionsResponse);
  rpc RegisterForRaffle(RegisterForRaffleRequest) returns (RegisterForRaffleResponse);
  rpc CancelRaffleRegistration(CancelRaffleRegistrationRequest) returns (CancelRaffleRegistrationResponse);
  rpc GetRaffle(GetRaffleRequest) returns (GetRaffleResponse);
  rpc AssignRaffleWinner(AssignRaffleWinnerRequest) returns (AssignRaffleWinnerResponse);
  rpc ChangeRafflePrize(ChangeRafflePrizeRequest) returns (ChangeRafflePrizeResponse);
  rpc SetRafflePrizePhoto(SetRafflePrizePhotoRequest) returns (SetRafflePrizePhotoResponse);
  rpc RemoveRafflePrizePhoto(RemoveRafflePrizePhotoRequest) returns (RemoveRafflePrizePhotoResponse);
  rpc GetRafflePrizePhoto(GetRafflePrizePhotoRequest) returns (LotImage);
  rpc SubmitPrediction(SubmitPredictionRequest) returns (SubmitPredictionResponse);
  rpc GetMyPredictions(GetMyPredictionsRequest) returns (GetMyPredictionsResponse);
  rpc GetPredictionResults(GetPredictionResultsRequest) returns (GetPredictionResultsResponse);
  rpc SettlePredictionResultsManually(SettlePredictionResultsManuallyRequest) returns (SettlePredictionResultsManuallyResponse);
  rpc MarkInvoicePaid(MarkInvoicePaidRequest) returns (MarkInvoicePaidResponse);
  rpc MarkInvoiceHandedOver(MarkInvoiceHandedOverRequest) returns (MarkInvoiceHandedOverResponse);
  rpc ChooseFulfillment(ChooseFulfillmentRequest) returns (ChooseFulfillmentResponse);
  rpc ListMyInvoices(ListMyInvoicesRequest) returns (ListMyInvoicesResponse);
  rpc ListAuctionInvoices(ListAuctionInvoicesRequest) returns (ListAuctionInvoicesResponse);
  rpc SetPaymentInstructions(SetPaymentInstructionsRequest) returns (SetPaymentInstructionsResponse);
  rpc GetAuctionDayChronicle(GetAuctionDayChronicleRequest) returns (GetAuctionDayChronicleResponse);
  rpc GetAuctionChronicle(GetAuctionChronicleRequest) returns (GetAuctionChronicleResponse);
  rpc SetLotLayout(SetLotLayoutRequest) returns (SetLotLayoutResponse);
  rpc SetPromoVideo(SetPromoVideoRequest) returns (SetPromoVideoResponse);
  rpc ListAuctionEngagement(ListAuctionEngagementRequest) returns (ListAuctionEngagementResponse);
}

message Viewer {
  // Canonical lowercase UUIDv7 with hyphens: the platform identity from Identity.
  // It is the participant of a command. The one exception is a floor bid, which
  // names its participant in PlaceBidRequest.participant_id; no other request can
  // act for someone else.
  string identity_id = 1;

  reserved 2;
  reserved "global_roles";

  // Rights from Identity, copied as received from ResolveIdentityResponse.rights.
  // An empty set means no rights. The block mark is deliberately absent, as in
  // meetups.v1.Viewer.
  repeated identity.v1.AccessRight rights = 3;
}

message PlaceBidRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // In the live final this is the expected next price: any other amount, higher
  // or lower, is refused with the actual next price.
  Money amount = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens: the idempotency key,
  // checked by the domain.
  string op_id = 4;

  // Unset means BID_SOURCE_BOT: the viewer bids for itself. BID_SOURCE_FLOOR is a
  // bid from the room that the auctioneer enters for participant_id; the viewer is
  // then the auctioneer, not the bidder.
  BidSource source = 5;

  // Canonical lowercase UUIDv7 with hyphens: the platform identity of the bidder
  // in the room. Set exactly when source is BID_SOURCE_FLOOR and empty otherwise.
  string participant_id = 6;
}

message PlaceBidResponse {
  // Exactly one is set.
  oneof outcome {
    BidAccepted accepted = 1;
    PlaceBidRefusal refused = 2;
  }
}

message BidAccepted {
  // Canonical lowercase UUIDv7 with hyphens.
  string bid_id = 1;

  // The LotSnapshot.version from which GetLot shows the whole command: the bid and
  // whatever it triggered. A repeat of the same op_id answers the version of the lot
  // at that moment, which may be higher. 0 means the service did not tell.
  int64 lot_version = 2;
}

message PlaceBidRefusal {
  // Exactly one is set.
  oneof reason {
    LotNotOpen lot_not_open = 1;
    LotOnHold lot_on_hold = 2;
    BidBelowMinimum bid_below_minimum = 3;
    BidNotAtNextPrice bid_not_at_next_price = 4;
    BidderIsLeader bidder_is_leader = 5;
    CurrencyMismatch currency_mismatch = 6;
    DisplayNameNotChosen display_name_not_chosen = 7;

    // Floor bids only: a bid from the bot never carries these.
    NotMeetupAdministrator not_meetup_administrator = 8;
    MeetupNotFound meetup_not_found = 9;
    ParticipantCannotBid participant_cannot_bid = 10;

    // The participant was removed from this lot; for a floor bid, the participant it names.
    ParticipantRemovedFromLot participant_removed_from_lot = 11;

    // Online manual bids only: the amount is above the lot's ceiling.
    BidAboveMaximum bid_above_maximum = 12;
  }
}

// Who removed the participant from the lot and why is deliberately not carried.
message ParticipantRemovedFromLot {}

// The participant named by a floor bid does not hold place_bids.
message ParticipantCannotBid {}

message SetProxyLimitRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // The new limit. It replaces the viewer's current limit on the lot, if any.
  Money max = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message SetProxyLimitResponse {
  // Exactly one is set. Whether the limit also produced a bid is not carried here;
  // it is visible in the state of the lot from ProxyLimitAccepted.lot_version on.
  oneof outcome {
    ProxyLimitAccepted accepted = 1;
    SetProxyLimitRefusal refused = 2;
  }
}

message ProxyLimitAccepted {
  // The LotSnapshot.version from which GetLot shows the whole command: the limit and
  // whatever bid it triggered. A repeat of the same op_id answers the version of the
  // lot at that moment, which may be higher. 0 means the service did not tell.
  int64 lot_version = 1;
}

message SetProxyLimitRefusal {
  // Exactly one is set.
  oneof reason {
    LotNotOpen lot_not_open = 1;
    ProxyBelowCurrentPrice proxy_below_current_price = 2;
    ProxyDisabledForLot proxy_disabled_for_lot = 3;
    CurrencyMismatch currency_mismatch = 4;
    DisplayNameNotChosen display_name_not_chosen = 5;
    ParticipantRemovedFromLot participant_removed_from_lot = 6;
  }
}

message WithdrawProxyLimitRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message WithdrawProxyLimitResponse {
  // Exactly one is set.
  oneof outcome {
    ProxyLimitWithdrawalAccepted accepted = 1;
    WithdrawProxyLimitRefusal refused = 2;
  }
}

message ProxyLimitWithdrawalAccepted {}

message WithdrawProxyLimitRefusal {
  // Exactly one is set.
  oneof reason {
    NoActiveProxyLimit no_active_proxy_limit = 1;
  }
}

// The lot is not trading: not opened yet, or already closed.
message LotNotOpen {}

// The lot is held for the live final and accepts no bids until it is resumed.
message LotOnHold {
  // The price of the lot at the moment the bid was decided.
  Money current_price = 1;
}

message BidBelowMinimum {
  // The lowest amount the lot accepts now.
  Money min_required = 1;
}

// The manual online bid is above the highest amount the lot accepts now.
message BidAboveMaximum {
  // The highest amount the lot accepts for this bid.
  Money maximum = 1;
}

// Live final only: a bid is accepted exactly at the next price.
message BidNotAtNextPrice {
  // The next price at the moment the bid was decided.
  Money expected = 1;
}

// The bidder already leads the lot.
message BidderIsLeader {
  // The price of the lot at the moment the bid was decided: the bidder's own.
  Money current_price = 1;
}

// The currency of the amount differs from the currency of the lot.
message CurrencyMismatch {}

// The limit is below the current price of the lot, or below the announced ask
// when it is higher. A limit equal to that price is accepted: the leader may
// lower its own limit down to it.
message ProxyBelowCurrentPrice {
  // The lowest limit the lot accepted at the moment the limit was decided.
  Money min_limit = 1;
}

message ProxyDisabledForLot {}

message NoActiveProxyLimit {}

// The viewer has not chosen how to be shown in the auction of the lot.
message DisplayNameNotChosen {}

// The catalog card of a lot: what a lot is, not how it trades. It is not part of
// the trading domain and never appears on the bus.
message LotCard {
  // Stored and returned as entered, without trimming.
  string title = 1;

  // Empty means that the lot has no description.
  string description = 2;

  // Unset when the lot has no image. The bytes are not here: they are read with
  // GetLotImage, so a caller that already shows this version does not load them.
  // With photos it is the cover: the version of the first of them.
  LotImageRef image = 3;

  // The photos of the lot in display order, at most ten; the first is the cover
  // and equals image. The order is the order of adding. Empty when the lot has
  // no photo, and from an Auction that predates the list: a caller then shows
  // image alone. The bytes are read with GetLotPhoto.
  repeated LotPhotoRef photos = 4;
}

// Names one photo of a lot without carrying it.
message LotPhotoRef {
  // Canonical lowercase UUIDv7 with hyphens: the caller-generated id of
  // AddLotPhoto, or an id Auction gave a photo stored with the card.
  string photo_id = 1;

  // Opaque, compared only for equality, as LotImageRef.version: equal bytes give
  // an equal version, in this lot or another.
  string version = 2;
}

// Names one image of a lot without carrying it.
message LotImageRef {
  // Opaque, compared only for equality: it changes whenever the image changes.
  string version = 1;
}

message CreateLotCardRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens, generated by the caller: the card is
  // created before the lot and the lot takes the same id.
  string lot_id = 2;

  string title = 3;

  string description = 4;

  // Unset creates the card without an image. Set, it becomes the first photo.
  LotImageUpload image = 5;
}

// An image file sent to the catalog. There is no media type: Auction detects it
// from the bytes.
message LotImageUpload {
  // The encoded image file as downloaded from Telegram.
  bytes content = 1;
}

message CreateLotCardResponse {
  // Exactly one is set.
  oneof outcome {
    LotCard accepted = 1;
    CreateLotCardRefusal refused = 2;
  }
}

message CreateLotCardRefusal {
  // Exactly one is set.
  oneof reason {
    NotAdmin not_admin = 1;
    EmptyTitle empty_title = 2;
    CardConflict card_conflict = 3;
    ImageTooLarge image_too_large = 4;
    UnsupportedImage unsupported_image = 5;
  }
}

message EditLotCardRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Both text fields replace the stored ones.
  string title = 3;

  string description = 4;

  // Unset keeps the stored image, or its absence, as it is: an edit of the text
  // does not resend the file. Both changes address the cover: replace_image
  // replaces the first photo, or adds one to a lot without photos, and
  // remove_image removes the first photo. Other photos stay.
  oneof image_change {
    LotImageUpload replace_image = 5;
    LotImageRemoval remove_image = 6;
  }
}

// Removes the image of the card: the cover, the first of its photos.
message LotImageRemoval {}

message EditLotCardResponse {
  // Exactly one is set.
  oneof outcome {
    LotCard accepted = 1;
    EditLotCardRefusal refused = 2;
  }
}

message EditLotCardRefusal {
  // Exactly one is set.
  oneof reason {
    NotAdmin not_admin = 1;
    EmptyTitle empty_title = 2;
    CardNotFound card_not_found = 3;
    ImageTooLarge image_too_large = 4;
    UnsupportedImage unsupported_image = 5;
    CardClosed card_closed = 6;
  }
}

message NotAdmin {}

message CardClosed {}

message EmptyTitle {}

message CardNotFound {}

// Carries no card: the stored one is not shown to the caller.
message CardConflict {}

message ImageTooLarge {
  // The largest accepted size of LotImageUpload.content, in bytes.
  int64 max_bytes = 1;
}

message UnsupportedImage {}

message GetLotRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

message ListAuctionLotsRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

message ListAuctionLotsResponse {
  repeated LotSnapshot lots = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// The trading state of a lot as one viewer sees it, with its catalog card next to
// it. The trading core does not know the card: it comes from the catalog, not
// from the journal of the lot.
message LotSnapshot {
  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // The trading conditions. Set by the first LotScheduled and replaceable until the
  // lot is opened; frozen from that moment on. Unset on a draft, and on a lot
  // withdrawn while it was a draft.
  LotConfig config = 3;

  // Position of the last event in the journal of the lot, starting at 1: a lot
  // that exists has at least its LotDrafted, so 0 is not a valid value. It is not
  // a key of the content: next_price, base_step and the windows are computed at
  // the instant of the answer and can differ between two answers of one version.
  int64 version = 4;

  // The lowest amount a bid is accepted at now; in the live final the only amount.
  // Set only while the lot is trading, so a caller does not repeat the step rule.
  // "Now" is the instant the service answered.
  Money next_price = 5;

  // The viewer's own proxy limit on the lot. Unset when the viewer has none.
  // Limits of other participants are never shown.
  Money viewer_proxy_limit = 6;

  // Title and description of the lot. Unset when the lot has no catalog card.
  LotCard card = 7;

  // Where the lot is. Exactly one is set. The numbers match auction.v1.LotState so
  // that the two stay readable side by side.
  oneof status {
    LotDraft draft = 8;
    LotSchedule scheduled = 9;
    LotTrading trading = 10;
    LotHeld held = 11;
    LotSale sold = 12;
    UnsoldReason unsold = 13;
    WithdrawnReason withdrawn = 14;
  }

  // How many bids the lot has accepted, manual and proxy alike. 0 is a real value:
  // no bid yet.
  int64 bid_count = 15;

  // The regular bid step at the current price, without any window. Set only while
  // the lot is trading.
  Money base_step = 16;

  // The window of reduced step in force at the instant of the answer, with the
  // step in force. Unset when none is: outside every window of the lot, when the
  // window does not lower the step at the current price, in the live final, and
  // when the lot is not trading.
  LotStepWindow active_window = 17;

  // The nearest window of the lot that has not started yet at the instant of the
  // answer, with the amount of the window as announced rather than the step it
  // will put in force. Unset when there is none, in the live final, and when the
  // lot is not trading.
  LotStepWindow next_window = 18;

  // The collectible set the lot belongs to. Unset when the lot is in no set, and
  // when its set has fewer than two lots: such a set is not shown to participants.
  // Number 19 is not used: auction.v1.LotState carries the windows of the lot
  // under it.
  LotSetMembership lot_set = 20;
}

// A collectible set of lots of one auction and its outcome.
message LotSetMembership {
  // Canonical lowercase UUIDv7 with hyphens: the id the organizer gave the set.
  string lot_set_id = 1;

  // The name of the set as the organizer typed it.
  string name = 2;

  // Canonical lowercase UUIDv7 with hyphens each: every lot of the set in the
  // order of the organizer, the lot of this snapshot among them.
  repeated string lot_ids = 3;

  // Canonical lowercase UUIDv7 with hyphens: the participant every lot of the
  // set was sold to. Absent until the last lot of the set ends, and absent for
  // good when a lot of the set was not sold or was sold to someone else.
  optional string collector_id = 4;

  // How the collector is shown in the auction. Set together with collector_id.
  DisplayName collector_name = 5;
}

// A window of reduced bid step of one lot: the half-open interval [from, until).
message LotStepWindow {
  // RFC 3339 instant in UTC: the first instant of the window.
  string from = 1;

  // RFC 3339 instant in UTC: the first instant after the window.
  string until = 2;

  Money step = 3;
}

message ListLotHistoryRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

message ListLotHistoryResponse {
  // Ascending by sequence.
  repeated LotHistoryEntry entries = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// One public fact of the journal of a lot. The order of the history is the order
// of the journal, sequence, and never the order of occurred_at: facts of one
// command share the same instant.
message LotHistoryEntry {
  // Position of the fact in the journal of the lot, as LotSnapshot.version counts
  // it. Monotonic, not contiguous: private facts take positions too.
  int64 sequence = 1;

  // RFC 3339 instant in UTC: the server time the fact was recorded.
  string occurred_at = 2;

  // What happened. Exactly one is set. A reader skips an entry whose kind it does
  // not know: new kinds may be added.
  oneof kind {
    HistoryBid bid = 3;
    HistoryRemoval removal = 4;
  }
}

// An accepted bid as BidPlaced recorded it. A folded chain of proxy bids is one
// entry with the final amount. The proxy limit is never carried.
//
// A bid of a participant later removed from the lot keeps its entry, with removed
// set.
message HistoryBid {
  // Canonical lowercase UUIDv7 with hyphens.
  string bid_id = 1;

  // Canonical lowercase UUIDv7 with hyphens: the bidder, the same id leader_id
  // carries. The display name is read with GetDisplayNames.
  string participant_id = 2;

  Money amount = 3;

  // How the bid was placed. Exactly one is set.
  oneof origin {
    ManualBid manual = 4;
    ProxyBid proxy = 5;
  }

  // True when the bidder was removed from the lot after this bid. False is the
  // value of every bid of a participant who was not removed.
  bool removed = 6;
}

// The removal of a participant from the lot. Who was removed is told by the bids
// marked removed; who removed them and why is deliberately not carried.
message HistoryRemoval {
  // The price the lot went on with. Never higher than the price before.
  Money price = 1;

  // Canonical lowercase UUIDv7 with hyphens: the leader the lot went on with.
  // Absent when nobody was left to lead - absent, not an empty string.
  optional string leader_id = 2;
}

message ChooseDisplayNameRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Exactly one is set.
  oneof choice {
    // The Telegram username of the viewer as the update carried it, without "@".
    // An empty string is a set choice that says the viewer has no username.
    string telegram_username = 3;

    // A pseudonym as the viewer typed it.
    string alias = 4;
  }
}

message ChooseDisplayNameResponse {
  // Exactly one is set.
  oneof outcome {
    DisplayName accepted = 1;
    ChooseDisplayNameRefusal refused = 2;
  }
}

message ChooseDisplayNameRefusal {
  // Exactly one is set.
  oneof reason {
    UsernameMissing username_missing = 1;
    AliasInvalid alias_invalid = 2;
    AliasTaken alias_taken = 3;
    NameFrozen name_frozen = 4;
  }
}

message UsernameMissing {}

message AliasInvalid {}

// Carries no owner: who holds the pseudonym is not shown to the caller.
message AliasTaken {}

message NameFrozen {}

// How a participant is shown in one auction.
message DisplayName {
  // Ready to show as is: marks are already applied, the caller adds none.
  string text = 1;

  DisplayNameKind kind = 2;

  // True when the choice of the participant no longer changes in this auction.
  // False for a placeholder.
  bool frozen = 3;
}

enum DisplayNameKind {
  DISPLAY_NAME_KIND_UNSPECIFIED = 0;
  DISPLAY_NAME_KIND_TELEGRAM_USERNAME = 1;
  DISPLAY_NAME_KIND_ALIAS = 2;
  // Nothing is chosen, or the choice was erased with the participant.
  DISPLAY_NAME_KIND_PLACEHOLDER = 3;
}

message GetDisplayNamesRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: identity ids of participants, the
  // same ids leader_id and winner_id carry.
  repeated string participant_ids = 3;
}

message GetDisplayNamesResponse {
  // Keyed by participant id. Every requested id is present.
  map<string, DisplayName> names = 1;
}

