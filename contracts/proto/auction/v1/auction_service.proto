  // The amount a new ask must exceed, at the moment the ask was decided.
  Money must_exceed = 1;
}

message CloseLotRequest {
  // The auctioneer: the administrator of the meetup of the auction, checked with
  // the meetup. The closing reason is deliberately absent: a caller closes a lot
  // only by the decision of the auctioneer, and the auction closes lots at their
  // deadline by itself.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens: a lot in the registry of the auction.
  string lot_id = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message CloseLotResponse {
  // Exactly one is set.
  oneof outcome {
    LotClosure accepted = 1;
    CloseLotRefusal refused = 2;
  }
}

// How the lot ended. Exactly one is set.
message LotClosure {
  oneof result {
    LotSale sold = 1;
    UnsoldReason unsold = 2;
  }
}

message CloseLotRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    LotNotInAuction lot_not_in_auction = 3;
    LotNotOpen lot_not_open = 4;
    DeadlineNotReached deadline_not_reached = 5;
    MeetupCancelled meetup_cancelled = 6;
  }
}

// The lot trades online until its deadline and is not closed before it.
message DeadlineNotReached {}

message WatchAuctionRequest {
  // Who watches. The stream is the same for every viewer: nothing in it depends
  // on who asks.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

// The state of an auction and of its final after a change. Every message is the
// whole state, not a difference: the first one is the state at the moment of
// subscribing, and each next one follows a change. A client that reconnects
// loses no state, only the intermediate steps between two messages; the bids in
// between are read with ListLotHistory.
message AuctionWatch {
  AuctionSnapshot auction = 1;

  // The active lot of the live final. Unset when no lot is active - before the
  // final, between lots and after it.
  LotSnapshot active_lot = 2;

  // The lots of the frozen lineup in its order, the active one included. Empty
  // until the lineup is frozen. In this stream LotSnapshot.viewer_proxy_limit is
  // never set: the proxy limit of a viewer is read with GetLot.
  repeated LotSnapshot lineup = 3;
}

message GetAuctionConsoleRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message GetAuctionConsoleResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionConsole console = 1;
    GetAuctionConsoleRefusal refused = 2;
  }
}

message GetAuctionConsoleRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

// The auction as its meetup administrator runs it. The console is the only read
// that names a lot marked for the final before the lineup is frozen.
message AuctionConsole {
  AuctionSnapshot auction = 1;

  // Every lot of the registry, in no particular order. The registry is not paged:
  // the administrator enters its lots one by one.
  repeated ConsoleLot lots = 2;

  // The windows of reduced bid step launched during the online phase, in the
  // order they were launched. The windows of the configuration are in
  // auction.config.step_windows. Empty is a real value: no window was launched.
  repeated AuctionStepWindow launched_step_windows = 3;

  // Every collectible set of the auction, in the order of lot_set_id. Incomplete
  // sets of fewer than two lots and empty sets are here too, unlike in
  // LotSnapshot.lot_set. The sets are read with the auction and may name a lot
  // that lots does not list yet. Empty is a real value: the auction has no set.
  repeated ConsoleLotSet lot_sets = 4;

  // How many participants are registered for the raffle right now: cancelled
  // registrations are not counted. Set only while the raffle holds
  // registrations, before its pool is fixed; absent when the auction has no
  // raffle, when the pool is fixed and when the raffle could not be read. The
  // tickets of a fixed pool are read with GetRaffle.
  optional uint32 raffle_registrations = 5;

  // How the predictions game of the auction is played, in aggregates only: no
  // participant and no answer is named. Absent when the auction has no game
  // yet and when the game could not be read.
  ConsolePredictions predictions = 6;

  // Canonical lowercase UUIDv7 with hyphens: the meetup of the auction, the one
  // whose administrator was checked for this read. Never empty. Only the console
  // names it: AuctionSnapshot and the reads of a participant do not lead from an
  // auction to its meetup.
  string meetup_id = 7;
}

// The predictions of every round of the auction counted together.
message ConsolePredictions {
  // Participants with at least one answer in any round; a cleared prediction
  // has no answer and is not counted.
  uint32 participants = 1;

  // Answered nominations of every participant in every round.
  uint32 answers = 2;
}

// A collectible set of lots as the administrator of the auction defined it. The
// outcome is deliberately absent: it is in LotSnapshot.lot_set of its lots.
message ConsoleLotSet {
  // Canonical lowercase UUIDv7 with hyphens: the id the organizer gave the set.
  string lot_set_id = 1;

  // The name of the set as the organizer typed it. Never empty.
  string name = 2;

  // Canonical lowercase UUIDv7 with hyphens each: the lots of the set in the
  // order of the organizer. Empty is a real value: a set not yet filled.
  repeated string lot_ids = 3;
}

message ConsoleLot {
  // The lot as the administrator sees it as a viewer.
  LotSnapshot lot = 1;

  // The lot is marked for the final: trading online with the mark, or already
  // held for the final. false is a real value.
  bool marked_for_final = 2;

  // The lot is trading past its deadline by more than the grace of the service:
  // it should have closed and has not. false is a real value.
  bool overdue = 3;
}

message GetAuctionLotStatisticsRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message GetAuctionLotStatisticsResponse {
  // Exactly one is set. The refusal is shared with the administrator's console.
  oneof outcome {
    AuctionLotStatistics statistics = 1;
    GetAuctionConsoleRefusal refused = 2;
  }
}

message AuctionLotStatistics {
  // Every lot of the registry, without pagination or a meaningful order.
  // The caller ranks the complete list.
  repeated LotStatistics lots = 1;
}

// Aggregates only: no participant ids, display names or proxy limit amounts.
message LotStatistics {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;

  // Accepted BidPlaced facts, manual and proxy alike, as LotSnapshot.bid_count.
  // A folded proxy chain counts once; 0 means no accepted bid yet.
  int64 bid_count = 2;

  // Distinct people across BidPlaced and accepted ProxyLimitSet facts of the lot.
  // A person counts once even if their limit never produced a bid in their name
  // or was later withdrawn. Refused commands do not count; 0 is a real value.
  int64 unique_participant_count = 3;

  // Absolute difference between current and starting price, in the lot's currency,
  // not a percentage. Unset when no starting price exists; set to zero before the
  // first bid. A zero starting price does not make the difference undefined.
  Money price_growth = 4;

  // RFC 3339 instant in UTC of the last BidPlaced in journal sequence order,
  // whether manual or proxy. Unset when no bid exists, not an empty string.
  optional string last_bid_at = 5;

  // Leader changes over the life of the lot. 0 is a real value.
  int64 leader_change_count = 6;

  // Leader changes in the longest run where the lead passed back and forth
  // between the same two people, over the life of the lot: A to B to A is 2.
  // Who the two are is not returned. 0 means no leader change yet.
  int64 longest_duel = 7;
}

message GetAuctionDaySummaryRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // RFC 3339 instant in UTC: the first instant of the window.
  string from = 3;

  // RFC 3339 instant in UTC: the first instant after the window, strictly after
  // from. The window is half-open: a bid at from is inside it, a bid at until is not.
  string until = 4;
}

message GetAuctionDaySummaryResponse {
  // Exactly one is set. The refusal is shared with the administrator's console.
  oneof outcome {
    AuctionDaySummary summary = 1;
    GetAuctionConsoleRefusal refused = 2;
  }
}

// The trading of one window, as the meetup administrator reads it for the daily
// digest. Aggregates of that window only; the lifetime counters of a lot are read
// with GetAuctionLotStatistics.
message AuctionDaySummary {
  // Every lot of the registry, without pagination or a meaningful order.
  // The caller ranks the complete list.
  repeated DayLotStatistics lots = 1;
}

// Aggregates of one window only: no participant ids, display names or proxy limit amounts.
message DayLotStatistics {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;

  // Accepted BidPlaced facts inside the window, manual and proxy alike.
  // A folded proxy chain counts once; 0 means the lot took no accepted bid in the
  // window. Refused commands do not count; 0 is a real value.
  int64 bid_count = 2;

  // Highest price the lot reached in the window, in the lot's currency. Unset when
  // the lot took no accepted bid in the window, not an empty message.
  Money max_price = 3;

  // max_price minus the price the lot had when the window opened: the price of its
  // last accepted bid before the window, or its starting price when there was none.
  // Absolute difference, in the lot's currency, not a percentage. Unset when the lot
  // took no accepted bid in the window or had no price before the window; a zero
  // difference is a real value.
  Money growth = 4;

  // LotStatistics.leader_change_count inside the window only. 0 is a real value.
  int64 leader_change_count = 5;

  // LotStatistics.longest_duel inside the window only. 0 means no leader change
  // in the window.
  int64 longest_duel = 6;
}

message GetMeetupAuctionRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string meetup_id = 2;
}

message GetMeetupAuctionResponse {
  // Unset when the meetup has no auction: absent, not an error. A draft is
  // returned here, unlike in ListAuctions. A hidden auction is unset for a
  // viewer it is hidden from: see AuctionSnapshot.hidden.
  AuctionSnapshot auction = 1;
}

message GetAuctionRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetAuctionResponse {
  // Unset when there is no such auction for this caller: absent, not an error.
  // Whether a draft is returned depends on the caller, see
  // docs/architecture/integration.md, section "Auction gRPC". A hidden auction
  // is unset for a viewer it is hidden from: see AuctionSnapshot.hidden.
  AuctionSnapshot auction = 1;
}

message ListAuctionsRequest {
  Viewer viewer = 1;

  // Which auctions to list. UNSPECIFIED is not a value.
  AuctionListing listing = 2;

  // Opaque token returned as next_page_token. Empty starts an enumeration.
  string page_token = 3;

  // 0 selects the server default.
  int32 page_size = 4;
}

// A selection of auctions by status. A draft is in none of them.
enum AuctionListing {
  AUCTION_LISTING_UNSPECIFIED = 0;

  // Scheduled and not finished: from scheduled to in_final.
  AUCTION_LISTING_ACTIVE = 1;

  // Past: finished or cancelled. The status of each auction tells which.
  AUCTION_LISTING_FINISHED = 2;
}

message ListAuctionsResponse {
  repeated AuctionSnapshot auctions = 1;

  // Opaque continuation token. Empty means that the enumeration is complete.
  string next_page_token = 2;
}

// The state of an auction as a read returns it. Field numbers and status types
// match auction.v1.AuctionState so that the two stay readable side by side.
message AuctionSnapshot {
  // The meetup is not here: a list must not lead from an auction to its meetup,
  // and a read by meetup already names it.
  reserved 4;
  reserved "meetup_id";

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string id = 1;

  // Unset on a draft. Replaceable until prebidding starts, frozen after.
  AuctionConfig config = 2;

  // Canonical lowercase UUIDv7 with hyphens: the registry of the auction. The
  // order carries no meaning.
  repeated string lot_ids = 3;

  // Set when the auction is hidden from participants. Such a snapshot reaches
  // only a viewer the auction is not hidden from; for anyone else the auction is
  // absent, see docs/architecture/integration.md, section "Auction gRPC". Never
  // set once prebidding has started.
  bool hidden = 5;

  // RFC 3339 instant in UTC: when the final is estimated to start. It is an
  // announcement of the broadcast, not a trading condition: it opens and closes
  // nothing (ADR-040, addition 2026-10-19). Unset when the administrator has
  // not set it.
  optional string final_at = 6;

  // How the feed shows the lots of the registry, as the administrator arranged
  // them with SetLotLayout (PER-719). It is a display, not a trading condition:
  // it opens and closes nothing, and the live final shows the order of its
  // lineup instead. Unset when the administrator has not arranged the lots:
  // the feed then shows them in the order of creation, which is the order of
  // their UUIDv7 ids. Every lot it names is in lot_ids; a lot of lot_ids it
  // does not name follows the arranged ones in the order of creation.
  LotLayout lot_layout = 7;

  // The windows of reduced bid step launched during the online phase, in the
  // order they were launched; the windows of the configuration are in
  // config.step_windows. Together they are the programme of the week a
  // participant reads (PER-724). Empty is a real value: no window was launched.
  repeated AuctionStepWindow launched_step_windows = 8;

  // The promo video of the auction, as the administrator set it with
  // SetPromoVideo (PER-781). Unset when there is none.
  AuctionPromoVideo promo_video = 9;

  // Where the auction is. Exactly one is set.
  oneof status {
    AuctionState.Draft draft = 10;
    AuctionState.Scheduled scheduled = 11;
    AuctionState.Prebidding prebidding = 12;
    AuctionState.Settling settling = 13;
    AuctionState.Break on_break = 14;
    AuctionState.LineupFrozen lineup_frozen = 15;
    AuctionState.Final in_final = 16;
    AuctionState.Finished finished = 17;
    AuctionState.Cancelled cancelled = 18;
  }
}

message RegisterForRaffleRequest {
  // The participant who registers: there is no separate participant field. The
  // viewer must hold place_bids.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: the auction whose raffle it is.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message RegisterForRaffleResponse {
  // Exactly one is set. A repeated registration is accepted and returns the same
  // registration: a participant never holds a second ticket.
  oneof outcome {
    Raffle accepted = 1;
    RaffleRegistrationRefusal refused = 2;
  }
}

message RaffleRegistrationRefusal {
  // Exactly one is set.
  oneof reason {
    RaffleNotFound raffle_not_found = 1;
    RaffleRegistrationClosed registration_closed = 2;
    DisplayNameNotChosen display_name_not_chosen = 3;
  }
}

message CancelRaffleRegistrationRequest {
  // The participant whose registration is cancelled. The viewer must hold
  // place_bids.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message CancelRaffleRegistrationResponse {
  // Exactly one is set. Cancelling without a registration is accepted.
  oneof outcome {
    Raffle accepted = 1;
    RaffleCancellationRefusal refused = 2;
  }
}

message RaffleCancellationRefusal {
  // Exactly one is set.
  oneof reason {
    RaffleNotFound raffle_not_found = 1;
    RaffleRegistrationClosed registration_closed = 2;
  }
}

message RaffleNotFound {}

message RaffleRegistrationClosed {}

message GetRaffleRequest {
  // The viewer must hold place_bids. registered and my_ticket are about them.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetRaffleResponse {
  // Unset when the auction has no raffle: absent, not an error.
  Raffle raffle = 1;
}

// The raffle among the participants of an auction as the viewer sees it.
// Hashes are SHA-256 of a UTF-8 string written as lowercase hex.
message Raffle {
  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 1;

  // Where the raffle is. UNSPECIFIED is not a value.
  RaffleStatus status = 2;

  // RFC 3339 instant in UTC: when registration closes.
  string closes_at = 3;

  // The hash of the seed, published when registration opened. Empty only when
  // the raffle is not held.
  string commitment = 4;

  // The round of the drand quicknet chain whose randomness enters the draw. 0
  // only when the raffle is not held.
  uint64 beacon_round = 5;

  // Whether the viewer holds a registration. Once the pool is fixed it is true
  // exactly when the viewer holds a ticket: a registration excluded at closing
  // is not kept.
  bool registered = 6;

  // The tickets 1..N of the fixed pool in registration order. Empty until the
  // pool is fixed, and empty when it is fixed with no ticket.
  repeated RaffleTicket tickets = 7;

  // The number of the viewer's ticket. Unset until the pool is fixed and when
  // the viewer has no ticket in it.
  optional uint32 my_ticket = 8;

  // Unset until the draw is revealed: set with DRAWN and NO_TICKETS.
  RaffleReveal reveal = 9;

  // RFC 3339 instant in UTC: when the draw was made. Unset with every status
  // but DRAWN: NO_TICKETS reveals the seed without a draw.
  optional string drawn_at = 10;

  // The prize of the raffle as the organizer wrote it. Unset when the raffle has
  // no prize and when the raffle is not held: there are no terms to read it from.
  optional string raffle_prize = 11;

  // Whether the winner is assigned by an administrator instead of drawn from
  // the beacon. The service decides it when registration closes, by its own
  // setting, and the decision never changes; with OPEN and CLOSING it tells
  // the setting at the moment of the read. With it the pool waits with
  // AWAITING_WINNER, and the reveal of DRAWN carries the seed and
  // winning_ticket but no randomness and no value: there is nothing to
  // recompute.
  bool drawn_by_hand = 12;

  // The photo of the prize, without its bytes: they are read with
  // GetRafflePrizePhoto. Unset when the prize has no photo and when the raffle
  // is not held.
  RafflePrizePhoto prize_photo = 13;
}

// Names the photo of a raffle prize without carrying it.
message RafflePrizePhoto {
  // Canonical lowercase UUIDv7 with hyphens: the photo_id of
  // SetRafflePrizePhoto.
  string photo_id = 1;

  // Opaque, compared only for equality, as LotImageRef.version: equal bytes give
  // an equal version.
  string version = 2;
}

enum RaffleStatus {
  RAFFLE_STATUS_UNSPECIFIED = 0;

  // Registration is open.
  RAFFLE_STATUS_OPEN = 1;

  // closes_at has passed and the pool is being fixed; registration is closed.
  RAFFLE_STATUS_CLOSING = 2;

  // The pool is fixed and the draw waits for the randomness of beacon_round.
  RAFFLE_STATUS_AWAITING_BEACON = 3;

  // The winning ticket is drawn.
  RAFFLE_STATUS_DRAWN = 4;

  // The pool was fixed with no ticket: the raffle did not take place, and the
  // seed is revealed without a draw.
  RAFFLE_STATUS_NO_TICKETS = 5;

  // Prebidding started no earlier than closes_at: registration never opened.
  RAFFLE_STATUS_NOT_HELD = 6;

  // The auction was cancelled before the draw: registration is closed, no draw
  // will take place, and the seed is not revealed.
  RAFFLE_STATUS_CANCELLED = 7;

  // The pool is fixed and waits for an administrator to assign the winning
  // ticket: drawn_by_hand is set.
  RAFFLE_STATUS_AWAITING_WINNER = 8;
}

message RaffleTicket {
  // 1..N without gaps.
  uint32 number = 1;

  // The display name of the holder as the bid history shows it, marks applied,
  // as it was when the pool was fixed. Unset once names are erased after the
  // retention period: the number stays.
  optional string display_name = 2;
}

// What a participant needs to recompute the draw without access to the service.
message RaffleReveal {
  // The seed: 64 lowercase hex characters. Its hash is commitment.
  string seed = 1;

  // The randomness of beacon_round as drand publishes it, lowercase hex. Empty
  // with NO_TICKETS.
  string randomness = 2;

  // The hash of "<seed>:<N>:<randomness>", N in decimal without leading zeros.
  // Empty with NO_TICKETS.
  string value = 3;

  // value read as an unsigned big-endian number, modulo N, plus one; with
  // drawn_by_hand the ticket the administrator assigned. Unset with NO_TICKETS.
  optional uint32 winning_ticket = 4;
}

message AssignRaffleWinnerRequest {
  // The holder of run_auctions for the meetup of the auction, checked with the
  // meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;

  // The number of the winning ticket in the fixed pool, from 1 to the count of
  // tickets.
  uint32 ticket = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message AssignRaffleWinnerResponse {
  // Exactly one is set. A repeat of the same op_id returns the raffle as it is.
  // Assigning the ticket that is already the winner is accepted with no second
  // fact; another ticket is refused with already_drawn: the result never
  // changes.
  oneof outcome {
    Raffle accepted = 1;
    AssignRaffleWinnerRefusal refused = 2;
  }
}

message AssignRaffleWinnerRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    MeetupCancelled meetup_cancelled = 3;
    RaffleNotFound raffle_not_found = 4;
    // The pool does not wait for a winner by hand: registration is still open
    // or closing, the raffle draws from the beacon, has no ticket, is not held
    // or is cancelled.
    RaffleNotAwaitingWinner not_awaiting_winner = 5;
    // The ticket is not in 1..N of the fixed pool.
    RaffleTicketNotInPool ticket_not_in_pool = 6;
    // The winner is already assigned or drawn, and it is another ticket.
    RaffleAlreadyDrawn already_drawn = 7;
  }
}

message RaffleNotAwaitingWinner {}

message RaffleTicketNotInPool {
  // The count of tickets in the fixed pool.
  uint32 tickets = 1;
}

message RaffleAlreadyDrawn {
  // The number of the winning ticket.
  uint32 winning_ticket = 1;
}

message ChangeRafflePrizeRequest {
  // The holder of run_auctions for the meetup of the auction, checked with the
  // meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;

  // The new prize as the organizer writes it: one line, trimmed by the
  // service, not blank and at most 200 characters, as raffle_prize of the
  // configuration. It replaces the prize the raffle copied when it opened; the
  // configuration of the auction stays as it is.
  string prize = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message ChangeRafflePrizeResponse {
  // Exactly one is set. The prize changes while the raffle has no result:
  // registration is open or closing, or the pool waits for the beacon or for
  // the winner by hand. A repeat of the same op_id returns the raffle as it is;
  // the prize the raffle already has is accepted with no change. raffle_drawn
  // carries the prize the raffle has at the draw. Participants are not told of
  // the change.
  oneof outcome {
    Raffle accepted = 1;
    ChangeRafflePrizeRefusal refused = 2;
  }
}

message ChangeRafflePrizeRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    MeetupCancelled meetup_cancelled = 3;
    RaffleNotFound raffle_not_found = 4;
    RafflePrizeBlank prize_blank = 5;
    RafflePrizeTooLong prize_too_long = 6;
    // The winner is already assigned or drawn: the winner has the prize.
    RaffleAlreadyDrawn already_drawn = 7;
    // The raffle will have no result: it is not held, its pool has no ticket
    // or it is cancelled.
    RaffleWithoutResult without_result = 8;
  }
}

message RaffleWithoutResult {}

// Sets the photo of the raffle prize.
message SetRafflePrizePhotoRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens: the key of a
  // replay.
  string photo_id = 3;

  LotImageUpload photo = 4;
}

message SetRafflePrizePhotoResponse {
  // Exactly one is set. accepted is the raffle after the command.
  oneof outcome {
    Raffle accepted = 1;
    RafflePrizePhotoRefusal refused = 2;
  }
}

// Takes the photo of the raffle prize back.
message RemoveRafflePrizePhotoRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message RemoveRafflePrizePhotoResponse {
  // Exactly one is set. accepted is the raffle after the command.
  oneof outcome {
    Raffle accepted = 1;
    RafflePrizePhotoRefusal refused = 2;
  }
}

message RafflePrizePhotoRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    MeetupCancelled meetup_cancelled = 3;
    RaffleNotFound raffle_not_found = 4;
    RaffleAlreadyDrawn already_drawn = 5;
    RaffleWithoutResult without_result = 6;
    ImageTooLarge image_too_large = 7;
    UnsupportedImage unsupported_image = 8;
    PhotoConflict photo_conflict = 9;
  }
}

message GetRafflePrizePhotoRequest {
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message SubmitPredictionRequest {
  // The participant who predicts: there is no separate participant field. The
  // viewer must hold place_bids.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: the auction of a meetup.
  string auction_id = 2;

  // UNSPECIFIED is not a value.
  PredictionRound round = 3;

  // The whole prediction of the round: it replaces the previous one. Each
  // nomination at most once and only nominations of the round. An empty list
  // clears the prediction.
  repeated PredictionAnswer answers = 4;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 5;
}

message SubmitPredictionResponse {
  // Exactly one is set. A repeat of the same op_id is accepted and returns the
  // prediction that op_id sent, even if a later one replaced it.
  oneof outcome {
    Prediction accepted = 1;
    PredictionRefusal refused = 2;
  }
}

message PredictionRefusal {
  // Exactly one is set.
  oneof reason {
    PredictionRoundNotOpen round_not_open = 1;
    PredictionRoundClosed round_closed = 2;
    PredictionsCancelled predictions_cancelled = 3;
    DisplayNameNotChosen display_name_not_chosen = 4;
    PredictionLotNotInRound lot_not_in_round = 5;
  }
}

message PredictionRoundNotOpen {}

message PredictionRoundClosed {}

message PredictionsCancelled {}

// The first answer, in request order, whose lot is not a lot of the round.
message PredictionLotNotInRound {
  PredictionNomination nomination = 1;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 2;
}

message GetMyPredictionsRequest {
  // The viewer must hold place_bids. The response is about them only: there is
  // no way to read the prediction of another participant.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetMyPredictionsResponse {
  // Both rounds, catalog first. Carries no other participant and no count of
  // predictions.
  repeated PredictionRoundView rounds = 1;
}

message PredictionRoundView {
  PredictionRound round = 1;

  // UNSPECIFIED is not a value.
  PredictionRoundStatus status = 2;

  // The viewer's prediction of the round. Empty when there is none.
  repeated PredictionAnswer answers = 3;
}

// The viewer's own prediction of one round.
message Prediction {
  PredictionRound round = 1;

  // In nomination order. Empty when the prediction is cleared.
  repeated PredictionAnswer answers = 2;
}

message PredictionAnswer {
  // UNSPECIFIED is not a value.
  PredictionNomination nomination = 1;

  // Exactly one is set, the one the nomination asks for.
  oneof answer {
    // Canonical lowercase UUIDv7 with hyphens.
    string lot_id = 2;

    // Not negative. A sum is in minor units of the auction currency; a count is
    // a number of bids.
    int64 number = 3;
  }
}

enum PredictionRound {
  PREDICTION_ROUND_UNSPECIFIED = 0;

  PREDICTION_ROUND_CATALOG = 1;

  PREDICTION_ROUND_FINAL = 2;
}

enum PredictionRoundStatus {
  PREDICTION_ROUND_STATUS_UNSPECIFIED = 0;

  // The round has not opened yet.
  PREDICTION_ROUND_STATUS_NOT_OPEN = 1;

  PREDICTION_ROUND_STATUS_OPEN = 2;

  // The round is closed and the prediction is fixed.
  PREDICTION_ROUND_STATUS_CLOSED = 3;

  // The auction was cancelled: the game has no results.
  PREDICTION_ROUND_STATUS_CANCELLED = 4;
}

message PredictionResultsByHand {}

message GetPredictionResultsRequest {
  // The viewer must hold place_bids. The response carries the winners by name
  // and the viewer's own result; nobody else's prediction is readable here.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message GetPredictionResultsResponse {
  // Exactly one is set.
  oneof outcome {
    // The results are counted and fixed.
    PredictionResultsRead counted = 1;

    // The auction is over, but the results are not counted yet: the screen says
    // "итоги после финала", not an empty list.
    PredictionResultsAfterFinal after_final = 2;

    // The results were recorded by hand: they carry no counted values.
    PredictionResultsByHand by_hand = 3;

    // The auction was cancelled: the game has no results.
    PredictionsCancelled cancelled = 4;
  }
}

// The counted results: the winners of each nomination and the viewer's own
// result. Field numbers and types match auction.v1.PredictionResultsState so
// that the read and the fact stay readable side by side.
message PredictionResultsRead {
  // Every nomination that was played, in nomination order.
  repeated NominationOutcome nominations = 1;

  // The viewer's own result by nomination; a nomination they did not answer is
  // absent.
  repeated OwnNominationResult mine = 2;
}

message OwnNominationResult {
  // UNSPECIFIED is not a value.
  PredictionNomination nomination = 1;

  // Exactly one is set.
  oneof result {
    Guessed guessed = 2;
    Missed missed = 3;
  }
}

// The auction reached Finished and the results are not counted yet.
message PredictionResultsAfterFinal {}

message SettlePredictionResultsManuallyRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

message SettlePredictionResultsManuallyResponse {
  // Exactly one is set. Recording the marker on an auction whose results are
  // already settled, by hand or by count, is accepted, not refused, and writes
  // no second fact.
  oneof outcome {
    PredictionResultsByHand accepted = 1;
    SettlePredictionResultsManuallyRefusal refused = 2;
  }
}

message SettlePredictionResultsManuallyRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    MeetupCancelled meetup_cancelled = 3;
  }
}

message MarkInvoicePaidRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoicePaidResponse {
  // Exactly one is set. An invoice that is already paid or handed over is
  // accepted, not refused, and no second transition is recorded.
  oneof outcome {
    InvoicePaymentAccepted accepted = 1;
    MarkInvoicePaidRefusal refused = 2;
  }
}

message InvoicePaymentAccepted {}

message MarkInvoicePaidRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

message MarkInvoiceHandedOverRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;
}

message MarkInvoiceHandedOverResponse {
  // Exactly one is set. An invoice that is already handed over is accepted, not
  // refused, and no second transition is recorded.
  oneof outcome {
    InvoiceHandoverAccepted accepted = 1;
    MarkInvoiceHandedOverRefusal refused = 2;
  }
}

message InvoiceHandoverAccepted {}

message MarkInvoiceHandedOverRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    InvoiceNotPaid invoice_not_paid = 3;
  }
}

// The invoice still awaits payment: a lot is handed over only after it is paid.
message InvoiceNotPaid {}

message ChooseFulfillmentRequest {
  // The winner the invoice is addressed to. An invoice of someone else is not
  // found for the viewer.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string invoice_id = 2;

  // UNSPECIFIED is not a value: a choice cannot be taken back to none.
  FulfillmentMethod method = 3;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 4;
}

message ChooseFulfillmentResponse {
  // Exactly one is set. The method replaces the previous choice, if any.
  oneof outcome {
    FulfillmentAccepted accepted = 1;
    ChooseFulfillmentRefusal refused = 2;
  }
}

message FulfillmentAccepted {}

message ChooseFulfillmentRefusal {
  // Exactly one is set.
  oneof reason {
    FulfillmentFrozen fulfillment_frozen = 1;
  }
}

// The lot is already handed over: the method no longer changes.
message FulfillmentFrozen {}

message ListMyInvoicesRequest {
  // The winner. Only the invoices addressed to the viewer are returned.
  Viewer viewer = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;
}

message ListMyInvoicesResponse {
  // Every invoice of the viewer in the auction, in no meaningful order. There are
  // no pages: the list is bounded by the sales of one auction - one invoice per
  // sale, and a lot is sold to at most one bid at a time - and a total is summed
  // from the whole of it. Empty when the viewer won nothing.
  repeated InvoiceSnapshot invoices = 1;

  // How to pay and how to receive the lots, as the administrator wrote it for
  // the whole auction: free text, read at the moment of the call, so an edit
  // reaches invoices raised before it. Unset when the administrator has not
  // written it. The text is not payee details in a structure: see
  // SetPaymentInstructionsRequest.
  optional string payment_instructions = 2;
}

message ListAuctionInvoicesRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;
}

message ListAuctionInvoicesResponse {
  // Exactly one is set.
  oneof outcome {
    AuctionInvoices invoices = 1;
    ListAuctionInvoicesRefusal refused = 2;
  }
}

message AuctionInvoices {
  // Every invoice of the auction, in no meaningful order. There are no pages, for
  // the reason ListMyInvoicesResponse gives. Empty when no lot is sold.
  repeated InvoiceSnapshot invoices = 1;

  // The text winners read: see ListMyInvoicesResponse.payment_instructions.
  optional string payment_instructions = 2;
}

message ListAuctionInvoicesRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

// The state of an invoice as a read returns it. Field numbers and status types
// match auction.v1.InvoiceState so that the two stay readable side by side.
message InvoiceSnapshot {
  // Canonical lowercase UUIDv5 with hyphens: see InvoiceState.id.
  string id = 1;

  // Canonical lowercase UUID with hyphens, version 5 or 7: see LotState.auction_id.
  string auction_id = 2;

  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 3;

  // Canonical lowercase UUIDv7 with hyphens: the winner the invoice is addressed
  // to.
  string winner_id = 4;

  // The amount to pay: the price of the sale.
  Money amount = 5;

  // RFC 3339 instant in UTC: the payment is due by this moment. An invoice is
  // overdue when it still awaits payment after it.
  string payment_due_at = 6;

  // How the winner receives the lot. UNSPECIFIED is a real value: the winner has
  // not chosen yet. Not on the bus: see InvoiceState.
  FulfillmentMethod fulfillment = 7;

  // Where the invoice is. Exactly one is set.
  oneof status {
    InvoiceState.AwaitingPayment awaiting_payment = 10;
    InvoiceState.Paid paid = 11;
    InvoiceState.HandedOver handed_over = 12;
  }
}

// How to pay and how to receive the lots of an auction: free text the
// administrator writes for every winner of the auction. Money does not pass
// through the platform, and the text is not payee details in a structure: the
// platform neither reads nor checks it.
message SetPaymentInstructionsRequest {
  // The administrator of the meetup of the auction, checked with the meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;

  // The text as the winners read it, line breaks kept. Unset takes the text
  // back. Set but blank, or longer than 1000 characters, is INVALID_ARGUMENT.
  // The text may be set and changed in every state of the auction, after its
  // end and after its cancellation too: invoices outlive both.
  optional string text = 4;
}

message SetPaymentInstructionsResponse {
  // Exactly one is set.
  oneof outcome {
    PaymentInstructionsAccepted accepted = 1;
    PaymentInstructionsRefusal refused = 2;
  }
}

// Carries nothing: ListMyInvoicesResponse.payment_instructions tells the text.
message PaymentInstructionsAccepted {}

message PaymentInstructionsRefusal {
  // Exactly one is set. There is no MeetupCancelled: the sold lots of a
  // cancelled meetup still await payment.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
  }
}

message GetAuctionDayChronicleRequest {
  // The viewer must hold place_bids; without it the call is PERMISSION_DENIED.
  // An auction hidden from the viewer is NOT_FOUND, as in GetAuction.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

// The trading of the last day as a participant reads it: the same window
// aggregates as GetAuctionDaySummary, with the lifetime counters a participant
// needs to tell an underdog lot, and nothing the console alone shows - no
// participant counts, no participant ids, display names or proxy limits.
message GetAuctionDayChronicleResponse {
  // RFC 3339 instant in UTC: the first instant of the window, 24 hours before
  // until. The service picks the window, not the caller.
  string from = 1;

  // RFC 3339 instant in UTC: the instant the service answered, the first
  // instant after the half-open window [from, until).
  string until = 2;

  // Every lot of the registry, without pagination or a meaningful order. The
  // caller ranks the complete list.
  repeated DayChronicleLot lots = 3;
}

message DayChronicleLot {
  // The aggregates of the window, as in GetAuctionDaySummary.
  DayLotStatistics day = 1;

  // Accepted bids over the life of the lot, as LotSnapshot.bid_count. Read after
  // the window, so a bid between the two reads counts here only.
  int64 bid_count = 2;

  // Current price minus starting price over the life of the lot, as
  // LotStatistics.price_growth, with the same unset cases.
  Money price_growth = 3;
}

message GetAuctionChronicleRequest {
  // The viewer must hold place_bids; without it the call is PERMISSION_DENIED.
  // An auction hidden from the viewer is NOT_FOUND, as in GetAuction.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 2;
}

// The trading of the whole auction as a participant reads it: the inputs of
// GetAuctionDayChronicle without the window of a day. Every accepted bid from
// the opening of the trading to the instant the service answered counts, so the
// counters equal the sum of the day chronicles over the same days. Aggregates
// only: no participant ids, display names, Telegram usernames or proxy limits.
message GetAuctionChronicleResponse {
  // RFC 3339 instant in UTC: the instant the service answered. A bid at or after
  // it is not counted.
  string until = 1;

  // Accepted bids of every lot of the registry, manual and proxy alike, as the
  // sum of DayLotStatistics.bid_count over lots. Bids of a removed participant do
  // not count. 0 is a real value.
  int64 bid_count = 2;

  // Distinct people who placed a bid or set a proxy limit on any lot of the
  // auction, the participants of GetAuctionLotStatistics counted once per
  // auction. A removed participant does not count. 0 is a real value.
  int64 participant_count = 3;

  // Lots of the registry with at least one accepted bid. 0 is a real value.
  int64 traded_lot_count = 4;

  // The lot with the greatest positive DayLotStatistics.growth. Unset when no
  // lot grew. A tie goes to the least lot_id.
  AuctionGrowthRecord growth_record = 5;

  // Every lot of the registry, without pagination or a meaningful order. The
  // aggregates of DayLotStatistics over the whole trading: growth is the
  // highest price minus the starting price, and the leader changes and duels
  // are those of the life of the lot. The caller ranks the complete list.
  repeated DayLotStatistics lots = 6;
}

message AuctionGrowthRecord {
  // Canonical lowercase UUIDv7 with hyphens.
  string lot_id = 1;

  // DayLotStatistics.growth of that lot, positive.
  Money growth = 2;
}

// The promo video of an auction: a post in the media chat of the bots (PER-775).
// Only the number of the post: the chat is not here.
message AuctionPromoVideo {
  // The message_id of the post in the media chat of the bots, positive.
  int64 message_id = 1;
}

// Sets, replaces or takes back the promo video of an auction.
message SetPromoVideoRequest {
  // The holder of run_auctions for the meetup of the auction, checked with the
  // meetup.
  Viewer viewer = 1;

  // Canonical lowercase UUIDv5 with hyphens: see DraftAuctionAccepted.
  string auction_id = 2;

  // Caller-generated canonical lowercase UUIDv7 with hyphens.
  string op_id = 3;

  // The video to show. Unset takes the video back. Set with a message_id that
  // is not positive is INVALID_ARGUMENT.
  AuctionPromoVideo video = 4;
}

message SetPromoVideoResponse {
  // Exactly one is set.
  oneof outcome {
    PromoVideoAccepted accepted = 1;
    PromoVideoRefusal refused = 2;
  }
}

// Carries nothing: AuctionSnapshot.promo_video tells the video.
message PromoVideoAccepted {}

message PromoVideoRefusal {
  // Exactly one is set.
  oneof reason {
    NotMeetupAdministrator not_meetup_administrator = 1;
    MeetupNotFound meetup_not_found = 2;
    MeetupCancelled meetup_cancelled = 3;
  }
}

// Who of the auction is in its raffle and who has a prediction in the round open
// now, for Notifications to narrow the audience of an auction announcement
// (PER-768, PER-777). It is a read between services: no viewer, no screen and no
// bot reads it, and only Notifications is admitted. Read at the moment of the
// call, from the raffle and the prediction rows themselves: a registration, its
// cancellation, a prediction and its clearing show at once, and an erased
// subject is absent. An auction without a journal is NOT_FOUND.
message ListAuctionEngagementRequest {
  // Canonical lowercase UUIDv5 with hyphens.
  string auction_id = 1;
}

message ListAuctionEngagementResponse {
  // Where registration in the raffle of the auction is. UNSPECIFIED is not a
  // value.
  RaffleRegistration raffle_registration = 1;

  // Canonical lowercase UUIDv7 with hyphens: the identities registered in the
  // raffle, in registration order. Set only with RAFFLE_REGISTRATION_OPEN:
  // once registration closes the audience of the raffle is no longer asked.
  repeated string raffle_registrants = 2;

  // The round of the predictions game that accepts predictions now: the final
  // once it opens, otherwise the catalog. Unset when no round is open.
  optional PredictionRound open_prediction_round = 3;

  // Canonical lowercase UUIDv7 with hyphens: the identities with a non-empty
  // prediction in open_prediction_round, in no particular order. Empty when no
  // round is open; a cleared prediction is not one.
  repeated string forecasters = 4;
}

enum RaffleRegistration {
  RAFFLE_REGISTRATION_UNSPECIFIED = 0;

  // Registration has not opened yet and still may: the auction is a draft, or
  // its raffle opens with prebidding that has not started.
  RAFFLE_REGISTRATION_NOT_OPEN = 1;

  // Registration is open: closes_at of the raffle has not passed.
  RAFFLE_REGISTRATION_OPEN = 2;

  // Registration will not open again: closes_at has passed, the raffle was not
  // held or was cancelled, or the auction has no raffle.
  RAFFLE_REGISTRATION_CLOSED = 3;
}
