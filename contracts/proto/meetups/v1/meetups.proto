syntax = "proto3";

package meetups.v1;

// Domain value types of a meetup, shared by the service contract and by the
// consumers that carry a meetup state without calling the service. They live
// apart from meetups_service.proto so that a consumer of these types alone
// does not drag the service and its request messages into its codegen.

message Schedule {
  // Exactly one form is set. An empty oneof is not a second spelling of "no
  // date": that is the no_date form.
  oneof form {
    NoDate no_date = 1;
    DateValue tentative = 2;
    DateValue fixed = 3;
  }
}

message NoDate {}

message DateValue {
  oneof precision {
    CalendarDate day = 1;
    LocalDateTime day_start = 2;
    LocalInterval interval = 3;
  }
}

message CalendarDate {
  // Local community calendar date, not a UTC instant. No timezone in this message.
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message LocalTime {
  // Minute precision. Hours 0-23, minutes 0-59. Seconds are not represented.
  int32 hours = 1;
  int32 minutes = 2;
}

message LocalDateTime {
  CalendarDate date = 1;
  LocalTime time = 2;
}

message LocalInterval {
  LocalDateTime start = 1;
  LocalDateTime end = 2;
}

// A material attached to a meetup: an element of one ordered collection. The
// server-produced state carries what is stored about it and nothing else. The
// order is the order of the repeated field; there is no position field, and
// there is no authorship field on the wire.
message MeetupMaterial {
  // Canonical lowercase UUIDv7 with hyphens.
  string id = 1;

  // Empty string is the total value "unspecified". Whose poster it is is
  // expressed by the title, not by a separate flag.
  string title = 2;

  MeetupMaterialSource source = 3;
}

// The source is stored as what it is: a Telegram message link or a Bot API
// file_id. An empty oneof is not a value: a material always has a source.
message MeetupMaterialSource {
  oneof source {
    // Telegram message link, carried as the link itself.
    string message_link = 1;

    // Bot API file_id of the attached file, carried as the identifier itself.
    string file_id = 2;
  }
}

enum MeetupLifecycle {
  MEETUP_LIFECYCLE_UNSPECIFIED = 0;
  MEETUP_LIFECYCLE_PLANNED = 1;
  MEETUP_LIFECYCLE_HELD = 2;
  MEETUP_LIFECYCLE_CANCELLED = 3;
}

enum MeetupVisibility {
  MEETUP_VISIBILITY_UNSPECIFIED = 0;
  MEETUP_VISIBILITY_HIDDEN = 1;
  MEETUP_VISIBILITY_VISIBLE = 2;
}
