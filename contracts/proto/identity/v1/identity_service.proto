syntax = "proto3";

package identity.v1;

import "identity/v1/roles.proto";

// Resolves Telegram identities and exposes authenticated maintainer operations.
service IdentityService {
  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolveIdentityResponse);
  // Entry on /start: establishes the identity like ResolveIdentity and reports
  // what became of the requested role.
  rpc RequestRole(RequestRoleRequest) returns (RequestRoleResponse);
  // Resolves an internal id back to the Telegram user id of that profile. It is
  // a separate operation and not a mode of ResolveIdentity: that one establishes
  // an identity and creates the profile at first contact, while this one must
  // answer NOT_FOUND for an id it does not know.
  rpc ResolveTelegramUserId(ResolveTelegramUserIdRequest) returns (ResolveTelegramUserIdResponse);
  // Answers whether a known identity holds any of the roles the calling surface
  // accepts, read from current state. The caller names the roles; Identity
  // does not know which surface asks or what it guards.
  rpc CheckGlobalRole(CheckGlobalRoleRequest) returns (CheckGlobalRoleResponse);
  // Answers whether a known identity holds the right now, read from current
  // state: the right that comes with the circle or one granted apart from it.
  rpc CheckAccessRight(CheckAccessRightRequest) returns (CheckAccessRightResponse);
  // Resolves the author of a meetup to their Telegram username for the meetup
  // card.
  rpc ResolveOrganizerUsername(ResolveOrganizerUsernameRequest) returns (ResolveOrganizerUsernameResponse);
  // Grants the global admin role to an existing identity. Requires maintainer authentication.
  rpc GrantAdminRole(GrantAdminRoleRequest) returns (GrantAdminRoleResponse);
  // Revokes the active global admin role. Requires maintainer authentication.
  rpc RevokeAdminRole(RevokeAdminRoleRequest) returns (RevokeAdminRoleResponse);
  // Grants the global maintainer role to an existing identity. Requires maintainer authentication.
  rpc GrantMaintainerRole(GrantMaintainerRoleRequest) returns (GrantMaintainerRoleResponse);
  // Revokes the active global maintainer role. Requires maintainer authentication.
  rpc RevokeMaintainerRole(RevokeMaintainerRoleRequest) returns (RevokeMaintainerRoleResponse);
  // Lists the people holding admin or maintainer, on behalf of a maintainer.
  rpc ListAdministrators(ListAdministratorsRequest) returns (ListAdministratorsResponse);
  // Grants admin, on behalf of a maintainer, to the profile with this username.
  rpc AppointAdministrator(AppointAdministratorRequest) returns (AppointAdministratorResponse);
  // Revokes admin, on behalf of a maintainer.
  rpc DismissAdministrator(DismissAdministratorRequest) returns (DismissAdministratorResponse);
  rpc ListCommunityMembers(ListCommunityMembersRequest) returns (ListCommunityMembersResponse);
  rpc AdmitCommunityMember(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  rpc BlockCommunityMember(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  // Demotes a hub member out of the member circle.
  rpc DemoteCommunityMember(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  // Grants ACCESS_RIGHT_MODERATE_AUCTION to a member or a maintainer, who keeps
  // their circle.
  rpc GrantAuctionModeration(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  // Revokes the granted ACCESS_RIGHT_MODERATE_AUCTION. A right that comes with
  // the circle itself is not revoked by it.
  rpc RevokeAuctionModeration(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  // Lists the people holding ACCESS_RIGHT_MODERATE_AUCTION, on behalf of a
  // holder of ACCESS_RIGHT_MANAGE_MEMBERSHIP.
  rpc ListAuctionModerators(ListAuctionModeratorsRequest) returns (ListAuctionModeratorsResponse);
  // Revokes ACCESS_RIGHT_AUCTION granted to a guest, on behalf of a holder of
  // ACCESS_RIGHT_MODERATE_AUCTION. The guest keeps the circle with whatever
  // rights remain, and the revocation is recorded as a declined application in
  // the auction queue: a later RequestRole there answers DECLINED until the
  // refusal is reconsidered. A right that comes with a circle is not revoked
  // by it.
  rpc RevokeAuctionRight(ChangeCommunityMemberRequest) returns (ChangeCommunityMemberResponse);
  rpc ListAllowedUsernames(ListAllowedUsernamesRequest) returns (ListAllowedUsernamesResponse);
  rpc AddAllowedUsername(ChangeAllowedUsernameRequest) returns (ChangeAllowedUsernameResponse);
  rpc RemoveAllowedUsername(ChangeAllowedUsernameRequest) returns (ChangeAllowedUsernameResponse);
  rpc ReadApplicationQueue(ReadApplicationQueueRequest) returns (ReadApplicationQueueResponse);
  rpc AdmitApplication(DecideApplicationRequest) returns (DecideApplicationResponse);
  rpc DeclineApplication(DecideApplicationRequest) returns (DecideApplicationResponse);
  rpc ListRefusedApplications(ListRefusedApplicationsRequest) returns (ListRefusedApplicationsResponse);
  rpc ReconsiderApplication(ReconsiderApplicationRequest) returns (ReconsiderApplicationResponse);
  rpc ListSourceChannels(ListSourceChannelsRequest) returns (ListSourceChannelsResponse);
  rpc CreateSourceChannel(ChangeSourceChannelRequest) returns (ChangeSourceChannelResponse);
  rpc RenameSourceChannel(ChangeSourceChannelRequest) returns (ChangeSourceChannelResponse);
}

// The caller passes the identity established from the same Telegram update.
// Identity applies authorization from these facts; the bot does not decide it.
message IdentityActor {
  string identity_id = 1;
  repeated GlobalRole global_roles = 2;
}

message CommunityMember {
  string identity_id = 1;
  optional string telegram_username = 2;
  bool admitted = 3;

  // Telegram user id of the profile. Zero means an older server that does not
  // send it: a real id is always positive.
  int64 telegram_user_id = 4;
}

message ListCommunityMembersRequest { IdentityActor actor = 1; }
message ListCommunityMembersResponse { repeated CommunityMember members = 1; }

message ChangeCommunityMemberRequest {
  IdentityActor actor = 1;
  string identity_id = 2;
}
message ChangeCommunityMemberResponse { bool changed = 1; }

// A holder of ACCESS_RIGHT_MODERATE_AUCTION.
message AuctionModerator {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;
  // Username without the leading '@'. Absent when the account has none.
  optional string telegram_username = 2;
  // Telegram user id, for naming a moderator without a username.
  int64 telegram_user_id = 3;
  // True when the right was granted apart from the circle, so that
  // RevokeAuctionModeration takes it away. False when it comes with the
  // administrator circle.
  bool revocable = 4;
}

message ListAuctionModeratorsRequest { IdentityActor actor = 1; }
message ListAuctionModeratorsResponse { repeated AuctionModerator moderators = 1; }

message ListAllowedUsernamesRequest { IdentityActor actor = 1; }
message ListAllowedUsernamesResponse { repeated string usernames = 1; }

message ChangeAllowedUsernameRequest {
  IdentityActor actor = 1;
  string username = 2;
}
message ChangeAllowedUsernameResponse { bool changed = 1; }

// A channel of the source registry: the code of the "s_<code>" deep link
// payload and the label a moderator sees on the application card.
message SourceChannel {
  // Case-sensitive, as Telegram passes the payload.
  string code = 1;
  string label = 2;
}

message ListSourceChannelsRequest { IdentityActor actor = 1; }
message ListSourceChannelsResponse { repeated SourceChannel channels = 1; }

message ChangeSourceChannelRequest {
  IdentityActor actor = 1;
  // Code without the "s_" prefix.
  string code = 2;
  string label = 3;
}
message ChangeSourceChannelResponse { bool changed = 1; }

// How an application was closed. An open application has no outcome.
enum ApplicationOutcome {
  // No value: the field is unset or the outcome is unknown to the consumer.
  APPLICATION_OUTCOME_UNSPECIFIED = 0;

  // A moderator of its queue admitted it.
  APPLICATION_OUTCOME_ADMITTED = 1;

  // Refused without a block, in the application's queue only: the person keeps
  // their circle and rights, and an application in the other queue is untouched.
  APPLICATION_OUTCOME_DECLINED = 2;

  // Refused with a block of the profile. A server that keeps queues apart no
  // longer produces it for a decision; applications refused earlier keep it.
  APPLICATION_OUTCOME_BLOCKED = 3;

  // Closed by a grant of what the queue grants that was not a decision on it.
  APPLICATION_OUTCOME_CLOSED_BY_GRANT = 4;

  // Closed by a block of the profile that was not a refusal of it.
  APPLICATION_OUTCOME_CLOSED_BY_BLOCK = 5;
}

// Position in the queue. Both fields are set together and are copied from a
// card exactly as received.
message ApplicationCursor {
  // created_at of the card, as received.
  string created_at = 1;

  // application_id of the card, as received.
  string application_id = 2;
}

message ApplicationSource {
  // Current label of the channel in the registry. Absent when the code the
  // person came with was unknown to the registry when the application was
  // created, malformed or too long: the source is then "unknown", which is not
  // the same as no source at all. A channel created later does not label it.
  optional string channel_label = 1;
}

message ApplicationCard {
  // Canonical lowercase UUIDv7 string with hyphens.
  string application_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens of the applicant.
  string identity_id = 2;

  // Telegram user id of the applicant, for the tg://user?id= profile link.
  int64 telegram_user_id = 3;

  // Username without the leading '@'. Absent when the account has none.
  optional string telegram_username = 4;

  // Telegram first_name given at the /start that created the application.
  // Absent for applications created by data migration.
  optional string first_name = 5;

  // Superseded by queue: GLOBAL_ROLE_MEMBER for the community queue,
  // GLOBAL_ROLE_GUEST for the auction queue. The server keeps setting it until
  // the field is removed.
  GlobalRole requested_role = 6;

  // Absent when the person came without a source code.
  ApplicationSource source = 7;

  // RFC 3339 instant in UTC with exactly millisecond precision: the moment
  // the application was created.
  string created_at = 8;

  // The queue the application lies in. Never APPLICATION_QUEUE_UNSPECIFIED
  // from a server that sends it.
  ApplicationQueue queue = 9;
}

message ReadApplicationQueueRequest {
  IdentityActor actor = 1;

  // Absent reads from the start of the queue.
  ApplicationCursor after = 2;

  // The queue to read. The two queues are read apart: a cursor of one does
  // not position the other. APPLICATION_QUEUE_UNSPECIFIED, from a caller that
  // does not send it yet, reads both queues together, as before queues.
  ApplicationQueue queue = 3;
}

message ReadApplicationQueueResponse {
  // Absent when no open application lies after the cursor.
  ApplicationCard application = 1;

  // 1-based position of the card among open applications. Zero when there is
  // no card.
  int32 position = 2;

  // Number of open applications, counted in the same read as position.
  int32 total = 3;
}

// The administrator whose act closed an application.
message ApplicationDecider {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Username without the leading '@'. Absent when the account has none.
  optional string telegram_username = 2;

  // Telegram user id, for naming a decider without a username.
  int64 telegram_user_id = 3;
}

message ApplicationDecision {
  // Never APPLICATION_OUTCOME_UNSPECIFIED.
  ApplicationOutcome outcome = 1;

  // Absent when no administrator closed the application: an allowed username
  // redeemed on /start did.
  ApplicationDecider decided_by = 2;

  // RFC 3339 instant in UTC: the moment the application was closed.
  string decided_at = 3;
}

message DecideApplicationRequest {
  IdentityActor actor = 1;

  // Canonical lowercase UUIDv7 string with hyphens.
  string application_id = 2;
}

message DecideApplicationResponse {
  // Exactly one is set.
  oneof result {
    // This call closed the application.
    ApplicationDecision decided = 1;

    // The application had been closed before this call, which changed
    // nothing.
    ApplicationDecision already_decided = 2;
  }
}

message RefusedApplication {
  // Canonical lowercase UUIDv7 string with hyphens.
  string application_id = 1;

  // Canonical lowercase UUIDv7 string with hyphens of the applicant.
  string identity_id = 2;

  // Telegram user id of the applicant.
  int64 telegram_user_id = 3;

  // Username without the leading '@'. Absent when the account has none. There
  // is no first_name: it is erased when the application is decided.
  optional string telegram_username = 4;

  // Superseded by queue and still set, as in ApplicationCard.
  GlobalRole requested_role = 5;

  // Outcome is APPLICATION_OUTCOME_BLOCKED or APPLICATION_OUTCOME_DECLINED.
  ApplicationDecision decision = 6;

  // The queue the application was refused in.
  ApplicationQueue queue = 7;
}

message ListRefusedApplicationsRequest {
  IdentityActor actor = 1;

  // The queue whose refusals to list. APPLICATION_QUEUE_UNSPECIFIED lists both
  // queues, as in ReadApplicationQueueRequest.
  ApplicationQueue queue = 2;
}
message ListRefusedApplicationsResponse { repeated RefusedApplication applications = 1; }

message ReconsiderApplicationRequest {
  IdentityActor actor = 1;

  // Canonical lowercase UUIDv7 string with hyphens of a refused application.
  string application_id = 2;
}

message ReconsiderApplicationResponse {
  // False when the target state had already been reached.
  bool changed = 1;
}

message ResolveIdentityRequest {
  // Telegram user id taken from a Telegram update. The caller establishes it
  // at its own trusted boundary; this message carries no proof of that.
  int64 telegram_user_id = 1;

  // Username without the leading '@'. Absent when the account has none.
  optional string telegram_username = 2;
}

message ResolveIdentityResponse {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Superseded by role and rights. Platform-wide roles; an empty set means an
  // ordinary user. The server keeps setting it until the field is removed.
  repeated GlobalRole global_roles = 2;

  // True when the profile's block mark is on. It is not a role and is never
  // derived from global_roles: blocking revokes active roles, so an empty set
  // alone does not distinguish a blocked profile from one that never started.
  bool blocked = 3;

  // The one active role-circle. GLOBAL_ROLE_UNSPECIFIED means no circle: a
  // person never admitted, or a blocked one.
  GlobalRole role = 4;

  // Rights Identity derived from the circle and the separately granted rights,
  // in no promised order. A surface admits by a right in this set and never by
  // the role. Empty for a blocked profile. Domain permissions are not here; the
  // owning domain applies them.
  repeated AccessRight rights = 5;
}

message RequestRoleRequest {
  // Telegram user id taken from the /start update. The caller establishes it
  // at its own trusted boundary; this message carries no proof of that.
  int64 telegram_user_id = 1;

  // Username without the leading '@'. Absent when the account has none.
  optional string telegram_username = 2;

  // Superseded by queue: GLOBAL_ROLE_MEMBER asks for the community queue,
  // GLOBAL_ROLE_GUEST for the auction queue. Read only when queue is
  // APPLICATION_QUEUE_UNSPECIFIED.
  GlobalRole requested_role = 3;

  // Channel code from the deep link payload "s_<code>", without the "s_"
  // prefix. Untrusted and passed as received; an empty code after "s_" is sent
  // as an empty string. Absent when the payload carries no "s_" prefix.
  optional string source_code = 4;

  // Telegram first_name from the same update, for the moderation card.
  string first_name = 5;

  // The queue the calling surface applies to: the hub bot to the community
  // queue, the auction bot to the auction queue.
  ApplicationQueue queue = 6;
}

// What became of the request in the named queue: of the circle the community
// queue grants or of the right the auction queue grants. Only
// GRANTED_BY_ALLOWLIST means the call itself granted it.
enum RoleRequestOutcome {
  // No value: an outcome unknown to the consumer. The consumer reads it as a
  // refusal.
  ROLE_REQUEST_OUTCOME_UNSPECIFIED = 0;

  // What the queue grants was held before the call, by the circle or as a
  // granted right.
  ROLE_REQUEST_OUTCOME_ALREADY_HELD = 1;

  // An allowed usernames entry was redeemed by this call and granted what the
  // queue grants.
  ROLE_REQUEST_OUTCOME_GRANTED_BY_ALLOWLIST = 2;

  // An application in the queue is open: created by this call or left by an
  // earlier one. The two are not distinguished.
  ROLE_REQUEST_OUTCOME_PENDING = 3;

  // An earlier application in this queue was declined.
  ROLE_REQUEST_OUTCOME_DECLINED = 4;

  // The profile is blocked.
  ROLE_REQUEST_OUTCOME_BLOCKED = 5;
}

message RequestRoleResponse {
  // Canonical lowercase UUIDv7 string with hyphens.
  string identity_id = 1;

  // Superseded by role and rights, as in ResolveIdentityResponse.
  repeated GlobalRole global_roles = 2;

  RoleRequestOutcome outcome = 3;

  // The role-circle after the call, same meaning as in ResolveIdentityResponse.
  GlobalRole role = 4;

  // Rights after the call, same meaning as in ResolveIdentityResponse.
  repeated AccessRight rights = 5;
}

message ResolveTelegramUserIdRequest {
  // Canonical lowercase UUIDv7 string with hyphens: the internal id a consumer
  // of the bus received in an event or in a notification.
  string identity_id = 1;
}

message ResolveTelegramUserIdResponse {
  // Telegram user id of that profile. An unknown identity_id is NOT_FOUND, not
  // a zero here, so a channel cannot mistake "no such person" for a delivery
  // target.
  int64 telegram_user_id = 1;
}

message CheckGlobalRoleRequest {
  // Canonical lowercase UUIDv7 string with hyphens of the person to check.
  string identity_id = 1;

  // Roles the calling surface accepts; holding any one of them grants. The set
  // is matched as given: nested circles are not expanded, so a surface that
  // accepts the member circle lists admin, maintainer and member itself. Must
  // not be empty and must not contain GLOBAL_ROLE_UNSPECIFIED.
  repeated GlobalRole accepted_roles = 2;
}

message CheckGlobalRoleResponse {
  // True only when the identity holds an accepted role right now.
  bool granted = 1;
}

message CheckAccessRightRequest {
  // Canonical lowercase UUIDv7 string with hyphens of the person to check.
  string identity_id = 1;

  // The right the calling surface requires. Must not be
  // ACCESS_RIGHT_UNSPECIFIED.
  AccessRight right = 2;
}

message CheckAccessRightResponse {
  // True only when the identity holds the right right now. A blocked profile
  // holds no right.
  bool granted = 1;
}

message ResolveOrganizerUsernameRequest {
  // The viewer of the card.
  IdentityActor actor = 1;

  // Canonical lowercase UUIDv7 string with hyphens: the author id taken from a
  // meetup snapshot.
  string identity_id = 2;
}

message ResolveOrganizerUsernameResponse {
  // Username without the leading '@'. Absent only when the organizer has none:
  // a profile the call does not answer for is a failed call, never an absent
  // field here.
  optional string telegram_username = 1;
}

message GrantAdminRoleRequest {
  // Canonical lowercase UUID string of an existing profile.
  string identity_id = 1;
}

message GrantAdminRoleResponse {
  // False when the role was already active.
  bool changed = 1;
}

message RevokeAdminRoleRequest {
  // Canonical lowercase UUID string of an existing profile.
  string identity_id = 1;
}

message RevokeAdminRoleResponse {
  // False when there was no active role.
  bool changed = 1;
}

message GrantMaintainerRoleRequest {
  // Canonical lowercase UUID string of an existing profile.
  string identity_id = 1;
}

message GrantMaintainerRoleResponse {
  // False when the role was already active.
  bool changed = 1;
}

message RevokeMaintainerRoleRequest {
  // Canonical lowercase UUID string of an existing profile.
  string identity_id = 1;
}

message RevokeMaintainerRoleResponse {
  // False when there was no active role.
  bool changed = 1;
}

// In the administrator methods below actor.global_roles is ignored: only
// actor.identity_id is read.
message ListAdministratorsRequest { IdentityActor actor = 1; }

message ListAdministratorsResponse { repeated Administrator administrators = 1; }

// A person holding admin, maintainer or both.
message Administrator {
  string identity_id = 1;
  optional string telegram_username = 2;
  // Always positive.
  int64 telegram_user_id = 3;
  // True when the person holds maintainer, with or without admin.
  bool maintainer = 4;
}

message AppointAdministratorRequest {
  IdentityActor actor = 1;
  // Telegram username, with or without the leading '@'; case is ignored.
  string telegram_username = 2;
}

message AppointAdministratorResponse {
  // False when the role was already active.
  bool changed = 1;
  // The person the username resolved to.
  string identity_id = 2;
}

message DismissAdministratorRequest {
  IdentityActor actor = 1;
  // Canonical lowercase UUID string of the person losing admin.
  string identity_id = 2;
}

message DismissAdministratorResponse {
  // False when there was no active role.
  bool changed = 1;
}
