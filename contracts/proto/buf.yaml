version: v2

# Три правила набора DEFAULT исключены осознанно: имена request и response
# выводятся из домена, а не из RPC, и одно сообщение обслуживает несколько
# операций — общий MeetupSnapshot у RPC Meetups, общие request у пар
# Admit/Block и Add/Remove в Identity, общие preferences и BroadcastAccepted
# у Notifications. Решение и причина — docs/architecture/integration.md,
# норматив — docs/standards/contracts/protobuf.md.
lint:
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

# Категория FILE явно, а не по умолчанию: удаление, переименование и смена типа
# поля краснеют, а WIRE пропустил бы переименование.
breaking:
  use:
    - FILE
  # Временное объявленное исключение: значение 4 у GlobalRole (прежде PUBLIC)
  # переименовано в GLOBAL_ROLE_GUEST по ADR-064, п. 10, и все потребители
  # переименованы тем же изменением (PER-525). Провод не меняется, меняется имя.
  # Снимается следующим изменением схем, когда база сравнения уже несёт новое
  # имя; правило — docs/standards/contracts/protobuf.md, «Совместимость».
  ignore_only:
    ENUM_VALUE_SAME_NAME:
      - identity/v1/roles.proto
