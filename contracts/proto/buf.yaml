version: v2

# Три правила набора DEFAULT исключены осознанно: имена request и response
# выводятся из домена, а не из RPC, и одно сообщение обслуживает несколько
# операций — общий MeetupSnapshot у RPC Meetups, общие request у пар
# Admit/Block и Add/Remove в Identity, общие preferences и BroadcastAccepted
# у Notifications. Решение и причина — docs/architecture/integration.md,
# норматив — docs/standards/contracts/protobuf.md.
lint:
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

# Категория FILE явно, а не по умолчанию: удаление, переименование и смена типа
# поля краснеют, а WIRE пропустил бы переименование.
breaking:
  use:
    - FILE
  # Переход без переходного периода по решению владельца (PER-651): поштучные
  # записи прав выдаются, снимаются и читаются общими GrantRight, RevokeRight и
  # ListRightHolders, а GrantAuctionModeration, RevokeAuctionModeration,
  # RevokeAuctionRight, ListAuctionModerators, флаг auction_moderation и фильтр
  # COMMUNITY_FILTER_AUCTION_MODERATORS удалены вместе с переводом бота хаба в
  # том же изменении. Номера и имена зарезервированы. Исключение снимает
  # следующее изменение схем.
  ignore:
    - identity/v1/identity_service.proto
    # Переход без переходного периода по решению владельца (PER-635):
    # NOTIFICATION_CATEGORY_ACCESS_REQUEST удалён, потому что выключение одной
    # категории гасило заявки обеих очередей, не называя этого в подписи.
    # Вместо него — NOTIFICATION_CATEGORY_ACCESS_REQUEST_COMMUNITY и
    # NOTIFICATION_CATEGORY_ACCESS_REQUEST_AUCTION; номер 7 и имя
    # зарезервированы, а сохранённое выключение переносит миграция Notifications
    # на обе новые категории. Исключение снимает следующее изменение схем.
    - notifications/v1/notifications_service.proto
