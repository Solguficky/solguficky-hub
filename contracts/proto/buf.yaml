version: v2

# Три правила набора DEFAULT исключены осознанно: имена request и response
# выводятся из домена, а не из RPC, и одно сообщение обслуживает несколько
# операций — общий MeetupSnapshot у RPC Meetups, общие request у пар
# Admit/Block и Add/Remove в Identity, общие preferences и BroadcastAccepted
# у Notifications. Решение и причина — docs/architecture/integration.md,
# норматив — docs/standards/contracts/protobuf.md.
lint:
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

# Категория FILE явно, а не по умолчанию: удаление, переименование и смена типа
# поля краснеют, а WIRE пропустил бы переименование.
breaking:
  use:
    - FILE
  # Два ломающих перехода подряд, у каждого все потребители меняются тем же
  # изменением, переходного периода нет по решению владельца:
  # - круг без ранга, наборы и права с глаголом (RFC-016 и ADR-065);
  # - ответы ListAdministrators, AppointAdministrator и DismissAdministrator —
  #   отказы значением (PER-521, решение владельца 12 октября 2026 года): у
  #   методов не было потребителя, кроме ручного grpcurl.
  # Исключение снимает следующее изменение схем — база сравнения к тому
  # времени уже несёт новую форму.
  ignore:
    - identity/v1
    - meetups/v1/meetups_service.proto
    - notifications/v1/notifications.proto
