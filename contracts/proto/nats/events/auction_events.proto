syntax = "proto3";
package nats.events;

message BidPlacedEvent {
  string auction_id = 1;
  uint32 lot_id = 2;
  int64 user_id = 3;
  double amount = 4;
  optional int64 previous_leader_id = 5;
  int64 current_leader_id = 6;
  string lot_title = 7;
  double previous_amount = 8;
}

message AuctionStartedEvent {
  string auction_id = 1;
  repeated uint32 lot_ids = 2;
}

message PhaseTransitionedEvent {
  string auction_id = 1;
  string from_phase = 2;
  string to_phase = 3;
}
