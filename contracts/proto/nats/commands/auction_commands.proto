syntax = "proto3";
package nats.commands;

message PlaceBidCommand {
  string op_id = 1;
  string auction_id = 2;
  uint32 lot_id = 3;
  int64 user_id = 4;
  double amount = 5;
}

message SetProxyBidCommand {
  string op_id = 1;
  string auction_id = 2;
  uint32 lot_id = 3;
  int64 user_id = 4;
  double max_amount = 5;
}

message StartAuctionCommand {
  string op_id = 1;
  string auction_id = 2;
}

message TransitionToFinalPhaseCommand {
  string op_id = 1;
  string auction_id = 2;
}
