auction {
  http {
    host = "127.0.0.1"
    host = ${?AUCTION_HTTP_HOST}
    port = 8080
    port = ${?AUCTION_HTTP_PORT}
  }

  # База Auction в форме Pekko Persistence JDBC: URL без учётных данных и
  # отдельно пользователь с паролем — так их отдаёт AppHost. Умолчаний нет:
  # сервис без базы не стартует, и DatabaseSettings называет отсутствующую
  # переменную, а не падает на разборе конфигурации плагина.
  database {
    url = ${?AUCTION_DATABASE_JDBC_URL}
    user = ${?AUCTION_DATABASE_USER}
    password = ${?AUCTION_DATABASE_PASSWORD}
  }

  # gRPC-граница — отдельный порт рядом с HTTP: у gRPC HTTP-статус всегда 200,
  # а код лежит в трейлерах, и запись HTTP-границы на общем порту назвала бы
  # каждый вызов успешным. Health остаётся на HTTP и токена не требует.
  grpc {
    host = "127.0.0.1"
    host = ${?AUCTION_GRPC_HOST}
    port = 8081
    port = ${?AUCTION_GRPC_PORT}

    # Сколько граница ждёт ответа entity лота. Истёкший срок — DEADLINE_EXCEEDED:
    # команда могла быть принята, и повтор с тем же op_id вернёт исходный ответ.
    ask-timeout = 3s

    # Токены вызывающих (ADR-056): переменная на вызывающего, имя — по узлу
    # AppHost (integration.md, «Service authentication»). Умолчаний нет: без
    # токена объявленного вызывающего сервис не стартует.
    callers {
      telegram-bot = ${?AUCTION_CALLER_TOKEN_TELEGRAM_BOT}
      auction-bot = ${?AUCTION_CALLER_TOKEN_AUCTION_BOT}
    }
  }

  # Предел ответа базы на пробу готовности: меньше дедлайна пробы AppHost в
  # 3 секунды, как в ADR-054.
  readiness-timeout = 2s
}

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor.provider = cluster

  # gRPC ходит по HTTP/2 без TLS (h2c prior knowledge). HTTP/1.1 на той же
  # настройке продолжает работать: health отвечает пробе как прежде.
  http.server.enable-http2 = on

  # Одноузловой кластер (ADR-045): узел присоединяется сам к себе в Main,
  # поэтому seed-узлов нет, а порт remoting выбирает ОС — снаружи к нему никто
  # не подключается. Второй узел потребует решения о хостинге и фиксированного
  # адреса.
  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 0
  }

  cluster {
    # ADR-045 требует SBR в конфигурации кластера до того, как появится второй
    # узел: без него раздел сети оставляет обе половины живыми, и шардинг
    # поднимает одну entity дважды.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = keep-majority
  }

  persistence {
    journal.plugin = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }

  # Строка журнала и snapshot лота — JSON модели хранения (ADR формата журнала).
  # Java-сериализация в Pekko выключена по умолчанию, поэтому тип без привязки
  # не уезжает в базу молча, а отказывает при записи.
  actor.serialization-bindings {
    "auction.entity.JournalSerializable" = jackson-json
  }

  serialization.jackson {
    # Время и длительность — строками ISO-8601. Иначе Jackson пишет их дробью
    # секунд, и в строке журнала появляется число с плавающей точкой (ПП-5).
    serialization-features {
      WRITE_DATES_AS_TIMESTAMPS = off
      WRITE_DURATIONS_AS_TIMESTAMPS = off
    }
    # Payload остаётся JSON, который читается в psql через convert_from, а не
    # gzip, в который Pekko сворачивает всё крупнее 32 KiB по умолчанию.
    jackson-json.compression.algorithm = off
  }
}

# Журнал, snapshots и read journal ходят в одну базу через один пул. Схему
# держит Flyway (db/migration), а не плагин: плагин таблиц не создаёт.
pekko-persistence-jdbc.shared-databases.slick {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    url = ${?auction.database.url}
    user = ${?auction.database.user}
    password = ${?auction.database.password}
    driver = "org.postgresql.Driver"
    # Предел установления соединения — свойство сервиса (ADR-054): умолчание
    # плагина — три минуты, и запись в журнал ждала бы соединения с мёртвой
    # базой дольше любого дедлайна. Явный connectTimeout в URL выигрывает у
    # свойства. Запрос на уже открытом соединении, которое сеть оборвала без
    # RST, этот предел не ловит — то же принятое последствие, что в ADR-054.
    connectionTimeout = 2000
    properties {
      connectTimeout = 2
    }
  }
}

jdbc-journal.use-shared-db = "slick"
jdbc-snapshot-store.use-shared-db = "slick"
jdbc-read-journal.use-shared-db = "slick"
