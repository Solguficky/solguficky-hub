version = "3.8.3"
runner.dialect = scala3

# Ширина строки та же, что в .editorconfig: форматтер и редактор не спорят.
maxColumn = 120

# Сгенерированный ScalaPB код лежит в target/ и форматтеру не принадлежит.
project.excludePaths = ["glob:**/target/**"]

align.preset = none
docstrings.style = Asterisk
rewrite.rules = [RedundantBraces, RedundantParens, SortImports]
