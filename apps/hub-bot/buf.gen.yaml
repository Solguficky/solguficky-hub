version: v2
clean: true
plugins:
  # Плагин запускается через node, а не через шим из node_modules/.bin:
  # шим без расширения на Windows не исполняется, а cmd.exe принимает путь
  # с прямыми слэшами за ключи. Сам шим делает ровно этот же exec node.
  - local:
      - node
      - apps/hub-bot/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: apps/hub-bot/gen
    opt:
      - target=ts
      - import_extension=.js
inputs:
  - directory: contracts/proto
    paths:
      # Аукцион у сходки (PER-307): включение, аукцион сходки и чтения ленты и
      # лота. Схему фактов шины бот не читает, но генерирует: снимок аукциона
      # в ответе чтения берёт её типы статусов.
      - contracts/proto/auction/v1/auction.proto
      - contracts/proto/auction/v1/auction_events.proto
      - contracts/proto/auction/v1/auction_service.proto
      - contracts/proto/identity
      - contracts/proto/meetups
      - contracts/proto/notifications
