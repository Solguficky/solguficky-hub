version: v2
clean: true
plugins:
  # Плагин запускается через node, а не через шим из node_modules/.bin:
  # шим без расширения на Windows не исполняется, а cmd.exe принимает путь
  # с прямыми слэшами за ключи. Сам шим делает ровно этот же exec node.
  - local:
      - node
      - apps/auction-bot/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: apps/auction-bot/gen
    opt:
      - target=ts
      - import_extension=.js
inputs:
  - directory: contracts/proto
    paths:
      # Боту аукциона нужны Identity и чтения Auction: лот, лента, имена
      # участников и изображение. Схему фактов аукциона он не читает, но
      # генерирует: снимок аукциона в ответе чтения берёт её типы статусов.
      # Адресный факт Notifications бот читает из шины как канал доставки
      # (PER-328); схема сходок нужна ему только как импорт конверта.
      # Сервисов Meetups и Notifications он не зовёт.
      - contracts/proto/auction/v1/auction.proto
      - contracts/proto/auction/v1/auction_events.proto
      - contracts/proto/auction/v1/auction_service.proto
      - contracts/proto/identity
      - contracts/proto/meetups/v1/meetups.proto
      - contracts/proto/notifications/v1/notifications.proto
