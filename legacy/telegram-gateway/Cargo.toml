[package]
name = "telegram-gateway"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
teloxide = { version = "0.17.0", features = ["macros", "throttle"] }
tokio = { version = "1.32", features = ["full"] }

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Observability
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["json", "env-filter"] }

# Error Handling
anyhow = "1.0.75"
thiserror = "2.0.17"

# NATS
async-nats = "0.44.2"

# Utilities
uuid = { version = "1.4.1", features = ["v7", "serde"] }
once_cell = "1.18.0"
dashmap = "6.1.0"

# Async runtime & channels
futures = "0.3"

# Serialization
serde_json = "1.0"
prost = "0.14.1"
prost-types = "0.14.1"
bytes = "1.5"

[build-dependencies]
tonic-build = "0.14.2"
prost-build = "0.14.1"
glob = "0.3.1"
