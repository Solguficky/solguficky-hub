name: Image Auction Bot

# Production-образ бота аукциона — тот же apps/hub-bot/Containerfile, что у бота
# хаба (image-hub-bot.yml), под своим именем: один пакет на два процесса, и
# поверхность выбирает переменная BOT_SURFACE (ADR-064, п. 18). Отдельное имя
# образа держит выкладку stage прежней, пока его не снимет PER-538. Pull request
# только собирает и проверяет, push в develop публикует кандидата на stage и
# записывает его digest в ops-репозиторий (stage-bump.yml), откуда stage
# выкатывает его сам.

on:
  pull_request:
    paths:
      - 'apps/hub-bot/**'
      - 'shared/typescript/telegram-delivery/**'
      - 'contracts/proto/**'
      - 'tools/image/**'
      - '.github/workflows/image-auction-bot.yml'
      - '.github/workflows/image-publish.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/hub-bot/**'
      - 'shared/typescript/telegram-delivery/**'
      - 'contracts/proto/**'
      - 'tools/image/**'
      - '.github/workflows/image-auction-bot.yml'
      - '.github/workflows/image-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.ref != 'refs/heads/develop' }}
    permissions:
      contents: read
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: auction-bot
      builder: containerfile
      containerfile: apps/hub-bot/Containerfile
      node-lock: apps/hub-bot/package-lock.json
      publish: false

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    concurrency:
      group: image-auction-bot-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: auction-bot
      builder: containerfile
      containerfile: apps/hub-bot/Containerfile
      node-lock: apps/hub-bot/package-lock.json
      publish: true

  stage:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/stage-bump.yml
    with:
      file: stage/test/values.yaml
      key: .parameters.auction_bot.auction_bot_image
      value: ${{ needs.publish.outputs.ref }}
      what: auction-bot image
    secrets:
      OPS_DEPLOY_KEY: ${{ secrets.OPS_DEPLOY_KEY }}
