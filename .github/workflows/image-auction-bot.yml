name: Image Auction Bot

# Production-образ бота аукциона по apps/auction-bot/Containerfile — как образ
# бота хаба (image-hub-bot.yml): pull request только собирает и проверяет, push
# в develop публикует кандидата на stage и записывает его digest в ops-репозиторий
# (stage-bump.yml), откуда stage выкатывает его сам.

on:
  pull_request:
    paths:
      - 'apps/auction-bot/**'
      - 'shared/typescript/telegram-delivery/**'
      - 'contracts/proto/**'
      - 'shared/typescript/auction-bot-ui/**'
      - 'tools/image/**'
      - '.github/workflows/image-auction-bot.yml'
      - '.github/workflows/image-publish.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/auction-bot/**'
      - 'shared/typescript/telegram-delivery/**'
      - 'contracts/proto/**'
      - 'shared/typescript/auction-bot-ui/**'
      - 'tools/image/**'
      - '.github/workflows/image-auction-bot.yml'
      - '.github/workflows/image-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.ref != 'refs/heads/develop' }}
    permissions:
      contents: read
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: auction-bot
      builder: containerfile
      containerfile: apps/auction-bot/Containerfile
      node-lock: apps/auction-bot/package-lock.json
      publish: false

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    concurrency:
      group: image-auction-bot-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: auction-bot
      builder: containerfile
      containerfile: apps/auction-bot/Containerfile
      node-lock: apps/auction-bot/package-lock.json
      publish: true

  stage:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/stage-bump.yml
    with:
      file: stage/test/values.yaml
      key: .parameters.auction_bot.auction_bot_image
      value: ${{ needs.publish.outputs.ref }}
      what: auction-bot image
