name: Chart publish

# Helm-чарт прода, сгенерированный из графа AppHost (ADR-055), публикуется в
# GHCR OCI-артефактом, откуда его тянет HelmRelease Flux. Pull request чарт не
# публикует: его проверяет джоба apphost в ci.yml тем же рецептом
# `just apphost-chart`. Push в develop публикует кандидата, как образы
# (image-*.yml); промоушн — PR в ops-репозиторий, а не пересборка.
#
# Версия — 0.1.<номер прогона>: монотонна, поэтому HelmRelease с диапазоном
# semver видит новую версию без пре-релизных меток, а appVersion связывает чарт
# с коммитом тем же тегом sha-<коммит>, которым помечены образы. Digest образов
# в чарт не попадает: их кладёт ops-репозиторий в values среды.
#
# Отдельный файл, а не джоба в ci.yml: tools/verify/select-recipes.sh читает
# фильтры путей ci.yml как карту механического гейта, а публикация в гейт не входит.

on:
  push:
    branches: [develop]
    paths:
      - 'infra/apphost/AppHost/**'
      - 'apps/meetups/**'
      - 'apps/notifications/**'
      - 'shared/dotnet/**'
      - 'tools/apphost/**'
      - 'justfile'
      - 'global.json'
      - '.github/workflows/chart-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: extractions/setup-just@v4
      - name: Версия Helm
        id: tools
        run: echo "helm=$(grep '^HELM_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v5
        with:
          version: v${{ steps.tools.outputs.helm }}
      # Тот же рецепт, что на PR: чарт, который не прошёл бы проверку, не публикуется.
      - run: just apphost-chart "$RUNNER_TEMP/chart"
      - name: Упаковка
        run: |
          helm package "$RUNNER_TEMP/chart" \
            --version "0.1.${{ github.run_number }}" \
            --app-version "sha-$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/package"
      - name: Публикация в GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Вход через stdin, а не --password: аргументы процесса видны в его argv.
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/package/*.tgz "oci://ghcr.io/$owner/charts"
