name: Chart publish

# Helm-чарт прода, сгенерированный из графа AppHost (ADR-055), публикуется в
# GHCR OCI-артефактом, откуда его тянет HelmRelease Flux. Pull request чарт не
# публикует: его проверяет джоба apphost в ci.yml тем же рецептом
# `just apphost-chart`. Push в stage публикует чарт для stage, push в main —
# для прода, как образы (image-*.yml): каждая среда собирается из своей ветки
# (дополнение ADR-055 от 2026-10-22). Версия уходит в release.yaml данных среды
# в ops-репозитории (ops-bump.yml): stage выкатывает её сам, прод — владелец.
#
# Версия — 0.1.<номер прогона>: монотонна, поэтому HelmRelease с диапазоном
# semver видит новую версию без пре-релизных меток. appVersion — коммит, из
# которого собран чарт, а не версия образов: digest образов в чарт не попадает,
# их кладёт ops-репозиторий в values среды. Ручной запуск публикует только со
# stage и main: чарт с ветки получил бы старшую версию, и диапазон semver
# HelmRelease поставил бы непроверенный чарт. Счётчик прогонов у stage и main
# общий, поэтому версии двух сред перемежаются: среда берёт точную версию из
# своего release.yaml, а не старшую из реестра.
#
# Отдельный файл, а не джоба в ci.yml: tools/verify/select-recipes.sh читает
# фильтры путей ci.yml как карту механического гейта, а публикация в гейт не входит.

on:
  push:
    branches: [stage, main]
    paths:
      - 'infra/apphost/AppHost/**'
      - 'apps/meetups/**'
      - 'apps/notifications/**'
      - 'shared/dotnet/**'
      - 'tools/apphost/**'
      - 'justfile'
      - 'global.json'
      - '.github/workflows/chart-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: extractions/setup-just@v4
      - name: Helm из justfile
        run: sh tools/apphost/install-helm.sh >> "$GITHUB_PATH"
      # Тот же рецепт, что на PR: чарт, который не прошёл бы проверку, не публикуется.
      - run: just apphost-chart "$RUNNER_TEMP/chart"
      - name: Упаковка
        id: package
        run: |
          echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          helm package "$RUNNER_TEMP/chart" \
            --version "0.1.${{ github.run_number }}" \
            --app-version "sha-$GITHUB_SHA" \
            --destination "$RUNNER_TEMP/package"
      - name: Публикация в GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Вход через stdin, а не --password: аргументы процесса видны в его argv.
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/package/*.tgz "oci://ghcr.io/$owner/charts"

  ops:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/ops-bump.yml
    with:
      file: release.yaml
      key: .version
      value: ${{ needs.publish.outputs.version }}
      what: chart
      # Номер прогона монотонен: перезапуск старого прогона не понизит версию среды.
      monotonic: true
    secrets:
      OPS_DEPLOY_KEY: ${{ secrets.OPS_DEPLOY_KEY }}
