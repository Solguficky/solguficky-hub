name: Image Notifications

# Production-образ Notifications. Pull request только собирает образ и проверяет его:
# в GHCR ничего не пишется, и права записи код из PR не получает. Push в stage
# публикует образ для stage, push в main — для прода: каждая среда собирается
# из своей ветки, и digest прода — своя сборка, а не digest stage (дополнение
# ADR-055 от 2026-10-22).
#
# Отдельный файл, а не джоба в ci.yml: tools/verify/select-recipes.sh читает
# фильтры путей ci.yml как карту механического гейта, а образ в гейт не входит.

on:
  pull_request:
    paths:
      - 'apps/notifications/**'
      - 'shared/dotnet/**'
      - 'contracts/proto/**'
      - 'global.json'
      - '.github/workflows/image-notifications.yml'
      - '.github/workflows/image-publish.yml'
  push:
    branches: [stage, main]
    paths:
      - 'apps/notifications/**'
      - 'shared/dotnet/**'
      - 'contracts/proto/**'
      - 'global.json'
      - '.github/workflows/image-notifications.yml'
      - '.github/workflows/image-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.ref != 'refs/heads/stage' && github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: notifications
      builder: dotnet-sdk
      project: apps/notifications/Notifications
      publish: false

  publish:
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main') }}
    # Публикации по очереди: тег sha-<коммит> одного прогона не должен
    # перевесить другой, пока первый читает digest и аттестует его.
    concurrency:
      group: image-notifications-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: notifications
      builder: dotnet-sdk
      project: apps/notifications/Notifications
      publish: true

  # Digest уходит в данные среды ветки в ops-репозитории (ops-bump.yml): stage
  # выкатывает его сам, прод — владелец (дополнение ADR-055 от 2026-10-22).
  ops:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/ops-bump.yml
    with:
      file: values.yaml
      key: .parameters.notifications.notifications_image
      value: ${{ needs.publish.outputs.ref }}
      what: notifications image
    secrets:
      OPS_DEPLOY_KEY: ${{ secrets.OPS_DEPLOY_KEY }}
