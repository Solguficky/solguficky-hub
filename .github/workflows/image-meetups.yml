name: Image Meetups

# Production-образ Meetups. Pull request только собирает образ и проверяет его:
# в GHCR ничего не пишется, и права записи код из PR не получает. Push в develop
# публикует образ — кандидата на stage. Мерж в main образ не пересобирает: на
# прод едет тот же digest, что прошёл stage (RFC-010: «Production build
# повторно не выполняется»), и это забота выкатки, а не этого workflow.
#
# Отдельный файл, а не джоба в ci.yml: tools/verify/select-recipes.sh читает
# фильтры путей ci.yml как карту механического гейта, а образ в гейт не входит.

on:
  pull_request:
    paths:
      - 'apps/meetups/**'
      - 'shared/dotnet/**'
      - 'contracts/proto/**'
      - 'global.json'
      - '.github/workflows/image-meetups.yml'
      - '.github/workflows/image-publish.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/meetups/**'
      - 'shared/dotnet/**'
      - 'contracts/proto/**'
      - 'global.json'
      - '.github/workflows/image-meetups.yml'
      - '.github/workflows/image-publish.yml'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: ${{ github.ref != 'refs/heads/develop' }}
    permissions:
      contents: read
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: meetups
      builder: dotnet-sdk
      project: apps/meetups/Meetups
      publish: false

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    # Публикации по очереди: тег sha-<коммит> одного прогона не должен
    # перевесить другой, пока первый читает digest и аттестует его.
    concurrency:
      group: image-meetups-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/image-publish.yml
    with:
      image-name: meetups
      builder: dotnet-sdk
      project: apps/meetups/Meetups
      publish: true

  # Кандидат stage: digest уходит в ops-репозиторий, откуда stage выкатывает
  # его сам (stage-bump.yml, дополнение ADR-055 от 2026-10-07).
  stage:
    needs: publish
    permissions: {}
    uses: ./.github/workflows/stage-bump.yml
    with:
      file: stage/test/values.yaml
      key: .parameters.meetups.meetups_image
      value: ${{ needs.publish.outputs.ref }}
      what: meetups image
