name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'contracts/proto/**'
              - 'apps/identity/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/identity/go.sum
      - id: tools
        run: echo "buf=$(grep '^BUF_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.tools.outputs.buf }}
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go google.golang.org/grpc/cmd/protoc-gen-go-grpc
        working-directory: apps/identity
      - run: buf generate --template apps/identity/buf.gen.yaml
      - run: go test ./...
        working-directory: apps/identity
