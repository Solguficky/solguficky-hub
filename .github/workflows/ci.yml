name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      telegram-bot: ${{ steps.filter.outputs.telegram-bot }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'contracts/proto/**'
              - 'apps/identity/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            telegram-bot:
              - 'contracts/proto/**'
              - 'apps/telegram-bot/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IDENTITY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/identity?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/identity/go.mod
          cache-dependency-path: apps/identity/go.sum
      - id: tools
        run: |
          echo "buf=$(grep '^BUF_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(grep '^GOLANGCI_LINT_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - run: go install tool
        working-directory: apps/identity
      - run: buf generate --template apps/identity/buf.gen.yaml
      - run: go build ./...
        working-directory: apps/identity
      - run: go test ./...
        working-directory: apps/identity
      # Отдельным шагом: -race требует cgo и на Windows-машине разработчика
      # не запускается без toolchain C, поэтому детектор гонок живёт в CI.
      - run: go test -race ./...
        working-directory: apps/identity
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ steps.tools.outputs.golangci }}
          working-directory: apps/identity
          install-mode: goinstall
          args: --timeout 5m

  telegram-bot:
    needs: changes
    if: needs.changes.outputs.telegram-bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/telegram-bot/package-lock.json
      - id: tools
        run: echo "buf=$(grep '^BUF_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - run: npm ci
        working-directory: apps/telegram-bot
      - run: buf generate --template apps/telegram-bot/buf.gen.yaml
      - run: npm run typecheck
        working-directory: apps/telegram-bot
      - run: npm run lint
        working-directory: apps/telegram-bot
      - run: npm test
        working-directory: apps/telegram-bot
      - run: npm run build
        working-directory: apps/telegram-bot

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent tooling is generated from Skillshare sources
        run: sh tools/skillshare/check-generated.sh
