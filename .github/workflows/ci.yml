name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'contracts/proto/**'
              - 'apps/identity/**'
              - 'justfile'
              - '.github/workflows/ci.yml'

  identity:
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/identity/go.mod
          cache-dependency-path: apps/identity/go.sum
      - id: tools
        run: |
          echo "buf=$(grep '^BUF_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "golangci=$(grep '^GOLANGCI_LINT_VERSION' justfile | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ github.token }}
      - run: go install tool
        working-directory: apps/identity
      - run: buf generate --template apps/identity/buf.gen.yaml
      - run: go build ./...
        working-directory: apps/identity
      - run: go test ./...
        working-directory: apps/identity
      # Отдельным шагом: -race требует cgo и на Windows-машине разработчика
      # не запускается без toolchain C, поэтому детектор гонок живёт в CI.
      - run: go test -race ./...
        working-directory: apps/identity
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ steps.tools.outputs.golangci }}
          working-directory: apps/identity
          install-mode: goinstall
          args: --timeout 5m

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent tooling is generated from Skillshare sources
        run: sh tools/skillshare/check-generated.sh
